<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Selecionar Equipamentos</title>
  <script src="https://cdn.tailwindcss.com"></script>

<style id="sgce-responsive-patch">
  html { font-size: clamp(13px, 0.80rem + 0.25vw, 16px); }
  body { overflow-x: hidden; }
  img, svg, canvas, video { max-width: 100%; height: auto; }
  input, select, textarea, button { max-width: 100%; }
  @media (max-width: 1280px) {
    .max-w-7xl, .max-w-6xl, .max-w-5xl, .max-w-4xl { max-width: 100% !important; }
  }
  @media (max-width: 1024px) {
    .text-3xl { font-size: 1.6rem !important; line-height: 2rem !important; }
    .text-2xl { font-size: 1.35rem !important; line-height: 1.8rem !important; }
    .text-xl { font-size: 1.15rem !important; line-height: 1.55rem !important; }
    .p-6, .p-5 { padding: 1rem !important; }
    .px-6 { padding-left: 1rem !important; padding-right: 1rem !important; }
    .py-8 { padding-top: 1rem !important; padding-bottom: 1rem !important; }
  }
  @media (max-width: 768px) {
    table { display: block; width: 100%; overflow-x: auto; white-space: nowrap; }
    [class*="grid-cols-2"], [class*="grid-cols-3"], [class*="grid-cols-4"], [class*="grid-cols-5"], [class*="grid-cols-6"] {
      grid-template-columns: minmax(0, 1fr) !important;
    }
    .min-w-72 { min-width: 100% !important; }
    .text-sm { font-size: 0.82rem !important; }
    .text-base { font-size: 0.92rem !important; }
    .text-lg { font-size: 1rem !important; }
    .rounded-2xl { border-radius: 1rem !important; }
    [class*="max-w-"] { max-width: 100% !important; }
  }
  @media (max-width: 640px) {
    body[class*="p-6"] { padding: 1rem !important; }
    .px-4 { padding-left: 0.75rem !important; padding-right: 0.75rem !important; }
    .py-3, .py-2 { padding-top: 0.65rem !important; padding-bottom: 0.65rem !important; }
    .gap-4 { gap: 0.75rem !important; }
    .gap-3 { gap: 0.65rem !important; }
  }
</style>

</head>
<body class="bg-slate-900 text-slate-100 min-h-screen">
  <header class="bg-slate-800 border-b border-slate-700 px-6 py-4">
    <div class="max-w-5xl mx-auto flex items-center justify-between gap-4">
      <div>
        <h1 class="text-2xl font-bold text-emerald-400">Selecionar Equipamentos</h1>
        <p class="text-slate-300">Selecione os números dos equipamentos retirados.</p>
      </div>
      <button onclick="history.back()" class="rounded-xl bg-slate-700 hover:bg-slate-600 px-4 py-3 font-semibold">Voltar</button>
    </div>
  </header>

  <main class="max-w-5xl mx-auto px-6 py-8">
    <div class="bg-slate-800 border border-slate-700 rounded-2xl p-6">
      <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
        <div class="bg-slate-900 border border-slate-700 rounded-xl p-4">
          <div class="text-slate-400 text-sm">Quantidade solicitada</div>
          <div id="quantidadeSolicitada" class="text-2xl font-bold text-emerald-400">0</div>
        </div>
        <div class="bg-slate-900 border border-slate-700 rounded-xl p-4">
          <div class="text-slate-400 text-sm">Disponíveis</div>
          <div id="qtdDisponiveis" class="text-2xl font-bold">0</div>
        </div>
        <div class="bg-slate-900 border border-slate-700 rounded-xl p-4">
          <div class="text-slate-400 text-sm">Selecionados</div>
          <div id="qtdSelecionados" class="text-2xl font-bold text-cyan-400">0</div>
        </div>
      </div>

      <div id="equipamentos" class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-5 gap-3"></div>
      <p id="vazio" class="hidden text-amber-300 mt-2">Nenhum equipamento disponível encontrado no inventário.</p>

      <div class="mt-6 flex gap-3">
        <button onclick="salvar()" class="flex-1 rounded-xl bg-emerald-600 hover:bg-emerald-500 px-4 py-3 font-semibold">Salvar equipamentos</button>
        <button onclick="history.back()" class="rounded-xl bg-slate-700 hover:bg-slate-600 px-4 py-3 font-semibold">Voltar</button>
      </div>
      <p id="mensagem" class="text-sm text-amber-300 mt-3"></p>
    </div>
  </main>

  <script>
    const retiradaId = {{ retirada_id|tojson }};
    let quantidade = 0;
    let equipamentos = [];

    function atualizarContador() {
      const qtd = document.querySelectorAll('.equipamento-check:checked').length;
      document.getElementById('qtdSelecionados').textContent = qtd;
    }

    async function carregar() {
      const msg = document.getElementById('mensagem');
      msg.textContent = '';
      try {
        const resp = await fetch(`/api/tecnologia/retirada/${retiradaId}/equipamentos_disponiveis`);
        const data = await resp.json();
        if (!data.success) {
          msg.textContent = data.message || 'Erro ao carregar equipamentos';
          return;
        }

        quantidade = Number(data.retirada?.quantidade || 0);
        equipamentos = Array.isArray(data.equipamentos) ? data.equipamentos : [];
        document.getElementById('quantidadeSolicitada').textContent = quantidade;
        document.getElementById('qtdDisponiveis').textContent = equipamentos.length;
        const box = document.getElementById('equipamentos');
        const vazio = document.getElementById('vazio');
        if (!equipamentos.length) {
          box.innerHTML = '';
          vazio.classList.remove('hidden');
          if (data.debug_erros && data.debug_erros.length) {
            msg.textContent = data.debug_erros[0];
          }
          return;
        }
        vazio.classList.add('hidden');
        box.innerHTML = equipamentos.map(eq => `
          <label class="flex items-center gap-2 bg-slate-900 border border-slate-700 rounded-xl px-3 py-3 cursor-pointer hover:border-emerald-500">
            <input type="checkbox" value="${eq.id}" data-numero="${eq.numero}" class="equipamento-check" onchange="atualizarContador()">
            <span class="font-semibold">${eq.numero}</span>
          </label>
        `).join('');
        atualizarContador();
      } catch (e) {
        msg.textContent = 'Erro ao carregar equipamentos';
      }
    }

    async function salvar() {
      const checks = [...document.querySelectorAll('.equipamento-check:checked')];
      const msg = document.getElementById('mensagem');
      if (checks.length !== quantidade) {
        msg.textContent = `Selecione exatamente ${quantidade} equipamento(s).`;
        return;
      }

      const payload = {
        equipamentos: checks.map(c => ({ id: Number(c.value), numero: c.dataset.numero }))
      };

      const resp = await fetch(`/api/tecnologia/retirada/${retiradaId}/equipamentos`, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(payload)
      });
      const data = await resp.json();
      if (!data.success) {
        msg.textContent = data.message || 'Erro ao salvar';
        return;
      }
      window.location.href = `/tecnologia/retirada/${retiradaId}/responsaveis`;
    }

    carregar();
  </script>
</body>
</html>
