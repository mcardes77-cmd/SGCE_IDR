<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestão de Frequência</title>
  <script src="https://cdn.tailwindcss.com"></script>

<style id="sgce-responsive-patch">
  html { font-size: clamp(13px, 0.80rem + 0.25vw, 16px); }
  body { overflow-x: hidden; }
  img, svg, canvas, video { max-width: 100%; height: auto; }
  input, select, textarea, button { max-width: 100%; }
  @media (max-width: 1280px) {
    .max-w-7xl, .max-w-6xl, .max-w-5xl, .max-w-4xl { max-width: 100% !important; }
  }
  @media (max-width: 1024px) {
    .text-3xl { font-size: 1.6rem !important; line-height: 2rem !important; }
    .text-2xl { font-size: 1.35rem !important; line-height: 1.8rem !important; }
    .text-xl { font-size: 1.15rem !important; line-height: 1.55rem !important; }
    .p-6, .p-5 { padding: 1rem !important; }
    .px-6 { padding-left: 1rem !important; padding-right: 1rem !important; }
    .py-8 { padding-top: 1rem !important; padding-bottom: 1rem !important; }
  }
  @media (max-width: 768px) {
    table { display: block; width: 100%; overflow-x: auto; white-space: nowrap; }
    [class*="grid-cols-2"], [class*="grid-cols-3"], [class*="grid-cols-4"], [class*="grid-cols-5"], [class*="grid-cols-6"] {
      grid-template-columns: minmax(0, 1fr) !important;
    }
    .min-w-72 { min-width: 100% !important; }
    .text-sm { font-size: 0.82rem !important; }
    .text-base { font-size: 0.92rem !important; }
    .text-lg { font-size: 1rem !important; }
    .rounded-2xl { border-radius: 1rem !important; }
    [class*="max-w-"] { max-width: 100% !important; }
  }
  @media (max-width: 640px) {
    body[class*="p-6"] { padding: 1rem !important; }
    .px-4 { padding-left: 0.75rem !important; padding-right: 0.75rem !important; }
    .py-3, .py-2 { padding-top: 0.65rem !important; padding-bottom: 0.65rem !important; }
    .gap-4 { gap: 0.75rem !important; }
    .gap-3 { gap: 0.65rem !important; }
  }
</style>

</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-4 md:p-6">
  <div class="max-w-7xl mx-auto space-y-5">
    <header class="flex flex-col md:flex-row md:items-end md:justify-between gap-4">
      <div>
        <h1 class="text-2xl md:text-3xl font-bold text-emerald-400">GESTÃO DE FREQUÊNCIA</h1>
        <p class="text-slate-400">Lançamento diário de presença e falta.</p>
      </div>
      <div class="flex flex-wrap gap-2">
        <a href="/dashboard_frequencia" class="bg-violet-700 hover:bg-violet-600 px-3 py-2 rounded-lg font-semibold">Dashboard Frequência</a>
        <a href="/dashboard_geral" class="bg-slate-700 hover:bg-slate-600 px-3 py-2 rounded-lg font-semibold">Dashboard Geral</a>
      </div>
    </header>

    <section class="bg-slate-800 rounded-xl p-4 border border-slate-700">
      <div class="grid grid-cols-1 md:grid-cols-4 gap-3">
        <div><label class="block text-xs text-slate-400 mb-1">Sala</label><select id="sala_id" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2"><option value="">Selecione...</option></select></div>
        <div><label class="block text-xs text-slate-400 mb-1">Data</label><input id="data_ref" type="date" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2"></div>
        <div class="md:col-span-2 flex items-end gap-2">
          <button onclick="carregarAlunos()" class="flex-1 bg-emerald-600 hover:bg-emerald-500 px-4 py-2 rounded-lg font-semibold">Carregar alunos</button>
          <button onclick="salvarFrequencia()" class="flex-1 bg-blue-700 hover:bg-blue-600 px-4 py-2 rounded-lg font-semibold">Salvar frequência</button>
        </div>
      </div>
    </section>

    <section class="bg-slate-800 rounded-xl p-4 border border-slate-700">
      <div class="text-sm text-slate-400 mb-3">P = Presença | F = Falta</div>
      <div class="overflow-x-auto">
        <table class="w-full text-sm">
          <thead><tr class="border-b border-slate-700 text-slate-300"><th class="text-left py-2 px-2">Aluno</th><th class="text-left py-2 px-2">Sala</th><th class="text-left py-2 px-2">Status</th></tr></thead>
          <tbody id="tbodyAlunos"></tbody>
        </table>
      </div>
    </section>
  </div>
<script>
let salas = [];
let alunos = [];
let registrosExistentes = [];
let estadoPorAluno = {};
const ordemStatus = ['P', 'F'];
function hojeISO(){const a=new Date();return `${a.getFullYear()}-${String(a.getMonth()+1).padStart(2,'0')}-${String(a.getDate()).padStart(2,'0')}`;}
function horaAgora(){const a=new Date();return `${String(a.getHours()).padStart(2,'0')}:${String(a.getMinutes()).padStart(2,'0')}`;}
function corStatus(status){switch(status){case 'P':return 'bg-emerald-600 hover:bg-emerald-500';case 'F':return 'bg-red-600 hover:bg-red-500';case 'PA':return 'bg-amber-500 hover:bg-amber-400 text-slate-900';case 'PS':return 'bg-blue-600 hover:bg-blue-500';case 'PAS':return 'bg-fuchsia-600 hover:bg-fuchsia-500';default:return 'bg-slate-700 hover:bg-slate-600';}}
async function carregarSalas(){const r=await fetch('/api/salas');salas=await r.json();const select=document.getElementById('sala_id');select.innerHTML='<option value="">Selecione...</option>'; (salas||[]).forEach(s=>{select.innerHTML += `<option value="${s.id}">${s.nome||s.sala||''}</option>`;});}
async function carregarRegistrosExistentes(salaId,dataRef){const r=await fetch(`/api/frequencia/listar?sala_id=${salaId}&data=${dataRef}`);registrosExistentes=await r.json();}
async function carregarAlunos(){
  const salaId=document.getElementById('sala_id').value;
  const dataRef=document.getElementById('data_ref').value;
  if(!salaId){alert('Selecione a sala.');return;}
  await carregarRegistrosExistentes(salaId,dataRef);
  const r=await fetch(`/api/alunos_por_sala/${salaId}`);
  alunos=await r.json();
  estadoPorAluno={};
  (alunos||[]).forEach(a=>{
    const existente=registrosExistentes.find(x=>String(x.aluno_id)===String(a.id));
    const statusBackend=(existente?.status||'P').toUpperCase();
    const statusTela=statusBackend==='PSA'?'PAS':statusBackend;
    estadoPorAluno[a.id]={
      aluno_id:a.id,
      aluno_nome:a.nome||a.aluno_nome||'',
      sala_id:salaId,
      sala_nome:a.sala_nome||(salas.find(s=>String(s.id)===String(salaId))?.nome||''),
      data:dataRef,
      status:(statusTela==='F'?'F':'P'),
      hora_entrada:'',
      hora_saida:'',
      motivo_atraso:'',
      motivo_saida:''
    };
  });
  renderTabela();
}
function proximoStatus(statusAtual){const idx=ordemStatus.indexOf(statusAtual);return idx===-1?'P':ordemStatus[(idx+1)%ordemStatus.length];}
function alternarStatus(alunoId){
  const registro=estadoPorAluno[alunoId];
  registro.status=proximoStatus(registro.status);
  renderTabela();
}
function atualizarCampo(alunoId,campo,valor){estadoPorAluno[alunoId][campo]=valor;}
function renderTabela(){
  const body=document.getElementById('tbodyAlunos');
  if(!(alunos||[]).length){body.innerHTML='<tr><td colspan="3" class="py-4 px-2 text-slate-400">Nenhum aluno encontrado para esta sala.</td></tr>';return;}
  body.innerHTML=alunos.map(a=>{
    const r=estadoPorAluno[a.id];
    return `<tr class="border-b border-slate-800 align-top">
      <td class="py-2 px-2">${r.aluno_nome}</td>
      <td class="py-2 px-2">${r.sala_nome}</td>
      <td class="py-2 px-2"><button onclick="alternarStatus(${a.id})" class="${corStatus(r.status)} px-3 py-2 rounded-lg font-bold min-w-[70px]">${r.status}</button></td>
    </tr>`;
  }).join('');
}
async function salvarFrequencia(){
  const registros=Object.values(estadoPorAluno).map(r=>({
    aluno_id:r.aluno_id, aluno_nome:r.aluno_nome, sala_id:r.sala_id, sala_nome:r.sala_nome, data:r.data,
    status:r.status, hora_entrada:null, hora_saida:null, motivo_atraso:'', motivo_saida:''
  }));
  const r=await fetch('/api/frequencia/salvar',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(registros)});
  const j=await r.json();
  if(!r.ok||!j.success){alert(j.error||'Erro ao salvar frequência.');return;}
  alert('Frequência salva com sucesso.');
  await carregarAlunos();
}
document.getElementById('data_ref').value=hojeISO();
carregarSalas();
</script>

<footer class="mt-8 border-t border-slate-700 pt-4 text-center text-sm text-slate-400">
  <p><strong>Desenvolvido e Registrado por Marcelo André Nogueira Cardes</strong></p>
  <p>Licença Cortesia E. E. Professora Irene Dias Ribeiro</p>
</footer>
</body>
</html>
