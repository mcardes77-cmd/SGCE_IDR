<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Frequência Avançada</title><script src="https://cdn.tailwindcss.com"></script></head>
<body class="bg-slate-900 text-white p-6"><div class="max-w-7xl mx-auto"><header class="mb-8 flex justify-between items-center"><h1 class="text-3xl font-bold text-emerald-400">Registro de Frequência Avançada</h1><button onclick="window.location.href='/'" class="bg-slate-700 hover:bg-slate-600 px-4 py-2 rounded-lg">Voltar</button></header><div id="msg" class="hidden mb-4 px-4 py-3 rounded"></div><section class="bg-slate-800 rounded-2xl shadow p-6 mb-6"><div class="grid grid-cols-1 md:grid-cols-3 gap-4"><div><label class="block text-sm text-slate-300 mb-1">Sala</label><select id="sala" class="w-full rounded-lg bg-slate-700 border border-slate-600 p-3"></select></div><div><label class="block text-sm text-slate-300 mb-1">Data</label><input id="data" type="date" class="w-full rounded-lg bg-slate-700 border border-slate-600 p-3"></div><div class="flex items-end gap-3"><button onclick="carregar()" class="bg-blue-600 hover:bg-blue-700 px-4 py-3 rounded-lg font-semibold">Carregar</button><button onclick="salvar()" class="bg-emerald-600 hover:bg-emerald-700 px-4 py-3 rounded-lg font-semibold">Salvar</button></div></div></section><section class="bg-slate-800 rounded-2xl shadow overflow-hidden"><div class="overflow-x-auto"><table class="w-full"><thead class="bg-slate-700 text-slate-300"><tr><th class="p-3 text-left">Aluno</th><th class="p-3 text-left">Status</th><th class="p-3 text-left">Hora Entrada</th><th class="p-3 text-left">Hora Saída</th><th class="p-3 text-left">Motivo Atraso</th><th class="p-3 text-left">Motivo Saída</th></tr></thead><tbody id="lista"></tbody></table></div></section></div><script>
let alunos=[];let freqAtual=[];
function show(msg,tipo='info'){const el=document.getElementById('msg');el.textContent=msg;el.className='mb-4 px-4 py-3 rounded text-white';if(tipo==='error')el.classList.add('bg-red-600');else if(tipo==='success')el.classList.add('bg-green-600');else el.classList.add('bg-blue-600');el.classList.remove('hidden');}
document.addEventListener('DOMContentLoaded', async ()=>{const r=await fetch('/api/salas');const salas=await r.json();document.getElementById('sala').innerHTML='<option value="">Selecione a sala</option>'+(salas||[]).map(s=>`<option value="${s.id}">${s.nome||''}</option>`).join('');document.getElementById('data').value=new Date().toISOString().slice(0,10);});
async function carregar(){const sala=document.getElementById('sala').value;const data=document.getElementById('data').value;if(!sala||!data){show('Selecione sala e data.','error');return;}const resAlunos=await fetch('/api/alunos_por_sala/'+sala);alunos=await resAlunos.json();const resFreq=await fetch(`/api/frequencia/listar?sala_id=${sala}&data=${data}`);freqAtual=await resFreq.json();const tbody=document.getElementById('lista');tbody.innerHTML='';alunos.forEach(a=>{const f=freqAtual.find(x=>String(x.aluno_id)===String(a.id))||{};tbody.innerHTML+=`<tr class="border-b border-slate-800"><td class="p-3">${a.nome||''}</td><td class="p-3"><select id="status_${a.id}" class="bg-slate-700 rounded p-2"><option value="P" ${f.status==='P'?'selected':''}>P</option><option value="F" ${f.status==='F'?'selected':''}>F</option><option value="PA" ${f.status==='PA'?'selected':''}>PA</option><option value="PS" ${f.status==='PS'?'selected':''}>PS</option><option value="PSA" ${f.status==='PSA'?'selected':''}>PSA</option></select></td><td class="p-3"><input id="entrada_${a.id}" type="time" class="bg-slate-700 rounded p-2" value="${f.hora_entrada||''}"></td><td class="p-3"><input id="saida_${a.id}" type="time" class="bg-slate-700 rounded p-2" value="${f.hora_saida||''}"></td><td class="p-3"><input id="mot_atr_${a.id}" class="bg-slate-700 rounded p-2 w-full" value="${f.motivo_atraso||''}"></td><td class="p-3"><input id="mot_sai_${a.id}" class="bg-slate-700 rounded p-2 w-full" value="${f.motivo_saida||''}"></td></tr>`;});}
async function salvar(){const sala=document.getElementById('sala').value;const data=document.getElementById('data').value;let payload=[];alunos.forEach(a=>{payload.push({aluno_id:a.id,sala_id:sala,data:data,status:document.getElementById('status_'+a.id).value,hora_entrada:document.getElementById('entrada_'+a.id).value||null,hora_saida:document.getElementById('saida_'+a.id).value||null,motivo_atraso:document.getElementById('mot_atr_'+a.id).value||null,motivo_saida:document.getElementById('mot_sai_'+a.id).value||null,updated_at:new Date().toISOString()});});const r=await fetch('/api/frequencia/salvar',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});const d=await r.json();if(!r.ok||!d.success){show(d.error||'Erro ao salvar frequência.','error');return;}show('Frequência salva com sucesso.','success');}
</script></body></html>
