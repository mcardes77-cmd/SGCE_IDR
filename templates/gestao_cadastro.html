<!DOCTYPE html>
<html lang="pt-BR">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Gestão de Cadastro</title><script src="https://cdn.tailwindcss.com"></script></head>
<body class="bg-slate-900 text-white min-h-screen p-6">
<div class="max-w-7xl mx-auto">
<header class="mb-8 flex justify-between items-center"><div><h1 class="text-3xl font-bold text-emerald-400">Gestão de Cadastro</h1><p class="text-slate-400">Consulta de alunos, salas e funcionários.</p></div><button onclick="window.location.href='/'" class="bg-slate-700 hover:bg-slate-600 px-4 py-2 rounded-lg">Voltar</button></header>
<section class="grid grid-cols-1 md:grid-cols-3 gap-6">
  <div class="bg-slate-800 rounded-2xl shadow overflow-hidden">
    <div class="px-5 py-4 border-b border-slate-700 font-semibold text-emerald-400">Alunos</div>
    <div id="lista-alunos" class="p-5 space-y-3 text-sm"></div>
  </div>
  <div class="bg-slate-800 rounded-2xl shadow overflow-hidden">
    <div class="px-5 py-4 border-b border-slate-700 font-semibold text-emerald-400">Salas</div>
    <div id="lista-salas" class="p-5 space-y-3 text-sm"></div>
  </div>
  <div class="bg-slate-800 rounded-2xl shadow overflow-hidden">
    <div class="px-5 py-4 border-b border-slate-700 font-semibold text-emerald-400">Funcionários</div>
    <div id="lista-funcs" class="p-5 space-y-3 text-sm"></div>
  </div>
</section>
</div>
<script>
async function carregar(){
 const [a,s,f] = await Promise.all([
   fetch('/api/cadastro/alunos').then(r=>r.json()),
   fetch('/api/cadastro/salas').then(r=>r.json()),
   fetch('/api/cadastro/funcionarios').then(r=>r.json())
 ]);
 document.getElementById('lista-alunos').innerHTML = (a||[]).slice(0,50).map(x=>`<div class="rounded-lg bg-slate-900 p-3"><div class="font-semibold">${x.nome||''}</div><div class="text-slate-400">${x.sala_nome||''}</div></div>`).join('') || '<div class="text-slate-400">Sem alunos.</div>';
 document.getElementById('lista-salas').innerHTML = (s||[]).map(x=>`<div class="rounded-lg bg-slate-900 p-3">${x.nome||''}</div>`).join('') || '<div class="text-slate-400">Sem salas.</div>';
 document.getElementById('lista-funcs').innerHTML = (f||[]).slice(0,50).map(x=>`<div class="rounded-lg bg-slate-900 p-3"><div class="font-semibold">${x.nome||''}</div><div class="text-slate-400">${x.funcao||''}</div></div>`).join('') || '<div class="text-slate-400">Sem funcionários.</div>';
}
document.addEventListener('DOMContentLoaded', carregar);
</script>
</body></html>
