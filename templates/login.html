<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login SGCE</title>
  <script src="https://cdn.tailwindcss.com"></script>

<style id="sgce-responsive-patch">
  html { font-size: clamp(13px, 0.80rem + 0.25vw, 16px); }
  body { overflow-x: hidden; }
  img, svg, canvas, video { max-width: 100%; height: auto; }
  input, select, textarea, button { max-width: 100%; }
  @media (max-width: 1280px) {
    .max-w-7xl, .max-w-6xl, .max-w-5xl, .max-w-4xl { max-width: 100% !important; }
  }
  @media (max-width: 1024px) {
    .text-3xl { font-size: 1.6rem !important; line-height: 2rem !important; }
    .text-2xl { font-size: 1.35rem !important; line-height: 1.8rem !important; }
    .text-xl { font-size: 1.15rem !important; line-height: 1.55rem !important; }
    .p-6, .p-5 { padding: 1rem !important; }
    .px-6 { padding-left: 1rem !important; padding-right: 1rem !important; }
    .py-8 { padding-top: 1rem !important; padding-bottom: 1rem !important; }
  }
  @media (max-width: 768px) {
    table { display: block; width: 100%; overflow-x: auto; white-space: nowrap; }
    [class*="grid-cols-2"], [class*="grid-cols-3"], [class*="grid-cols-4"], [class*="grid-cols-5"], [class*="grid-cols-6"] {
      grid-template-columns: minmax(0, 1fr) !important;
    }
    .min-w-72 { min-width: 100% !important; }
    .text-sm { font-size: 0.82rem !important; }
    .text-base { font-size: 0.92rem !important; }
    .text-lg { font-size: 1rem !important; }
    .rounded-2xl { border-radius: 1rem !important; }
    [class*="max-w-"] { max-width: 100% !important; }
  }
  @media (max-width: 640px) {
    body[class*="p-6"] { padding: 1rem !important; }
    .px-4 { padding-left: 0.75rem !important; padding-right: 0.75rem !important; }
    .py-3, .py-2 { padding-top: 0.65rem !important; padding-bottom: 0.65rem !important; }
    .gap-4 { gap: 0.75rem !important; }
    .gap-3 { gap: 0.65rem !important; }
  }
</style>

</head>
<body class="min-h-screen bg-slate-900 text-slate-100 flex items-center justify-center p-4">
  <div class="w-full max-w-md bg-slate-800 border border-slate-700 rounded-2xl shadow-xl p-8">
    <h1 class="text-3xl font-bold text-emerald-400 text-center">SGCE</h1>
    <p class="text-slate-400 text-center mt-2">Acesso ao sistema</p>
    <div class="mt-6 space-y-4">
      <div>
        <label class="block text-sm text-slate-300 mb-1">Usuário</label>
        <input id="username" type="text" class="w-full rounded-xl bg-slate-900 border border-slate-700 px-4 py-3 outline-none" placeholder="seu usuário">
      </div>
      <div>
        <label class="block text-sm text-slate-300 mb-1">Senha</label>
        <input id="senha" type="password" class="w-full rounded-xl bg-slate-900 border border-slate-700 px-4 py-3 outline-none" placeholder="••••••">
      </div>
      <button onclick="entrar()" class="w-full rounded-xl bg-emerald-600 hover:bg-emerald-500 px-4 py-3 font-semibold">Entrar</button>
      <a href="/primeiro_acesso" class="block w-full text-center rounded-xl bg-slate-700 hover:bg-slate-600 px-4 py-3 font-semibold">Primeiro acesso</a>
      <div id="erro" class="hidden rounded-xl bg-red-950/40 border border-red-500/30 px-4 py-3 text-sm text-red-300"></div>
    </div>
  </div>
<script>
async function entrar() {
  const erro = document.getElementById('erro');
  erro.classList.add('hidden');
  erro.textContent = '';
  const response = await fetch('/api/login', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({
      username: document.getElementById('username').value,
      senha: document.getElementById('senha').value
    })
  });
  const json = await response.json();
  if (!response.ok || !json.success) {
    erro.textContent = json.error || 'Falha no login.';
    erro.classList.remove('hidden');
    return;
  }
  window.location.href = json.redirect || '/dashboard_ocorrencias';
}
</script>

<footer class="mt-8 border-t border-slate-700 pt-4 text-center text-sm text-slate-400">
  <p><strong>Desenvolvido e Registrado por Marcelo André Nogueira Cardes</strong></p>
  <p>Licença Cortesia E. E. Professora Irene Dias Ribeiro</p>
</footer>
</body>
</html>
