<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Ficha Integrada do Aluno</title><script src="https://cdn.tailwindcss.com"></script></head>
<body class="bg-slate-900 text-white min-h-screen p-6"><div class="max-w-7xl mx-auto"><header class="mb-8 flex justify-between items-center"><h1 class="text-3xl font-bold text-emerald-400">Ficha Integrada do Aluno</h1><button onclick="window.location.href='/gestao_tutoria'" class="bg-slate-700 hover:bg-slate-600 px-4 py-2 rounded-lg">Voltar</button></header><section class="bg-slate-800 rounded-2xl shadow p-6 mb-6"><div class="grid grid-cols-1 md:grid-cols-3 gap-4"><div><label class="block text-sm text-slate-300 mb-1">Tutor</label><select id="tutor" class="w-full rounded-lg bg-slate-700 border border-slate-600 p-3" onchange="carregarAlunos()"></select></div><div><label class="block text-sm text-slate-300 mb-1">Aluno</label><select id="aluno" class="w-full rounded-lg bg-slate-700 border border-slate-600 p-3"></select></div><div class="flex items-end"><button onclick="buscarFicha()" class="w-full bg-emerald-600 hover:bg-emerald-700 px-4 py-3 rounded-lg font-bold">Buscar ficha</button></div></div></section><section id="ficha" class="hidden space-y-6"><div class="bg-slate-800 rounded-2xl shadow p-6"><h2 class="text-xl font-semibold text-emerald-400 mb-4">Dados do aluno</h2><div class="grid grid-cols-1 md:grid-cols-4 gap-4"><div><div class="text-slate-400 text-sm">Nome</div><div id="aluno-nome" class="font-semibold"></div></div><div><div class="text-slate-400 text-sm">Sala</div><div id="aluno-sala" class="font-semibold"></div></div><div><div class="text-slate-400 text-sm">Tutor</div><div id="aluno-tutor" class="font-semibold"></div></div><div><div class="text-slate-400 text-sm">ID</div><div id="aluno-id" class="font-semibold"></div></div></div></div><div class="grid grid-cols-1 xl:grid-cols-5 gap-6"><div class="bg-slate-800 rounded-2xl shadow overflow-hidden"><div class="px-5 py-4 border-b border-slate-700 font-semibold text-emerald-400">Ocorrências</div><div id="lista-ocorrencias" class="p-5 space-y-4"></div></div><div class="bg-slate-800 rounded-2xl shadow overflow-hidden"><div class="px-5 py-4 border-b border-slate-700 font-semibold text-emerald-400">Atendimentos</div><div id="lista-atendimentos" class="p-5 space-y-4"></div></div><div class="bg-slate-800 rounded-2xl shadow overflow-hidden"><div class="px-5 py-4 border-b border-slate-700 font-semibold text-emerald-400">Agendamentos</div><div id="lista-agendamentos" class="p-5 space-y-4"></div></div><div class="bg-slate-800 rounded-2xl shadow overflow-hidden"><div class="px-5 py-4 border-b border-slate-700 font-semibold text-emerald-400">Frequência</div><div id="lista-frequencia" class="p-5 space-y-4"></div></div><div class="bg-slate-800 rounded-2xl shadow overflow-hidden"><div class="px-5 py-4 border-b border-slate-700 font-semibold text-emerald-400">Notas</div><div id="lista-notas" class="p-5 space-y-4"></div></div></div></section></div><script>
let tutores=[];let alunos=[];document.addEventListener('DOMContentLoaded', async ()=>{const r=await fetch('/api/tutores');tutores=await r.json();document.getElementById('tutor').innerHTML='<option value="">Selecione o tutor</option>'+tutores.map(t=>`<option value="${t.id}">${t.nome||''}</option>`).join('');});
async function carregarAlunos(){const tutorId=document.getElementById('tutor').value;const r=await fetch(`/api/alunos_tutoria?tutor_id=${tutorId}`);alunos=await r.json();document.getElementById('aluno').innerHTML='<option value="">Selecione o aluno</option>'+alunos.map(a=>`<option value="${a.id}">${a.nome||''}</option>`).join('');}
function card(title,subtitle,body){return `<div class="rounded-xl border border-slate-700 bg-slate-900 p-4"><div class="font-semibold">${title}</div><div class="text-sm text-slate-400">${subtitle||''}</div><div class="mt-2 text-sm whitespace-pre-wrap">${body||''}</div></div>`;}
async function buscarFicha(){const alunoId=document.getElementById('aluno').value;if(!alunoId)return;const r=await fetch(`/api/ficha_tutoria/${alunoId}`);const data=await r.json();document.getElementById('ficha').classList.remove('hidden');document.getElementById('aluno-nome').textContent=data.aluno?.nome||'';document.getElementById('aluno-sala').textContent=data.aluno?.sala_nome||'';document.getElementById('aluno-tutor').textContent=data.aluno?.tutor_nome||'';document.getElementById('aluno-id').textContent=data.aluno?.id||'';document.getElementById('lista-ocorrencias').innerHTML=(data.ocorrencias||[]).length?(data.ocorrencias||[]).map(o=>card(`Ocorrência #${o.numero}`,`${(o.data_hora||'').substring(0,10)} - ${o.status||''} - ${o.pendencia||''}`,o.descricao||'')).join(''):'<div class="text-slate-400">Sem ocorrências.</div>';document.getElementById('lista-atendimentos').innerHTML=(data.atendimentos||[]).length?(data.atendimentos||[]).map(a=>card(a.tipo_atendimento||'Atendimento',`${(a.data_registro||'').substring(0,10)} - ${a.tutor_nome||''}`,a.registro||'')).join(''):'<div class="text-slate-400">Sem atendimentos.</div>';document.getElementById('lista-agendamentos').innerHTML=(data.agendamentos||[]).length?(data.agendamentos||[]).map(a=>card(a.tema||'Agendamento',`${a.data_agendamento||''} ${a.hora_agendamento||''} - ${a.status||''}`,a.observacao||'')).join(''):'<div class="text-slate-400">Sem agendamentos.</div>';document.getElementById('lista-frequencia').innerHTML=(data.frequencia||[]).length?(data.frequencia||[]).map(f=>card(`Status ${f.status||''}`,`${f.data||''}`,`Entrada: ${f.hora_entrada||''}\nSaída: ${f.hora_saida||''}\nMotivo atraso: ${f.motivo_atraso||''}\nMotivo saída: ${f.motivo_saida||''}`)).join(''):'<div class="text-slate-400">Sem registros de frequência.</div>';document.getElementById('lista-notas').innerHTML=(data.notas||[]).length?(data.notas||[]).map(n=>card(n.disciplina||'Disciplina',`${n.bimestre||''} - Nota: ${n.nota ?? ''}`,n.observacao||'')).join(''):'<div class="text-slate-400">Sem notas registradas.</div>';}
</script></body></html>
