<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ficha de Tutoria - SGCE APP</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-4 md:p-6">
<div class="max-w-7xl mx-auto space-y-5">
  <header class="flex justify-between items-center flex-wrap gap-3">
    <div>
      <h1 class="text-3xl font-bold text-emerald-400">FICHA DO ALUNO</h1>
      <p class="text-slate-400">Visualização direta do aluno selecionado na tutoria.</p>
    </div>
    <div class="flex gap-2">
      <button onclick="salvarFicha()" class="bg-blue-700 hover:bg-blue-600 px-4 py-2 rounded">Salvar ficha</button>
    </div>
  </header>

  <section id="avisoCarregando" class="bg-slate-800 rounded-xl p-4 border border-slate-700 text-slate-300">
    Carregando ficha do aluno...
  </section>

  <section id="painel" class="hidden space-y-4">
    <div id="badgeStatusAluno" class="flex gap-2 flex-wrap"></div>

    <div class="bg-slate-800 rounded-xl p-4 border border-slate-700">
      <div id="dadosAluno" class="grid md:grid-cols-2 xl:grid-cols-5 gap-2 text-sm"></div>
    </div>

    <div class="bg-slate-800 rounded-xl p-4 border border-slate-700">
      <div class="flex flex-wrap gap-2 justify-between items-center mb-3">
        <h2 class="font-bold text-emerald-400">Tutoria</h2>
      </div>
      <div class="grid md:grid-cols-2 gap-3">
        <div>
          <label class="block text-xs text-slate-400 mb-1">Clube Juvenil 1º Semestre</label>
          <select id="clube1" class="w-full bg-slate-900 border border-slate-700 rounded px-3 py-2"><option value="">Selecione...</option></select>
        </div>
        <div>
          <label class="block text-xs text-slate-400 mb-1">Clube Juvenil 2º Semestre</label>
          <input id="clube2" class="w-full bg-slate-900 border border-slate-700 rounded px-3 py-2">
        </div>
        <div>
          <label class="block text-xs text-slate-400 mb-1">Eletiva 1º Semestre</label>
          <select id="eletiva1" class="w-full bg-slate-900 border border-slate-700 rounded px-3 py-2"><option value="">Selecione...</option></select>
        </div>
        <div>
          <label class="block text-xs text-slate-400 mb-1">Eletiva 2º Semestre</label>
          <input id="eletiva2" class="w-full bg-slate-900 border border-slate-700 rounded px-3 py-2">
        </div>
        <div>
          <label class="block text-xs text-slate-400 mb-1">Projeto de Vida</label>
          <input id="projeto_vida" class="w-full bg-slate-900 border border-slate-700 rounded px-3 py-2">
        </div>
        <div>
          <label class="block text-xs text-slate-400 mb-1">Telefone do Aluno</label>
          <input id="telefone_aluno" maxlength="15" class="w-full bg-slate-900 border border-slate-700 rounded px-3 py-2">
        </div>
        <div>
          <label class="block text-xs text-slate-400 mb-1">Responsável</label>
          <input id="responsavel_nome" class="w-full bg-slate-900 border border-slate-700 rounded px-3 py-2">
        </div>
        <div>
          <label class="block text-xs text-slate-400 mb-1">Telefone do Responsável</label>
          <input id="responsavel_telefone" maxlength="15" class="w-full bg-slate-900 border border-slate-700 rounded px-3 py-2">
        </div>
      </div>
    </div>

    <div class="grid xl:grid-cols-2 gap-4">
      <div class="bg-slate-800 rounded-xl p-4 border border-slate-700">
        <h2 class="font-bold text-emerald-400 mb-3">Ocorrências</h2>
        <div class="overflow-x-auto">
          <table class="w-full text-sm">
            <thead><tr class="border-b border-slate-700"><th class="text-left py-2 px-2">Nº</th><th class="text-left py-2 px-2">Data</th><th class="text-left py-2 px-2">Status</th><th class="text-left py-2 px-2">Pendência</th><th class="text-left py-2 px-2">Descrição</th><th class="text-left py-2 px-2">Ação</th></tr></thead>
            <tbody id="tbOcorrencias"></tbody>
          </table>
        </div>
      </div>
      <div class="bg-slate-800 rounded-xl p-4 border border-slate-700">
        <h2 class="font-bold text-emerald-400 mb-3">Atendimentos</h2>
        <div class="overflow-x-auto">
          <table class="w-full text-sm">
            <thead><tr class="border-b border-slate-700"><th class="text-left py-2 px-2">Data</th><th class="text-left py-2 px-2">Tipo</th><th class="text-left py-2 px-2">Registro</th></tr></thead>
            <tbody id="tbAtendimentos"></tbody>
          </table>
        </div>
      </div>
      <div class="bg-slate-800 rounded-xl p-4 border border-slate-700">
        <h2 class="font-bold text-emerald-400 mb-3">Agendamentos</h2>
        <div class="overflow-x-auto">
          <table class="w-full text-sm">
            <thead><tr class="border-b border-slate-700"><th class="text-left py-2 px-2">Data</th><th class="text-left py-2 px-2">Hora</th><th class="text-left py-2 px-2">Tema</th><th class="text-left py-2 px-2">Status</th></tr></thead>
            <tbody id="tbAgendamentos"></tbody>
          </table>
        </div>
      </div>
      <div class="bg-slate-800 rounded-xl p-4 border border-slate-700">
        <h2 class="font-bold text-emerald-400 mb-3">Frequência e Boletim</h2>
        <div class="overflow-x-auto mb-4">
          <table class="w-full text-sm">
            <thead><tr class="border-b border-slate-700"><th class="text-left py-2 px-2">Data</th><th class="text-left py-2 px-2">Status</th></tr></thead>
            <tbody id="tbFrequencia"></tbody>
          </table>
        </div>
        <div class="overflow-x-auto">
          <table class="w-full text-sm">
            <thead><tr class="border-b border-slate-700"><th class="text-left py-2 px-2">Disciplina</th><th class="text-left py-2 px-2">1º</th><th class="text-left py-2 px-2">2º</th><th class="text-left py-2 px-2">3º</th><th class="text-left py-2 px-2">4º</th></tr></thead>
            <tbody id="tbBoletim"></tbody>
          </table>
        </div>
      </div>
    </div>
  </section>
</div>

<script>
let alunoAtualId = null;
let opcoesClubes = [];
let opcoesEletivas = [];

function safe(v){ return v == null ? '' : String(v); }

function aplicarMascaraTelefone(input){
  if (!input) return;
  input.addEventListener('input', () => {
    let v = input.value.replace(/\D/g,'').slice(0,11);
    if (v.length > 10) input.value = v.replace(/(\d{2})(\d{5})(\d{4})/, '($1) $2-$3');
    else if (v.length > 6) input.value = v.replace(/(\d{2})(\d{4})(\d+)/, '($1) $2-$3');
    else if (v.length > 2) input.value = v.replace(/(\d{2})(\d+)/, '($1) $2');
    else input.value = v;
  });
}

function preencherSelectOpcoes(selectId, opcoes, valorSelecionado='') {
  const select = document.getElementById(selectId);
  if (!select) return;
  const atual = valorSelecionado || select.value || '';
  const unicas = Array.from(new Set((Array.isArray(opcoes) ? opcoes : []).map(x => typeof x === 'string' ? x : (x.nome || x.descricao || x.titulo || '')).filter(Boolean)));
  select.innerHTML = '<option value="">Selecione...</option>' + unicas.map(nome => `<option value="${safe(nome)}">${safe(nome)}</option>`).join('');
  select.value = atual;
}

async function carregarOpcoesSemestres(){
  try {
    const [rc, re] = await Promise.all([
      fetch('/api/tutoria/opcoes_clube_juvenil'),
      fetch('/api/tutoria/opcoes_eletiva')
    ]);
    const jc = await rc.json();
    const je = await re.json();
    opcoesClubes = Array.isArray(jc) ? (jc.primeiro_semestre || jc.semestre_1 || jc.data || jc) : (jc.primeiro_semestre || jc.semestre_1 || []);
    opcoesEletivas = Array.isArray(je) ? (je.primeiro_semestre || je.semestre_1 || je.data || je) : (je.primeiro_semestre || je.semestre_1 || []);
    if (!Array.isArray(opcoesClubes)) opcoesClubes = [];
    if (!Array.isArray(opcoesEletivas)) opcoesEletivas = [];
    preencherSelectOpcoes('clube1', opcoesClubes);
    preencherSelectOpcoes('eletiva1', opcoesEletivas);
  } catch (e) {
    console.error('Erro ao carregar opções de clube/eletiva', e);
  }
}

function renderBadgesTutor(ficha){
  const badges = [];
  if (ficha.aluno_destaque) badges.push('<span class="bg-emerald-600 text-white text-xs px-3 py-1 rounded-full">Aluno Destaque</span>');
  if (ficha.aluno_evolucao) badges.push('<span class="bg-blue-600 text-white text-xs px-3 py-1 rounded-full">Aluno Evolução</span>');
  document.getElementById('badgeStatusAluno').innerHTML = badges.join('');
}

async function abrirFichaAluno(alunoId) {
  alunoAtualId = alunoId;
  const aviso = document.getElementById('avisoCarregando');
  aviso.textContent = 'Carregando ficha do aluno...';
  const r = await fetch(`/api/ficha_tutoria/${alunoId}`);
  const ficha = await r.json();

  if (!r.ok || ficha.success === false) {
    aviso.textContent = ficha.error || 'Erro ao carregar ficha.';
    return;
  }

  const aluno = ficha.aluno || {};
  document.getElementById('painel').classList.remove('hidden');
  aviso.classList.add('hidden');

  renderBadgesTutor(ficha);

  document.getElementById('dadosAluno').innerHTML = `
    <div><strong>Aluno:</strong> ${safe(aluno.nome || aluno.aluno_nome)}</div>
    <div><strong>Sala:</strong> ${safe(aluno.sala_nome)}</div>
    <div><strong>Tutor:</strong> ${safe(aluno.tutor_nome)}</div>
    <div><strong>Projeto de Vida:</strong> ${safe(aluno.projeto_de_vida || aluno.projeto_vida || '')}</div>
    <div><strong>Frequência Geral:</strong> ${safe(ficha.frequencia_percentual || 0)}%</div>
  `;

  preencherSelectOpcoes('clube1', opcoesClubes, aluno.clube_1_semestre || aluno.clube_juvenil || aluno.clube || '');
  document.getElementById('clube2').value = aluno.clube_2_semestre || '';
  preencherSelectOpcoes('eletiva1', opcoesEletivas, aluno.eletiva_1_semestre || aluno.eletiva || '');
  document.getElementById('eletiva2').value = aluno.eletiva_2_semestre || '';
  document.getElementById('projeto_vida').value = aluno.projeto_de_vida || aluno.projeto_vida || '';
  document.getElementById('telefone_aluno').value = aluno.telefone_aluno || aluno.telefone || '';
  document.getElementById('responsavel_nome').value = aluno.responsavel_nome || aluno.nome_responsavel || '';
  document.getElementById('responsavel_telefone').value = aluno.responsavel_telefone || aluno.telefone_responsavel || '';

  const ocorrencias = ficha.ocorrencias || [];
  document.getElementById('tbOcorrencias').innerHTML = ocorrencias.length ? ocorrencias.map(o => `
    <tr class="border-b border-slate-800">
      <td class="py-2 px-2">${o.numero || ''}</td>
      <td class="py-2 px-2">${o.data_hora || ''}</td>
      <td class="py-2 px-2">${o.status || ''}</td>
      <td class="py-2 px-2">${o.pendencia || ''}</td>
      <td class="py-2 px-2">${o.descricao || ''}</td>
      <td class="py-2 px-2">${o.pode_responder_tutor ? `<a href="/gestao_ocorrencia_editar?numero=${o.numero}" class="bg-amber-600 hover:bg-amber-500 px-3 py-1 rounded text-xs">Responder</a>` : ''}</td>
    </tr>
  `).join('') : '<tr><td colspan="6" class="py-3 px-2 text-slate-400">Nenhuma ocorrência encontrada.</td></tr>';

  document.getElementById('tbAtendimentos').innerHTML = (ficha.atendimentos || []).length ? (ficha.atendimentos || []).map(a => `
    <tr class="border-b border-slate-800"><td class="py-2 px-2">${a.data_registro || ''}</td><td class="py-2 px-2">${a.tipo_atendimento || ''}</td><td class="py-2 px-2">${a.registro || ''}</td></tr>
  `).join('') : '<tr><td colspan="3" class="py-3 px-2 text-slate-400">Nenhum atendimento encontrado.</td></tr>';

  document.getElementById('tbAgendamentos').innerHTML = (ficha.agendamentos || []).length ? (ficha.agendamentos || []).map(a => `
    <tr class="border-b border-slate-800"><td class="py-2 px-2">${a.data_agendamento || ''}</td><td class="py-2 px-2">${a.hora_agendamento || ''}</td><td class="py-2 px-2">${a.tema || ''}</td><td class="py-2 px-2">${a.status || ''}</td></tr>
  `).join('') : '<tr><td colspan="4" class="py-3 px-2 text-slate-400">Nenhum agendamento encontrado.</td></tr>';

  document.getElementById('tbFrequencia').innerHTML = (ficha.frequencia || []).length ? (ficha.frequencia || []).map(f => `
    <tr class="border-b border-slate-800"><td class="py-2 px-2">${f.data || ''}</td><td class="py-2 px-2">${f.status || ''}</td></tr>
  `).join('') : '<tr><td colspan="2" class="py-3 px-2 text-slate-400">Nenhum registro de frequência encontrado.</td></tr>';

  document.getElementById('tbBoletim').innerHTML = (ficha.notas || []).length ? (ficha.notas || []).map(n => `
    <tr class="border-b border-slate-800"><td class="py-2 px-2">${n.disciplina || ''}</td><td class="py-2 px-2">${n.nota_1b || ''}</td><td class="py-2 px-2">${n.nota_2b || ''}</td><td class="py-2 px-2">${n.nota_3b || ''}</td><td class="py-2 px-2">${n.nota_4b || ''}</td></tr>
  `).join('') : '<tr><td colspan="5" class="py-3 px-2 text-slate-400">Nenhuma nota encontrada.</td></tr>';
}

async function salvarFicha(){
  if (!alunoAtualId) return alert('Aluno não informado.');
  const payload = {
    aluno_id: alunoAtualId,
    projeto_de_vida: document.getElementById('projeto_vida').value,
    clube_1_semestre: document.getElementById('clube1').value,
    clube_2_semestre: document.getElementById('clube2').value,
    eletiva_1_semestre: document.getElementById('eletiva1').value,
    eletiva_2_semestre: document.getElementById('eletiva2').value,
    telefone_aluno: document.getElementById('telefone_aluno').value,
    responsavel_nome: document.getElementById('responsavel_nome').value,
    responsavel_telefone: document.getElementById('responsavel_telefone').value
  };
  const r = await fetch('/api/salvar_tutoria_ficha', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(payload)
  });
  const j = await r.json();
  if (!r.ok || !j.success) return alert(j.error || 'Erro ao salvar ficha.');
  alert('Ficha salva com sucesso!');
  await abrirFichaAluno(alunoAtualId);
}

aplicarMascaraTelefone(document.getElementById('telefone_aluno'));
aplicarMascaraTelefone(document.getElementById('responsavel_telefone'));
document.addEventListener('DOMContentLoaded', async () => {
  await carregarOpcoesSemestres();
  const alunoIdUrl = new URLSearchParams(location.search).get('aluno_id');
  if (!alunoIdUrl) {
    document.getElementById('avisoCarregando').textContent = 'Aluno não informado para abrir a ficha.';
    return;
  }
  await abrirFichaAluno(alunoIdUrl);
});
</script>
</body>
</html>
