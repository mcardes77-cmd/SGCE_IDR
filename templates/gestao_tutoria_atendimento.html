<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Atendimento Tutoria</title><script src="https://cdn.tailwindcss.com"></script>
<style id="sgce-responsive-patch">
  html { font-size: clamp(13px, 0.80rem + 0.25vw, 16px); }
  body { overflow-x: hidden; }
  img, svg, canvas, video { max-width: 100%; height: auto; }
  input, select, textarea, button { max-width: 100%; }
  @media (max-width: 1280px) {
    .max-w-7xl, .max-w-6xl, .max-w-5xl, .max-w-4xl { max-width: 100% !important; }
  }
  @media (max-width: 1024px) {
    .text-3xl { font-size: 1.6rem !important; line-height: 2rem !important; }
    .text-2xl { font-size: 1.35rem !important; line-height: 1.8rem !important; }
    .text-xl { font-size: 1.15rem !important; line-height: 1.55rem !important; }
    .p-6, .p-5 { padding: 1rem !important; }
    .px-6 { padding-left: 1rem !important; padding-right: 1rem !important; }
    .py-8 { padding-top: 1rem !important; padding-bottom: 1rem !important; }
  }
  @media (max-width: 768px) {
    table { display: block; width: 100%; overflow-x: auto; white-space: nowrap; }
    [class*="grid-cols-2"], [class*="grid-cols-3"], [class*="grid-cols-4"], [class*="grid-cols-5"], [class*="grid-cols-6"] {
      grid-template-columns: minmax(0, 1fr) !important;
    }
    .min-w-72 { min-width: 100% !important; }
    .text-sm { font-size: 0.82rem !important; }
    .text-base { font-size: 0.92rem !important; }
    .text-lg { font-size: 1rem !important; }
    .rounded-2xl { border-radius: 1rem !important; }
    [class*="max-w-"] { max-width: 100% !important; }
  }
  @media (max-width: 640px) {
    body[class*="p-6"] { padding: 1rem !important; }
    .px-4 { padding-left: 0.75rem !important; padding-right: 0.75rem !important; }
    .py-3, .py-2 { padding-top: 0.65rem !important; padding-bottom: 0.65rem !important; }
    .gap-4 { gap: 0.75rem !important; }
    .gap-3 { gap: 0.65rem !important; }
  }
</style>

</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-4"><div class="max-w-7xl mx-auto space-y-5">
<header class="flex justify-between"><h1 class="text-3xl font-bold text-emerald-400">ATENDIMENTO DE TUTORIA</h1><a href="/gestao_tutoria" class="bg-slate-700 px-4 py-2 rounded">Voltar</a></header>
<section class="bg-slate-800 rounded-xl p-4 border border-slate-700 grid md:grid-cols-4 gap-3">
<select id="tutor_id" class="bg-slate-900 border border-slate-700 rounded px-3 py-2"></select>
<select id="aluno_id" class="bg-slate-900 border border-slate-700 rounded px-3 py-2" disabled></select>
<button onclick="carregarAtendimentos()" class="bg-blue-700 rounded px-4 py-2">Carregar atendimentos</button>
<button onclick="abrirNovo()" class="bg-emerald-600 rounded px-4 py-2">Inserir atendimento</button>
</section>
<div id="lista" class="space-y-3"></div>
<section id="form" class="hidden bg-slate-800 rounded-xl p-4 border border-slate-700 space-y-3">
<input type="hidden" id="atendimento_id">
<select id="tipo_atendimento" class="w-full bg-slate-900 border border-slate-700 rounded px-3 py-2"><option value="">Selecione...</option><option value="ACADEMICO">ACADÊMICO</option><option value="PROFISSIONAL">PROFISSIONAL</option><option value="PESSOAL">PESSOAL</option></select>
<textarea id="registro" class="w-full h-28 bg-slate-900 border border-slate-700 rounded px-3 py-2" placeholder="Registro"></textarea>
<textarea id="proximos_passos" class="w-full h-24 bg-slate-900 border border-slate-700 rounded px-3 py-2" placeholder="Próximos passos"></textarea>
<button onclick="salvarAtendimento()" class="bg-emerald-600 px-4 py-2 rounded">Salvar atendimento</button>
</section></div>
<script>
let tutores=[], alunos=[], atendimentos=[]; const qs=new URLSearchParams(location.search); const alunoIdPre=qs.get('aluno_id'); const tutorIdPre=qs.get('tutor_id'); const abrirNovoAuto = qs.get('novo') === '1';
async function carregarTutores(){const r=await fetch('/api/tutores'); tutores=await r.json(); const s=document.getElementById('tutor_id'); s.innerHTML='<option value="">Selecione o tutor...</option>'+tutores.map(t=>`<option value="${t.id}">${t.nome}</option>`).join(''); if(tutorIdPre && tutores.some(t=>String(t.id)===String(tutorIdPre))){s.value=tutorIdPre;} if(tutores.length===1){s.value=tutores[0].id; s.disabled=true;} if(s.value){await carregarAlunosDoTutor();}}
async function carregarAlunosDoTutor(){const tutorId=document.getElementById('tutor_id').value; const s=document.getElementById('aluno_id'); if(!tutorId){s.disabled=true; s.innerHTML=''; return;} alunos=await (await fetch(`/api/alunos_do_tutor/${tutorId}`)).json(); s.disabled=false; s.innerHTML='<option value="">Selecione o aluno...</option>'+alunos.map(a=>`<option value="${a.id}">${a.nome||a.aluno_nome||''}</option>`).join(''); const alvo=(qs.get('aluno_id')||''); if(alvo && alunos.some(a=>String(a.id)===String(alvo))){s.value=alvo; await carregarAtendimentos(); if(abrirNovoAuto){abrirNovo();}}}
async function carregarAtendimentos(){const alunoId=document.getElementById('aluno_id').value; if(!alunoId) return alert('Selecione um aluno'); atendimentos=await (await fetch(`/api/atendimentos_tutoria?aluno_id=${alunoId}`)).json(); document.getElementById('lista').innerHTML=atendimentos.length?atendimentos.map(a=>`<div class="bg-slate-800 rounded-xl border border-slate-700 p-4"><div><strong>Data:</strong> ${(a.data_registro||'').replace('T',' ').slice(0,16)}</div><div><strong>Tipo:</strong> ${a.tipo_atendimento||''}</div><div><strong>Registro:</strong> ${a.registro||''}</div><div><strong>Próximos passos:</strong> ${a.proximos_passos||''}</div><button onclick="editar(${a.id})" class="mt-3 bg-amber-600 px-3 py-1 rounded">✏ Editar</button></div>`).join(''):'<div class="text-slate-400">Nenhum atendimento.</div>';}
function abrirNovo(){if(!document.getElementById('aluno_id').value) return alert('Selecione tutor e aluno'); document.getElementById('form').classList.remove('hidden'); document.getElementById('atendimento_id').value=''; document.getElementById('tipo_atendimento').value=''; document.getElementById('registro').value=''; document.getElementById('proximos_passos').value='';}
async function editar(id){const r=await fetch(`/api/atendimento_tutoria/${id}`); const j=await r.json(); if(!r.ok||!j.success) return alert(j.error||'Erro'); const x=j.data; document.getElementById('form').classList.remove('hidden'); document.getElementById('atendimento_id').value=x.id; document.getElementById('tipo_atendimento').value=x.tipo_atendimento||''; document.getElementById('registro').value=x.registro||''; document.getElementById('proximos_passos').value=x.proximos_passos||'';}
async function salvarAtendimento(){const tutorId=document.getElementById('tutor_id').value, alunoId=document.getElementById('aluno_id').value; const tutor=tutores.find(t=>String(t.id)===String(tutorId))||{}; const aluno=alunos.find(a=>String(a.id)===String(alunoId))||{}; const payload={tutor_id:tutorId,tutor_nome:tutor.nome||'',aluno_id:alunoId,aluno_nome:aluno.nome||aluno.aluno_nome||'',sala_nome:aluno.sala_nome||'',tipo_atendimento:document.getElementById('tipo_atendimento').value,registro:document.getElementById('registro').value,proximos_passos:document.getElementById('proximos_passos').value}; const id=document.getElementById('atendimento_id').value; let r,j; if(id){r=await fetch(`/api/atendimento_tutoria/${id}`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)}); j=await r.json();} else {r=await fetch('/api/salvar_atendimento_tutoria',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)}); j=await r.json();} if(!r.ok||!j.success) return alert(j.error||'Erro'); alert('Salvo'); document.getElementById('form').classList.add('hidden'); carregarAtendimentos();}
document.getElementById('tutor_id').addEventListener('change', carregarAlunosDoTutor); carregarTutores();
</script>
<footer class="mt-8 border-t border-slate-700 pt-4 text-center text-sm text-slate-400">
  <p><strong>Desenvolvido e Registrado por Marcelo André Nogueira Cardes</strong></p>
  <p>Licença Cortesia E. E. Professora Irene Dias Ribeiro</p>
</footer>
</body></html>
