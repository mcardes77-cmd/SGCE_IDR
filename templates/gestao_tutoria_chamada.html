<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chamada Tutoria</title><script src="https://cdn.tailwindcss.com"></script>

<style id="sgce-responsive-patch">
  html { font-size: clamp(13px, 0.80rem + 0.25vw, 16px); }
  body { overflow-x: hidden; }
  img, svg, canvas, video { max-width: 100%; height: auto; }
  input, select, textarea, button { max-width: 100%; }
  @media (max-width: 1280px) {
    .max-w-7xl, .max-w-6xl, .max-w-5xl, .max-w-4xl { max-width: 100% !important; }
  }
  @media (max-width: 1024px) {
    .text-3xl { font-size: 1.6rem !important; line-height: 2rem !important; }
    .text-2xl { font-size: 1.35rem !important; line-height: 1.8rem !important; }
    .text-xl { font-size: 1.15rem !important; line-height: 1.55rem !important; }
    .p-6, .p-5 { padding: 1rem !important; }
    .px-6 { padding-left: 1rem !important; padding-right: 1rem !important; }
    .py-8 { padding-top: 1rem !important; padding-bottom: 1rem !important; }
  }
  @media (max-width: 768px) {
    table { display: block; width: 100%; overflow-x: auto; white-space: nowrap; }
    [class*="grid-cols-2"], [class*="grid-cols-3"], [class*="grid-cols-4"], [class*="grid-cols-5"], [class*="grid-cols-6"] {
      grid-template-columns: minmax(0, 1fr) !important;
    }
    .min-w-72 { min-width: 100% !important; }
    .text-sm { font-size: 0.82rem !important; }
    .text-base { font-size: 0.92rem !important; }
    .text-lg { font-size: 1rem !important; }
    .rounded-2xl { border-radius: 1rem !important; }
    [class*="max-w-"] { max-width: 100% !important; }
  }
  @media (max-width: 640px) {
    body[class*="p-6"] { padding: 1rem !important; }
    .px-4 { padding-left: 0.75rem !important; padding-right: 0.75rem !important; }
    .py-3, .py-2 { padding-top: 0.65rem !important; padding-bottom: 0.65rem !important; }
    .gap-4 { gap: 0.75rem !important; }
    .gap-3 { gap: 0.65rem !important; }
  }
</style>

</head>
<body class="bg-slate-950 text-white min-h-screen p-4">
<div class="max-w-6xl mx-auto space-y-4">
  <div class="flex flex-col lg:flex-row lg:items-end lg:justify-between gap-3">
    <div>
      <h1 class="text-2xl font-bold text-emerald-400">Chamada da Tutoria</h1>
      <p class="text-slate-400 text-sm">Somente terça, quarta e quinta. Todos os alunos iniciam com presença.</p>
    </div>
    <div class="flex flex-wrap gap-2 items-end">
      <div id="boxTutor" class="hidden">
        <label class="block text-xs text-slate-400 mb-1">Tutor</label>
        <select id="tutorSelect" class="bg-slate-900 border border-slate-700 rounded px-3 py-2 min-w-72"></select>
      </div>
      <div>
        <label class="block text-xs text-slate-400 mb-1">Data</label>
        <input id="dataRef" type="date" class="bg-slate-900 border border-slate-700 rounded px-3 py-2">
      </div>
      <button id="btnCarregar" class="bg-slate-700 hover:bg-slate-600 px-4 py-2 rounded-lg">Carregar</button>
      <button id="btnSalvar" class="bg-emerald-600 hover:bg-emerald-500 px-4 py-2 rounded-lg font-semibold">Salvar chamada</button>
    </div>
  </div>

  <div class="grid md:grid-cols-3 gap-3">
    <div class="bg-slate-900 border border-slate-700 rounded-2xl p-4">
      <div class="text-xs text-slate-400">Tutor</div>
      <div id="tutorInfo" class="text-lg font-semibold mt-1">-</div>
    </div>
    <div class="bg-slate-900 border border-slate-700 rounded-2xl p-4">
      <div class="text-xs text-slate-400">Alunos carregados</div>
      <div id="qtdAlunos" class="text-lg font-semibold mt-1">0</div>
    </div>
    <div class="bg-slate-900 border border-slate-700 rounded-2xl p-4">
      <div class="text-xs text-slate-400">Modo</div>
      <div id="modoInfo" class="text-lg font-semibold mt-1">Carregando...</div>
    </div>
  </div>

  <div class="bg-slate-900 border border-slate-700 rounded-2xl p-4 overflow-x-auto">
    <table class="w-full text-sm"><thead><tr class="border-b border-slate-700"><th class="text-left py-2 px-2">Aluno</th><th class="text-left py-2 px-2">Sala</th><th class="text-left py-2 px-2">Status</th></tr></thead><tbody id="tb"></tbody></table>
    <p id="msg" class="text-amber-300 text-sm mt-3"></p>
  </div>
</div>
<script>
let rows=[];
let meta={modo_tutor:true,tutor_nome:'',carregado:false};
function hojeSP(){ const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function safe(v){ return v==null?'':String(v); }
function setDefaultDate(){ document.getElementById('dataRef').value = hojeSP(); }
function selectedTutor(){ return document.getElementById('tutorSelect').value || ''; }
async function carregarTutores(){
  const r=await fetch('/api/tutoria/chamada/tutores');
  const j=await r.json();
  if(!r.ok||!j.success){ return; }
  meta.modo_tutor = !!j.modo_tutor;
  const box=document.getElementById('boxTutor');
  const sel=document.getElementById('tutorSelect');
  if(j.modo_tutor){
    document.getElementById('modoInfo').textContent='Tutor logado';
    return;
  }
  box.classList.remove('hidden');
  document.getElementById('modoInfo').textContent='Acesso total';
  sel.innerHTML='<option value="">Selecione o tutor</option>' + (j.data||[]).map(t=>`<option value="${safe(t.nome)}">${safe(t.nome)}</option>`).join('');
}
async function carregar(){
  const data=document.getElementById('dataRef').value;
  let url=`/api/tutoria/chamada/alunos?data=${encodeURIComponent(data)}`;
  if(!meta.modo_tutor){
    const tutor = selectedTutor();
    if(!tutor){
      rows=[];
      meta.tutor_nome='';
      document.getElementById('tutorInfo').textContent='Selecione o tutor';
      document.getElementById('qtdAlunos').textContent='0';
      document.getElementById('msg').textContent='Selecione o tutor para carregar os alunos.';
      render();
      return;
    }
    url += `&tutor_nome=${encodeURIComponent(tutor)}`;
  }
  document.getElementById('msg').textContent='';
  const r=await fetch(url);
  const j=await r.json();
  if(!r.ok||!j.success){ document.getElementById('msg').textContent=j.error||'Erro ao carregar chamada'; rows=[]; render(); return; }
  rows=j.data||[];
  meta.modo_tutor = j.meta ? !!j.meta.modo_tutor : meta.modo_tutor;
  meta.tutor_nome = j.meta ? (j.meta.tutor_nome||selectedTutor()||'') : (selectedTutor()||'');
  document.getElementById('tutorInfo').textContent = meta.tutor_nome || (meta.modo_tutor ? 'Tutor logado' : 'Selecione o tutor');
  document.getElementById('qtdAlunos').textContent = String(rows.length);
  document.getElementById('modoInfo').textContent = meta.modo_tutor ? 'Tutor logado' : 'Acesso total';
  meta.carregado = true;
  render();
}
function render(){ const tb=document.getElementById('tb'); if(!rows.length){ tb.innerHTML='<tr><td colspan="3" class="py-3 px-2 text-slate-400">Nenhum aluno para chamada.</td></tr>'; return; } tb.innerHTML=rows.map((a,idx)=>`<tr class="border-b border-slate-800"><td class="py-2 px-2">${safe(a.nome)}</td><td class="py-2 px-2">${safe(a.sala_nome)}</td><td class="py-2 px-2"><button onclick="toggleStatus(${idx})" class="${a.status==='F'?'bg-red-700 hover:bg-red-600':'bg-emerald-700 hover:bg-emerald-600'} px-3 py-1 rounded">${a.status}</button></td></tr>`).join(''); }
function toggleStatus(i){ rows[i].status = rows[i].status==='F' ? 'P' : 'F'; render(); }
async function salvar(){
  const data=document.getElementById('dataRef').value;
  if(!rows.length){ alert('Nenhum aluno carregado para salvar.'); return; }
  const itens=rows.map(a=>({aluno_id:a.id,aluno_nome:a.nome,sala_nome:a.sala_nome,status:a.status}));
  const body={data,itens,tutor_nome: meta.modo_tutor ? meta.tutor_nome : selectedTutor()};
  const r=await fetch('/api/tutoria/chamada/salvar',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  const j=await r.json();
  if(!r.ok||!j.success){ alert(j.error||'Erro ao salvar'); return; }
  alert(j.message||'Salvo com sucesso');
}
setDefaultDate();
document.getElementById('btnCarregar').addEventListener('click',carregar);
document.getElementById('btnSalvar').addEventListener('click',salvar);
document.getElementById('tutorSelect').addEventListener('change',carregar);
document.addEventListener('DOMContentLoaded', async ()=>{ await carregarTutores(); await carregar(); });
</script>
</body></html>
