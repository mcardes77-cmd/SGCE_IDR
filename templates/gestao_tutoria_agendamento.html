<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Agendamento de Tutoria</title><script src="https://cdn.tailwindcss.com"></script></head>
<body class="bg-slate-900 text-white min-h-screen p-6"><div class="max-w-6xl mx-auto"><header class="mb-8 flex justify-between items-center"><h1 class="text-3xl font-bold text-emerald-400">Agendamento de Tutoria</h1><button onclick="window.location.href='/gestao_tutoria'" class="bg-slate-700 hover:bg-slate-600 px-4 py-2 rounded-lg">Voltar</button></header><div id="msg" class="hidden mb-4 px-4 py-3 rounded"></div><section class="bg-slate-800 rounded-2xl shadow p-6 mb-6"><div class="grid grid-cols-1 md:grid-cols-2 gap-4"><div><label class="block text-sm text-slate-300 mb-1">Tutor *</label><select id="tutor" class="w-full rounded-lg bg-slate-700 border border-slate-600 p-3" onchange="carregarAlunos()"></select></div><div><label class="block text-sm text-slate-300 mb-1">Aluno *</label><select id="aluno" class="w-full rounded-lg bg-slate-700 border border-slate-600 p-3"></select></div><div><label class="block text-sm text-slate-300 mb-1">Data *</label><input id="data" type="date" class="w-full rounded-lg bg-slate-700 border border-slate-600 p-3"></div><div><label class="block text-sm text-slate-300 mb-1">Hora *</label><input id="hora" type="time" class="w-full rounded-lg bg-slate-700 border border-slate-600 p-3"></div><div><label class="block text-sm text-slate-300 mb-1">Tema</label><input id="tema" class="w-full rounded-lg bg-slate-700 border border-slate-600 p-3"></div><div><label class="block text-sm text-slate-300 mb-1">Status</label><select id="status" class="w-full rounded-lg bg-slate-700 border border-slate-600 p-3"><option value="AGENDADO">AGENDADO</option><option value="CONCLUIDO">CONCLUÍDO</option><option value="CANCELADO">CANCELADO</option></select></div></div><div class="mt-4"><label class="block text-sm text-slate-300 mb-1">Observação</label><textarea id="observacao" rows="3" class="w-full rounded-lg bg-slate-700 border border-slate-600 p-3"></textarea></div><button id="btnSalvar" onclick="salvarAgendamento()" class="mt-5 bg-emerald-600 hover:bg-emerald-700 px-5 py-3 rounded-lg font-bold">Salvar agendamento</button></section><section class="bg-slate-800 rounded-2xl shadow overflow-hidden"><div class="px-5 py-4 border-b border-slate-700 font-semibold text-emerald-400">Agendamentos cadastrados</div><div class="overflow-x-auto"><table class="w-full"><thead class="bg-slate-700 text-slate-300 text-sm"><tr><th class="p-3 text-left">Data</th><th class="p-3 text-left">Hora</th><th class="p-3 text-left">Tutor</th><th class="p-3 text-left">Aluno</th><th class="p-3 text-left">Tema</th><th class="p-3 text-left">Status</th></tr></thead><tbody id="lista-agendamentos"><tr><td colspan="6" class="p-6 text-center text-slate-400">Carregando...</td></tr></tbody></table></div></section></div><script>
let tutores=[];let alunos=[];
function show(msg,tipo='info'){const el=document.getElementById('msg');el.textContent=msg;el.className='mb-4 px-4 py-3 rounded text-white';if(tipo==='error')el.classList.add('bg-red-600');else if(tipo==='success')el.classList.add('bg-green-600');else el.classList.add('bg-blue-600');el.classList.remove('hidden');}
document.addEventListener('DOMContentLoaded', async ()=>{await carregarTutores();await carregarLista();});
async function carregarTutores(){const r=await fetch('/api/tutores');tutores=await r.json();document.getElementById('tutor').innerHTML='<option value="">Selecione o tutor</option>'+tutores.map(t=>`<option value="${t.id}">${t.nome||''}</option>`).join('');}
async function carregarAlunos(){const tutorId=document.getElementById('tutor').value;const r=await fetch(`/api/alunos_tutoria?tutor_id=${tutorId}`);alunos=await r.json();document.getElementById('aluno').innerHTML='<option value="">Selecione o aluno</option>'+alunos.map(a=>`<option value="${a.id}">${a.nome||''}</option>`).join('');}
async function salvarAgendamento(){const tutorSel=document.getElementById('tutor');const alunoSel=document.getElementById('aluno');const tutor=tutores.find(x=>String(x.id)===String(tutorSel.value));const aluno=alunos.find(x=>String(x.id)===String(alunoSel.value));const payload={tutor_id:tutorSel.value,tutor_nome:tutor?.nome||'',aluno_id:alunoSel.value,aluno_nome:aluno?.nome||'',sala_nome:aluno?.sala_nome||'',tema:document.getElementById('tema').value.trim(),observacao:document.getElementById('observacao').value.trim(),status:document.getElementById('status').value,data:document.getElementById('data').value,hora:document.getElementById('hora').value};if(!payload.tutor_id||!payload.aluno_id||!payload.data||!payload.hora){show('Preencha tutor, aluno, data e hora.','error');return;}const btn=document.getElementById('btnSalvar');btn.disabled=true;btn.textContent='Salvando...';try{const r=await fetch('/api/agendar_tutoria',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});const data=await r.json();if(!r.ok||!data.success)throw new Error(data.error||'Erro ao salvar agendamento');show('Agendamento salvo com sucesso!','success');await carregarLista();}catch(e){console.error(e);show(e.message||'Erro ao salvar agendamento','error');}finally{btn.disabled=false;btn.textContent='Salvar agendamento';}}
async function carregarLista(){const r=await fetch('/api/agendamentos_tutoria');const data=await r.json();const tbody=document.getElementById('lista-agendamentos');tbody.innerHTML=data.length?data.map(i=>`<tr class="border-b border-slate-800"><td class="p-3">${i.data_agendamento||''}</td><td class="p-3">${i.hora_agendamento||''}</td><td class="p-3">${i.tutor_nome||''}</td><td class="p-3">${i.aluno_nome||''}</td><td class="p-3">${i.tema||''}</td><td class="p-3">${i.status||''}</td></tr>`).join(''):'<tr><td colspan="6" class="p-6 text-center text-slate-400">Nenhum agendamento cadastrado.</td></tr>';}
</script></body></html>
