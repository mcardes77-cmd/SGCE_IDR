<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Agendamento Tutoria</title><script src="https://cdn.tailwindcss.com"></script></head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-4"><div class="max-w-7xl mx-auto space-y-5">
<header class="flex justify-between"><h1 class="text-3xl font-bold text-emerald-400">AGENDAMENTO DE TUTORIA</h1><a href="/gestao_tutoria" class="bg-slate-700 px-4 py-2 rounded">Voltar</a></header>
<section class="bg-slate-800 rounded-xl p-4 border border-slate-700 grid md:grid-cols-4 gap-3">
<select id="tutor_id" class="bg-slate-900 border border-slate-700 rounded px-3 py-2"></select>
<select id="aluno_id" class="bg-slate-900 border border-slate-700 rounded px-3 py-2" disabled></select>
<button onclick="carregarAgendamentos()" class="bg-blue-700 rounded px-4 py-2">Carregar agendamentos</button>
<button onclick="abrirNovo()" class="bg-emerald-600 rounded px-4 py-2">Inserir agendamento</button>
</section>
<div id="lista" class="space-y-3"></div>
<section id="form" class="hidden bg-slate-800 rounded-xl p-4 border border-slate-700 space-y-3">
<input type="hidden" id="agendamento_id">
<input id="data_agendamento" type="date" class="w-full bg-slate-900 border border-slate-700 rounded px-3 py-2">
<input id="hora_agendamento" type="time" class="w-full bg-slate-900 border border-slate-700 rounded px-3 py-2">
<input id="tema" type="text" class="w-full bg-slate-900 border border-slate-700 rounded px-3 py-2" placeholder="Tema">
<select id="status" class="w-full bg-slate-900 border border-slate-700 rounded px-3 py-2"><option value="AGENDADO">AGENDADO</option><option value="CONCLUIDO">CONCLUÍDO</option><option value="CANCELADO">CANCELADO</option></select>
<textarea id="observacao" class="w-full h-24 bg-slate-900 border border-slate-700 rounded px-3 py-2" placeholder="Observação"></textarea>
<button onclick="salvarAgendamento()" class="bg-emerald-600 px-4 py-2 rounded">Confirmar agendamento</button>
</section></div>
<script>
let tutores=[], alunos=[], agendamentos=[]; function hojeISO(){return new Date().toISOString().slice(0,10);}
async function carregarTutores(){const r=await fetch('/api/tutores'); tutores=await r.json(); const s=document.getElementById('tutor_id'); s.innerHTML='<option value="">Selecione o tutor...</option>'+tutores.map(t=>`<option value="${t.id}">${t.nome}</option>`).join(''); if(tutores.length===1){s.value=tutores[0].id; s.disabled=true; await carregarAlunosDoTutor();}}
async function carregarAlunosDoTutor(){const tutorId=document.getElementById('tutor_id').value; const s=document.getElementById('aluno_id'); if(!tutorId){s.disabled=true; s.innerHTML=''; return;} alunos=await (await fetch(`/api/alunos_do_tutor/${tutorId}`)).json(); s.disabled=false; s.innerHTML='<option value="">Selecione o aluno...</option>'+alunos.map(a=>`<option value="${a.id}">${a.nome||a.aluno_nome||''}</option>`).join('');}
async function carregarAgendamentos(){const alunoId=document.getElementById('aluno_id').value; if(!alunoId) return alert('Selecione um aluno'); agendamentos=await (await fetch(`/api/agendamentos_tutoria?aluno_id=${alunoId}`)).json(); document.getElementById('lista').innerHTML=agendamentos.length?agendamentos.map(a=>`<div class="bg-slate-800 rounded-xl border border-slate-700 p-4"><div><strong>Data:</strong> ${a.data_agendamento||''} ${a.hora_agendamento||''}</div><div><strong>Tema:</strong> ${a.tema||''}</div><div><strong>Status:</strong> ${a.status||''}</div><div><strong>Observação:</strong> ${a.observacao||''}</div><button onclick="editar(${a.id})" class="mt-3 bg-amber-600 px-3 py-1 rounded">✏ Editar</button></div>`).join(''):'<div class="text-slate-400">Nenhum agendamento.</div>';}
function abrirNovo(){if(!document.getElementById('aluno_id').value) return alert('Selecione tutor e aluno'); document.getElementById('form').classList.remove('hidden'); document.getElementById('agendamento_id').value=''; document.getElementById('data_agendamento').value=hojeISO(); document.getElementById('hora_agendamento').value=''; document.getElementById('tema').value=''; document.getElementById('status').value='AGENDADO'; document.getElementById('observacao').value='';}
async function editar(id){const r=await fetch(`/api/agendamento_tutoria/${id}`); const j=await r.json(); if(!r.ok||!j.success) return alert(j.error||'Erro'); const x=j.data; document.getElementById('form').classList.remove('hidden'); document.getElementById('agendamento_id').value=x.id; document.getElementById('data_agendamento').value=x.data_agendamento||''; document.getElementById('hora_agendamento').value=x.hora_agendamento||''; document.getElementById('tema').value=x.tema||''; document.getElementById('status').value=x.status||'AGENDADO'; document.getElementById('observacao').value=x.observacao||'';}
async function salvarAgendamento(){const tutorId=document.getElementById('tutor_id').value, alunoId=document.getElementById('aluno_id').value; const tutor=tutores.find(t=>String(t.id)===String(tutorId))||{}; const aluno=alunos.find(a=>String(a.id)===String(alunoId))||{}; const payload={tutor_id:tutorId,tutor_nome:tutor.nome||'',aluno_id:alunoId,aluno_nome:aluno.nome||aluno.aluno_nome||'',sala_nome:aluno.sala_nome||'',data_agendamento:document.getElementById('data_agendamento').value,hora_agendamento:document.getElementById('hora_agendamento').value,tema:document.getElementById('tema').value,status:document.getElementById('status').value,observacao:document.getElementById('observacao').value}; const id=document.getElementById('agendamento_id').value; let r,j; if(id){r=await fetch(`/api/agendamento_tutoria/${id}`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)}); j=await r.json();} else {r=await fetch('/api/agendar_tutoria',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({tutor_id:payload.tutor_id,tutor_nome:payload.tutor_nome,aluno_id:payload.aluno_id,aluno_nome:payload.aluno_nome,sala_nome:payload.sala_nome,data:payload.data_agendamento,hora:payload.hora_agendamento,tema:payload.tema,observacao:payload.observacao,status:payload.status})}); j=await r.json();} if(!r.ok||!j.success) return alert(j.error||'Erro'); alert('Salvo'); document.getElementById('form').classList.add('hidden'); carregarAgendamentos();}
document.getElementById('tutor_id').addEventListener('change', carregarAlunosDoTutor); carregarTutores();
</script>
<footer class="mt-8 border-t border-slate-700 pt-4 text-center text-sm text-slate-400">
  <p><strong>Desenvolvido e Registrado por Marcelo André Nogueira Cardes</strong></p>
  <p>Licença Cortesia E. E. Professora Irene Dias Ribeiro</p>
</footer>
</body></html>
