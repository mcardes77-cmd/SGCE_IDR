<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova Ocorrência</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'dark-primary': '#0F172A',
                        'dark-secondary': '#1E293B',
                        'accent': '#10B981',
                        'text-light': '#F8FAFC',
                    },
                },
            },
        };
    </script>
    <style>
        .form-input, .form-select, .form-textarea {
            background-color: #374151;
            color: #F8FAFC;
            border: 1px solid #4B5563;
            padding: 0.75rem;
            border-radius: 0.375rem;
            width: 100%;
        }
        .form-input:focus, .form-select:focus, .form-textarea:focus {
            outline: none;
            border-color: #10B981;
            ring: 2px solid #10B981;
        }
    </style>
</head>
<body class="bg-dark-primary text-text-light min-h-screen p-4">
    <div class="max-w-4xl mx-auto">
        <header class="text-center mb-8">
            <h1 class="text-2xl font-bold text-accent">NOVA OCORRÊNCIA</h1>
            <button onclick="window.location.href='/gestao_ocorrencia'" class="mt-4 bg-gray-600 hover:bg-gray-700 px-4 py-2 rounded text-white transition duration-200">
                ← Voltar para Ocorrências
            </button>
        </header>

        <div class="bg-dark-secondary p-6 rounded-lg shadow-lg">
            <div id="mensagem-status" class="hidden mb-4 p-3 rounded text-sm"></div>
            
            <form id="form-ocorrencia">
                <div class="mb-6">
                    <label class="block text-sm text-gray-300 mb-2">Professor Responsável *</label>
                    <select id="professor" class="form-select" required onchange="carregarSalas()">
                        <option value="">Selecione o professor responsável</option>
                    </select>
                </div>

                <div class="mb-6">
                    <label class="block text-sm text-gray-300 mb-2">Sala *</label>
                    <select id="sala" class="form-select" required onchange="carregarAlunos()" disabled>
                        <option value="">Selecione o professor primeiro</option>
                    </select>
                </div>

                <div class="mb-6">
                    <label class="block text-sm text-gray-300 mb-2">Aluno *</label>
                    <select id="aluno" class="form-select" required onchange="carregarTutor()" disabled>
                        <option value="">Selecione a sala primeiro</option>
                    </select>
                </div>

                <div class="mb-6">
                    <label class="block text-sm text-gray-300 mb-2">Tutor</label>
                    <div id="tutor-info" class="p-3 bg-gray-800 rounded text-gray-300">
                        Será preenchido automaticamente ao selecionar o aluno
                    </div>
                </div>

                <div class="mb-6">
                    <label class="block text-sm text-gray-300 mb-2">Descrição da Ocorrência *</label>
                    <textarea id="descricao" class="form-textarea" rows="4" placeholder="Descreva detalhadamente o ocorrido..." required></textarea>
                </div>

                <div class="mb-6">
                    <label class="block text-sm text-gray-300 mb-2">Atendimento Professor *</label>
                    <textarea id="atendimento_professor" class="form-textarea" rows="3" placeholder="Quais medidas imediatas foram tomadas?" required></textarea>
                </div>

                <div class="mb-6">
                    <h3 class="text-lg font-semibold mb-3 text-accent">Encaminhar para</h3>
                    <div class="flex flex-wrap gap-6">
                        <label class="flex items-center">
                            <input type="radio" name="destino" value="tutor" class="mr-2 h-5 w-5" checked>
                            <span>Tutor</span>
                        </label>
                        <label class="flex items-center">
                            <input type="radio" name="destino" value="coordenacao" class="mr-2 h-5 w-5">
                            <span>Coordenação</span>
                        </label>
                        <label class="flex items-center">
                            <input type="radio" name="destino" value="gestao" class="mr-2 h-5 w-5">
                            <span>Gestão</span>
                        </label>
                        <label class="flex items-center">
                            <input type="radio" name="destino" value="nenhum" class="mr-2 h-5 w-5">
                            <span>Nenhum</span>
                        </label>
                    </div>
                </div>

                <button type="button" id="btn-registrar" onclick="registrarOcorrencia()" class="w-full bg-accent hover:bg-emerald-700 py-3 rounded font-bold text-white transition duration-200">
                    REGISTRAR OCORRÊNCIA
                </button>
            </form>
        </div>

        <footer class="w-full text-center mt-10 p-4 text-gray-400 text-sm border-t border-gray-800">
            <p class="mb-1 text-base font-medium">DESENVOLVEDOR: MARCELO ANDRÉ NOGUEIRA CARDES</p>
            <p class="text-xs font-light tracking-wide">LICENCIADO: E.E. PEI PROFESSORA IRENE DIAS RIBEIRO</p>
        </footer>
    </div>

    <script>
        let alunosDaSala = [];
        let tutorNomeSelecionado = "";

        document.addEventListener('DOMContentLoaded', carregarProfessores);

        function mostrarMensagem(mensagem, tipo) {
            const elemento = document.getElementById('mensagem-status');
            elemento.textContent = mensagem;
            elemento.className = `mb-4 p-3 rounded text-sm ${tipo === 'success' ? 'bg-green-600' : tipo === 'error' ? 'bg-red-600' : 'bg-blue-600'} text-white`;
            elemento.classList.remove('hidden');
            setTimeout(() => elemento.classList.add('hidden'), 5000);
        }

        async function carregarProfessores() {
            try {
                const response = await fetch('/api/professores');
                const professores = await response.json();
                const select = document.getElementById('professor');
                select.innerHTML = '<option value="">Selecione o professor responsável</option>';
                professores.forEach(p => {
                    const opt = document.createElement('option');
                    opt.value = p.id;
                    opt.textContent = p.nome;
                    select.appendChild(opt);
                });
            } catch (error) {
                mostrarMensagem('Erro ao carregar professores', 'error');
            }
        }

        async function carregarSalas() {
            const professorId = document.getElementById('professor').value;
            const salaSelect = document.getElementById('sala');
            
            if (!professorId) {
                salaSelect.disabled = true;
                return;
            }

            try {
                // Rota unificada no seu Python: /api/salas_por_professor/<int:professor_id>
                const response = await fetch(`/api/salas_por_professor/${professorId}`);
                const salas = await response.json();
                salaSelect.disabled = false;
                salaSelect.innerHTML = '<option value="">Selecione a sala</option>';
                salas.forEach(s => {
                    const opt = document.createElement('option');
                    opt.value = s.id;
                    opt.textContent = s.nome || s.sala;
                    salaSelect.appendChild(opt);
                });
            } catch (error) {
                mostrarMensagem('Erro ao carregar salas', 'error');
            }
        }

        async function carregarAlunos() {
            const salaId = document.getElementById('sala').value;
            const alunoSelect = document.getElementById('aluno');
            
            if (!salaId) {
                alunoSelect.disabled = true;
                return;
            }

            try {
                // Rota unificada no seu Python: /api/alunos_por_sala/<int:sala_id>
                const response = await fetch(`/api/alunos_por_sala/${salaId}`);
                alunosDaSala = await response.json();
                alunoSelect.disabled = false;
                alunoSelect.innerHTML = '<option value="">Selecione o aluno</option>';
                alunosDaSala.forEach(a => {
                    const opt = document.createElement('option');
                    opt.value = a.id;
                    opt.textContent = a.nome;
                    alunoSelect.appendChild(opt);
                });
            } catch (error) {
                mostrarMensagem('Erro ao carregar alunos', 'error');
            }
        }

        function carregarTutor() {
            const alunoId = document.getElementById('aluno').value;
            const tutorInfo = document.getElementById('tutor-info');
            const aluno = alunosDaSala.find(a => a.id == alunoId);

            if (aluno && aluno.tutor_nome) {
                tutorNomeSelecionado = aluno.tutor_nome;
                tutorInfo.textContent = aluno.tutor_nome;
                tutorInfo.className = 'p-3 bg-green-900 rounded text-green-300 font-medium';
            } else {
                tutorNomeSelecionado = "";
                tutorInfo.textContent = 'Tutor não vinculado';
                tutorInfo.className = 'p-3 bg-yellow-900 rounded text-yellow-300';
            }
        }

        async function registrarOcorrencia() {
            const btn = document.getElementById('btn-registrar');
            const form = document.getElementById('form-ocorrencia');
            
            if (!form.checkValidity()) {
                mostrarMensagem('Preencha todos os campos obrigatórios', 'error');
                return;
            }

            btn.disabled = true;
            btn.textContent = 'Processando...';

            try {
                const profSelect = document.getElementById('professor');
                const payload = {
                    aluno_id: document.getElementById('aluno').value,
                    professor_id: profSelect.value,
                    professor_nome: profSelect.options[profSelect.selectedIndex].text,
                    tutor_nome: tutorNomeSelecionado,
                    descricao: document.getElementById('descricao').value,
                    atendimento_professor: document.getElementById('atendimento_professor').value,
                    destino: document.querySelector('input[name="destino"]:checked').value
                };

                const response = await fetch('/api/registrar_ocorrencia', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const result = await response.json();
                if (result.success) {
                    mostrarMensagem('Sucesso! Redirecionando...', 'success');
                    setTimeout(() => window.location.href = '/gestao_ocorrencia', 1500);
                } else {
                    throw new Error(result.error);
                }
            } catch (error) {
                mostrarMensagem('Erro: ' + error.message, 'error');
                btn.disabled = false;
                btn.textContent = 'REGISTRAR OCORRÊNCIA';
            }
        }
    </script>
</body>
</html>
