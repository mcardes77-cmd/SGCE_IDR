<!DOCTYPE html><html lang='pt-BR'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width, initial-scale=1.0'><title>Nova Ocorrência</title><script src='https://cdn.tailwindcss.com'></script>
<style id="sgce-responsive-patch">
  html { font-size: clamp(13px, 0.80rem + 0.25vw, 16px); }
  body { overflow-x: hidden; }
  img, svg, canvas, video { max-width: 100%; height: auto; }
  input, select, textarea, button { max-width: 100%; }
  @media (max-width: 1280px) {
    .max-w-7xl, .max-w-6xl, .max-w-5xl, .max-w-4xl { max-width: 100% !important; }
  }
  @media (max-width: 1024px) {
    .text-3xl { font-size: 1.6rem !important; line-height: 2rem !important; }
    .text-2xl { font-size: 1.35rem !important; line-height: 1.8rem !important; }
    .text-xl { font-size: 1.15rem !important; line-height: 1.55rem !important; }
    .p-6, .p-5 { padding: 1rem !important; }
    .px-6 { padding-left: 1rem !important; padding-right: 1rem !important; }
    .py-8 { padding-top: 1rem !important; padding-bottom: 1rem !important; }
  }
  @media (max-width: 768px) {
    table { display: block; width: 100%; overflow-x: auto; white-space: nowrap; }
    [class*="grid-cols-2"], [class*="grid-cols-3"], [class*="grid-cols-4"], [class*="grid-cols-5"], [class*="grid-cols-6"] {
      grid-template-columns: minmax(0, 1fr) !important;
    }
    .min-w-72 { min-width: 100% !important; }
    .text-sm { font-size: 0.82rem !important; }
    .text-base { font-size: 0.92rem !important; }
    .text-lg { font-size: 1rem !important; }
    .rounded-2xl { border-radius: 1rem !important; }
    [class*="max-w-"] { max-width: 100% !important; }
  }
  @media (max-width: 640px) {
    body[class*="p-6"] { padding: 1rem !important; }
    .px-4 { padding-left: 0.75rem !important; padding-right: 0.75rem !important; }
    .py-3, .py-2 { padding-top: 0.65rem !important; padding-bottom: 0.65rem !important; }
    .gap-4 { gap: 0.75rem !important; }
    .gap-3 { gap: 0.65rem !important; }
  }
</style>

</head><body class='bg-slate-900 text-white min-h-screen p-6'><div class='max-w-4xl mx-auto'><header class='text-center mb-8'><h1 class='text-3xl font-bold text-emerald-400'>Nova Ocorrência</h1><button onclick="window.location.href='/gestao_ocorrencia'" class='mt-4 bg-slate-700 hover:bg-slate-600 px-4 py-2 rounded-lg'>← Voltar</button></header><div class='bg-slate-800 rounded-2xl shadow p-6'><div id='msg' class='hidden mb-4 px-4 py-3 rounded'></div><div class='space-y-5'><div><label class='block mb-1 text-sm text-slate-300'>Professor responsável *</label><select id='professor' class='w-full rounded-lg bg-slate-700 border border-slate-600 p-3' onchange='carregarSalas()'></select></div><div><label class='block mb-1 text-sm text-slate-300'>Sala *</label><select id='sala' class='w-full rounded-lg bg-slate-700 border border-slate-600 p-3' onchange='carregarAlunos()' disabled></select></div><div><label class='block mb-1 text-sm text-slate-300'>Aluno *</label><select id='aluno' class='w-full rounded-lg bg-slate-700 border border-slate-600 p-3' onchange='preencherTutor()' disabled></select></div><div><label class='block mb-1 text-sm text-slate-300'>Tutor</label><div id='tutor-box' class='w-full rounded-lg bg-slate-900 border border-slate-700 p-3 text-slate-300'>Será preenchido automaticamente</div></div><div><label class='block mb-1 text-sm text-slate-300'>Descrição *</label><textarea id='descricao' rows='4' class='w-full rounded-lg bg-slate-700 border border-slate-600 p-3'></textarea></div><div><label class='block mb-1 text-sm text-slate-300'>Atendimento Professor *</label><textarea id='atendimento_professor' rows='4' class='w-full rounded-lg bg-slate-700 border border-slate-600 p-3'></textarea></div><div><label class='block mb-2 text-sm text-slate-300'>Encaminhar para</label><div class='grid grid-cols-2 md:grid-cols-4 gap-3'><label class='bg-slate-700 rounded-lg p-3'><input type='radio' name='destino' value='tutor' checked> Tutor</label><label class='bg-slate-700 rounded-lg p-3'><input type='radio' name='destino' value='coordenacao'> Coordenação</label><label class='bg-slate-700 rounded-lg p-3'><input type='radio' name='destino' value='gestao'> Gestão</label><label class='bg-slate-700 rounded-lg p-3'><input type='radio' name='destino' value='nenhum'> Finalizar</label></div></div><button id='btnSalvar' onclick='registrar()' class='w-full bg-emerald-600 hover:bg-emerald-700 px-4 py-3 rounded-lg font-bold'>Registrar ocorrência</button></div></div></div><script>let alunosDaSala=[];document.addEventListener('DOMContentLoaded',carregarProfessores);function show(msg,tipo='info'){const el=document.getElementById('msg');el.textContent=msg;el.className='mb-4 px-4 py-3 rounded text-white';if(tipo==='error')el.classList.add('bg-red-600');else if(tipo==='success')el.classList.add('bg-green-600');else el.classList.add('bg-blue-600');el.classList.remove('hidden');}async function carregarProfessores(){const sel=document.getElementById('professor');sel.innerHTML='<option value="">Carregando...</option>';try{const r=await fetch('/api/professores');const data=await r.json();if(!r.ok)throw new Error(data.error||'Erro ao carregar professores');sel.innerHTML='<option value="">Selecione o professor responsável</option>'+(data||[]).map(p=>`<option value="${p.id}">${p.nome||''}</option>`).join('');}catch(e){console.error(e);sel.innerHTML='<option value="">Erro ao carregar professores</option>';show('Erro ao carregar professores','error');}}async function carregarSalas(){const professor=document.getElementById('professor').value;const sala=document.getElementById('sala');const aluno=document.getElementById('aluno');if(!professor){sala.disabled=true;aluno.disabled=true;sala.innerHTML='<option value="">Selecione o professor primeiro</option>';aluno.innerHTML='<option value="">Selecione a sala primeiro</option>';return;}const r=await fetch(`/api/salas_por_professor/${professor}`);const data=await r.json();sala.disabled=false;sala.innerHTML='<option value="">Selecione a sala</option>'+(data||[]).map(s=>`<option value="${s.id}">${s.nome||''}</option>`).join('');aluno.disabled=true;aluno.innerHTML='<option value="">Selecione a sala primeiro</option>';}async function carregarAlunos(){const sala=document.getElementById('sala').value;const aluno=document.getElementById('aluno');if(!sala){aluno.disabled=true;aluno.innerHTML='<option value="">Selecione a sala primeiro</option>';return;}const r=await fetch(`/api/alunos_por_sala/${sala}`);const data=await r.json();alunosDaSala=data||[];aluno.disabled=false;aluno.innerHTML='<option value="">Selecione o aluno</option>'+alunosDaSala.map(a=>`<option value="${a.id}">${a.nome||''}</option>`).join('');}function preencherTutor(){const alunoId=document.getElementById('aluno').value;const aluno=alunosDaSala.find(a=>String(a.id)===String(alunoId));document.getElementById('tutor-box').textContent=aluno?.tutor_nome||'Tutor não encontrado';}async function registrar(){const professorSel=document.getElementById('professor');const salaSel=document.getElementById('sala');const alunoSel=document.getElementById('aluno');const aluno=alunosDaSala.find(a=>String(a.id)===String(alunoSel.value));const payload={aluno_id:alunoSel.value,aluno_nome:aluno?.nome||'',sala_nome:salaSel.options[salaSel.selectedIndex]?.text||'',professor_id:professorSel.value,professor_nome:professorSel.options[professorSel.selectedIndex]?.text||'',tutor_nome:aluno?.tutor_nome||'',descricao:document.getElementById('descricao').value.trim(),atendimento_professor:document.getElementById('atendimento_professor').value.trim(),destino:document.querySelector('input[name="destino"]:checked')?.value||'nenhum'};if(!payload.aluno_id||!payload.professor_id||!payload.descricao||!payload.atendimento_professor){show('Preencha todos os campos obrigatórios.','error');return;}const btn=document.getElementById('btnSalvar');btn.disabled=true;btn.textContent='Registrando...';try{const r=await fetch('/api/registrar_ocorrencia',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});const data=await r.json();if(!r.ok||!data.success)throw new Error(data.error||'Erro ao registrar ocorrência');show(`Ocorrência #${data.numero} registrada com sucesso.`,'success');setTimeout(()=>window.location.href='/gestao_ocorrencia',1200);}catch(e){console.error(e);show(e.message||'Erro ao registrar ocorrência','error');btn.disabled=false;btn.textContent='Registrar ocorrência';}}</script>
<footer class="mt-8 border-t border-slate-700 pt-4 text-center text-sm text-slate-400">
  <p><strong>Desenvolvido e Registrado por Marcelo André Nogueira Cardes</strong></p>
  <p>Licença Cortesia E. E. Professora Irene Dias Ribeiro</p>
</footer>
</body></html>
