<!DOCTYPE html><html lang='pt-BR'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width, initial-scale=1.0'><title>Nova Ocorrência</title><script src='https://cdn.tailwindcss.com'></script></head><body class='bg-slate-900 text-white min-h-screen p-6'><div class='max-w-4xl mx-auto'><header class='text-center mb-8'><h1 class='text-3xl font-bold text-emerald-400'>Nova Ocorrência</h1><button onclick="window.location.href='/gestao_ocorrencia'" class='mt-4 bg-slate-700 hover:bg-slate-600 px-4 py-2 rounded-lg'>← Voltar</button></header><div class='bg-slate-800 rounded-2xl shadow p-6'><div id='msg' class='hidden mb-4 px-4 py-3 rounded'></div><div class='space-y-5'><div><label class='block mb-1 text-sm text-slate-300'>Professor responsável *</label><select id='professor' class='w-full rounded-lg bg-slate-700 border border-slate-600 p-3' onchange='carregarSalas()'></select></div><div><label class='block mb-1 text-sm text-slate-300'>Sala *</label><select id='sala' class='w-full rounded-lg bg-slate-700 border border-slate-600 p-3' onchange='carregarAlunos()' disabled></select></div><div><label class='block mb-1 text-sm text-slate-300'>Aluno *</label><select id='aluno' class='w-full rounded-lg bg-slate-700 border border-slate-600 p-3' onchange='preencherTutor()' disabled></select></div><div><label class='block mb-1 text-sm text-slate-300'>Tutor</label><div id='tutor-box' class='w-full rounded-lg bg-slate-900 border border-slate-700 p-3 text-slate-300'>Será preenchido automaticamente</div></div><div><label class='block mb-1 text-sm text-slate-300'>Descrição *</label><textarea id='descricao' rows='4' class='w-full rounded-lg bg-slate-700 border border-slate-600 p-3'></textarea></div><div><label class='block mb-1 text-sm text-slate-300'>Atendimento Professor *</label><textarea id='atendimento_professor' rows='4' class='w-full rounded-lg bg-slate-700 border border-slate-600 p-3'></textarea></div><div><label class='block mb-2 text-sm text-slate-300'>Encaminhar para</label><div class='grid grid-cols-2 md:grid-cols-4 gap-3'><label class='bg-slate-700 rounded-lg p-3'><input type='radio' name='destino' value='tutor' checked> Tutor</label><label class='bg-slate-700 rounded-lg p-3'><input type='radio' name='destino' value='coordenacao'> Coordenação</label><label class='bg-slate-700 rounded-lg p-3'><input type='radio' name='destino' value='gestao'> Gestão</label><label class='bg-slate-700 rounded-lg p-3'><input type='radio' name='destino' value='nenhum'> Finalizar</label></div></div><button id='btnSalvar' onclick='registrar()' class='w-full bg-emerald-600 hover:bg-emerald-700 px-4 py-3 rounded-lg font-bold'>Registrar ocorrência</button></div></div></div><script>let alunosDaSala=[];document.addEventListener('DOMContentLoaded',carregarProfessores);function show(msg,tipo='info'){const el=document.getElementById('msg');el.textContent=msg;el.className='mb-4 px-4 py-3 rounded text-white';if(tipo==='error')el.classList.add('bg-red-600');else if(tipo==='success')el.classList.add('bg-green-600');else el.classList.add('bg-blue-600');el.classList.remove('hidden');}async function carregarProfessores(){const sel=document.getElementById('professor');sel.innerHTML='<option value="">Carregando...</option>';try{const r=await fetch('/api/professores');const data=await r.json();if(!r.ok)throw new Error(data.error||'Erro ao carregar professores');sel.innerHTML='<option value="">Selecione o professor responsável</option>'+(data||[]).map(p=>`<option value="${p.id}">${p.nome||''}</option>`).join('');}catch(e){console.error(e);sel.innerHTML='<option value="">Erro ao carregar professores</option>';show('Erro ao carregar professores','error');}}async function carregarSalas(){const professor=document.getElementById('professor').value;const sala=document.getElementById('sala');const aluno=document.getElementById('aluno');if(!professor){sala.disabled=true;aluno.disabled=true;sala.innerHTML='<option value="">Selecione o professor primeiro</option>';aluno.innerHTML='<option value="">Selecione a sala primeiro</option>';return;}const r=await fetch(`/api/salas_por_professor/${professor}`);const data=await r.json();sala.disabled=false;sala.innerHTML='<option value="">Selecione a sala</option>'+(data||[]).map(s=>`<option value="${s.id}">${s.nome||''}</option>`).join('');aluno.disabled=true;aluno.innerHTML='<option value="">Selecione a sala primeiro</option>';}async function carregarAlunos(){const sala=document.getElementById('sala').value;const aluno=document.getElementById('aluno');if(!sala){aluno.disabled=true;aluno.innerHTML='<option value="">Selecione a sala primeiro</option>';return;}const r=await fetch(`/api/alunos_por_sala/${sala}`);const data=await r.json();alunosDaSala=data||[];aluno.disabled=false;aluno.innerHTML='<option value="">Selecione o aluno</option>'+alunosDaSala.map(a=>`<option value="${a.id}">${a.nome||''}</option>`).join('');}function preencherTutor(){const alunoId=document.getElementById('aluno').value;const aluno=alunosDaSala.find(a=>String(a.id)===String(alunoId));document.getElementById('tutor-box').textContent=aluno?.tutor_nome||'Tutor não encontrado';}async function registrar(){const professorSel=document.getElementById('professor');const salaSel=document.getElementById('sala');const alunoSel=document.getElementById('aluno');const aluno=alunosDaSala.find(a=>String(a.id)===String(alunoSel.value));const payload={aluno_id:alunoSel.value,aluno_nome:aluno?.nome||'',sala_nome:salaSel.options[salaSel.selectedIndex]?.text||'',professor_id:professorSel.value,professor_nome:professorSel.options[professorSel.selectedIndex]?.text||'',tutor_nome:aluno?.tutor_nome||'',descricao:document.getElementById('descricao').value.trim(),atendimento_professor:document.getElementById('atendimento_professor').value.trim(),destino:document.querySelector('input[name="destino"]:checked')?.value||'nenhum'};if(!payload.aluno_id||!payload.professor_id||!payload.descricao||!payload.atendimento_professor){show('Preencha todos os campos obrigatórios.','error');return;}const btn=document.getElementById('btnSalvar');btn.disabled=true;btn.textContent='Registrando...';try{const r=await fetch('/api/registrar_ocorrencia',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});const data=await r.json();if(!r.ok||!data.success)throw new Error(data.error||'Erro ao registrar ocorrência');show(`Ocorrência #${data.numero} registrada com sucesso.`,'success');setTimeout(()=>window.location.href='/gestao_ocorrencia',1200);}catch(e){console.error(e);show(e.message||'Erro ao registrar ocorrência','error');btn.disabled=false;btn.textContent='Registrar ocorrência';}}</script></body></html>
