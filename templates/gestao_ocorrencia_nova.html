<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova Ocorrência - Gestão Escolar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'dark-primary': '#0F172A',
                        'dark-secondary': '#1E293B',
                        'accent': '#10B981',
                        'text-light': '#F8FAFC',
                    },
                },
            },
        };
    </script>
    <style>
        .form-select, .form-textarea {
            background-color: #374151;
            color: #F8FAFC;
            border: 1px solid #4B5563;
            padding: 0.75rem;
            border-radius: 0.375rem;
            width: 100%;
            transition: all 0.2s;
        }
        .form-select:focus, .form-textarea:focus {
            outline: none;
            border-color: #10B981;
            box-shadow: 0 0 0 2px rgba(16, 185, 129, 0.2);
        }
        .form-select:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
    </style>
</head>
<body class="bg-dark-primary text-text-light min-h-screen p-4">
    <div class="max-w-4xl mx-auto">
        <header class="text-center mb-8">
            <h1 class="text-2xl font-bold text-accent">REGISTAR NOVA OCORRÊNCIA</h1>
            <p class="text-gray-400 text-sm mt-2">Preencha os dados abaixo para registar o incidente</p>
            <button onclick="window.location.href='/gestao_ocorrencia'" class="mt-4 bg-gray-600 hover:bg-gray-700 px-4 py-2 rounded text-white transition duration-200 text-sm">
                ← Voltar ao Menu
            </button>
        </header>

        <div class="bg-dark-secondary p-6 rounded-lg shadow-xl border border-gray-800">
            <div id="mensagem-status" class="hidden mb-6 p-4 rounded text-sm font-medium"></div>
            
            <form id="form-ocorrencia" class="space-y-6">
                <div>
                    <label class="block text-sm font-medium text-gray-300 mb-2">Professor Responsável *</label>
                    <select id="professor" class="form-select" required onchange="carregarSalas()">
                        <option value="">A carregar professores...</option>
                    </select>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-300 mb-2">Sala/Turma *</label>
                    <select id="sala" class="form-select" required onchange="carregarAlunos()" disabled>
                        <option value="">Selecione o professor primeiro</option>
                    </select>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-300 mb-2">Aluno *</label>
                    <select id="aluno" class="form-select" required onchange="vincularTutor()" disabled>
                        <option value="">Selecione a sala primeiro</option>
                    </select>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-300 mb-2">Tutor Vinculado</label>
                    <div id="tutor-display" class="p-3 bg-gray-800 rounded border border-gray-700 text-gray-400 italic">
                        O tutor será identificado após selecionar o aluno
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-300 mb-2">Descrição do Ocorrido *</label>
                    <textarea id="descricao" class="form-textarea" rows="4" placeholder="Detalhes sobre o comportamento ou incidente..." required></textarea>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-300 mb-2">Ação/Atendimento do Professor *</label>
                    <textarea id="atendimento_professor" class="form-textarea" rows="3" placeholder="Que medidas foram tomadas no momento?" required></textarea>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-300 mb-3 text-accent">Encaminhamento Imediato</label>
                    <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                        <label class="flex items-center p-3 bg-gray-800 rounded border border-gray-700 cursor-pointer hover:bg-gray-700">
                            <input type="radio" name="destino" value="tutor" class="w-4 h-4 text-accent" checked>
                            <span class="ml-2 text-sm">Tutor</span>
                        </label>
                        <label class="flex items-center p-3 bg-gray-800 rounded border border-gray-700 cursor-pointer hover:bg-gray-700">
                            <input type="radio" name="destino" value="coordenacao" class="w-4 h-4 text-accent">
                            <span class="ml-2 text-sm">Coordenação</span>
                        </label>
                        <label class="flex items-center p-3 bg-gray-800 rounded border border-gray-700 cursor-pointer hover:bg-gray-700">
                            <input type="radio" name="destino" value="gestao" class="w-4 h-4 text-accent">
                            <span class="ml-2 text-sm">Gestão</span>
                        </label>
                        <label class="flex items-center p-3 bg-gray-800 rounded border border-gray-700 cursor-pointer hover:bg-gray-700">
                            <input type="radio" name="destino" value="nenhum" class="w-4 h-4 text-accent">
                            <span class="ml-2 text-sm">Nenhum</span>
                        </label>
                    </div>
                </div>

                <button type="button" id="btn-submit" onclick="enviarOcorrencia()" class="w-full bg-accent hover:bg-emerald-600 text-white font-bold py-4 rounded-md transition duration-300 shadow-lg transform hover:scale-[1.01]">
                    REGISTAR OCORRÊNCIA
                </button>
            </form>
        </div>

        <footer class="mt-12 text-center text-gray-500 text-xs pb-8">
            <p class="font-bold text-gray-400">DESENVOLVEDOR: MARCELO ANDRÉ NOGUEIRA CARDES</p>
            <p>SISTEMA DE GESTÃO ESCOLAR UNIFICADO - PEI PROFª IRENE DIAS RIBEIRO</p>
        </footer>
    </div>

    <script>
        let alunosCarregados = [];
        let tutorAtual = "";

        // Inicialização
        document.addEventListener('DOMContentLoaded', carregarProfessores);

        function mostrarMensagem(texto, tipo) {
            const box = document.getElementById('mensagem-status');
            box.textContent = texto;
            box.className = `mb-6 p-4 rounded text-sm font-medium ${tipo === 'success' ? 'bg-green-900/50 text-green-400 border border-green-800' : 'bg-red-900/50 text-red-400 border border-red-800'}`;
            box.classList.remove('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        async function carregarProfessores() {
            try {
                const response = await fetch('/api/professores');
                const professores = await response.json();
                const select = document.getElementById('professor');
                
                select.innerHTML = '<option value="">Selecione o professor</option>';
                professores.forEach(p => {
                    const opt = document.createElement('option');
                    opt.value = p.id;
                    opt.textContent = p.nome; // Campo 'nome' da d_funcionarios
                    select.appendChild(opt);
                });
            } catch (err) {
                mostrarMensagem('Falha ao ligar ao servidor para carregar professores.', 'error');
            }
        }

        async function carregarSalas() {
            const salaSelect = document.getElementById('sala');
            const profId = document.getElementById('professor').value;
            
            if (!profId) {
                salaSelect.disabled = true;
                return;
            }

            try {
                // Utiliza a rota de salas ativas do seu código
                const response = await fetch('/api/d_salas');
                const salas = await response.json();
                
                salaSelect.innerHTML = '<option value="">Selecione a sala</option>';
                salas.forEach(s => {
                    const opt = document.createElement('option');
                    opt.value = s.id;
                    opt.textContent = s.nome; // Nome da sala
                    salaSelect.appendChild(opt);
                });
                salaSelect.disabled = false;
            } catch (err) {
                mostrarMensagem('Erro ao carregar lista de salas.', 'error');
            }
        }

        async function carregarAlunos() {
            const alunoSelect = document.getElementById('aluno');
            const salaId = document.getElementById('sala').value;
            
            if (!salaId) {
                alunoSelect.disabled = true;
                return;
            }

            try {
                const response = await fetch(`/api/alunos_por_sala/${salaId}`);
                alunosCarregados = await response.json();
                
                alunoSelect.innerHTML = '<option value="">Selecione o aluno</option>';
                alunosCarregados.forEach(a => {
                    const opt = document.createElement('option');
                    opt.value = a.id;
                    opt.textContent = a.nome; // Campo 'nome' da d_alunos
                    alunoSelect.appendChild(opt);
                });
                alunoSelect.disabled = false;
            } catch (err) {
                mostrarMensagem('Erro ao carregar alunos desta sala.', 'error');
            }
        }

        function vincularTutor() {
            const alunoId = document.getElementById('aluno').value;
            const display = document.getElementById('tutor-display');
            const aluno = alunosCarregados.find(a => a.id == alunoId);

            if (aluno) {
                tutorAtual = aluno.tutor_nome || "Não atribuído"; // Campo 'tutor_nome' da d_alunos
                display.textContent = tutorAtual;
                display.className = "p-3 bg-emerald-900/30 rounded border border-emerald-800 text-emerald-400 font-bold";
            } else {
                tutorAtual = "";
                display.textContent = "O tutor será identificado após selecionar o aluno";
                display.className = "p-3 bg-gray-800 rounded border border-gray-700 text-gray-400 italic";
            }
        }

        async function enviarOcorrencia() {
            const btn = document.getElementById('btn-submit');
            const profSelect = document.getElementById('professor');
            
            // Validação básica
            if (!profSelect.value || !document.getElementById('aluno').value || !document.getElementById('descricao').value) {
                mostrarMensagem('Por favor, preencha todos os campos obrigatórios (*).', 'error');
                return;
            }

            btn.disabled = true;
            btn.textContent = 'A PROCESSAR REGISTO...';

            try {
                const payload = {
                    aluno_id: document.getElementById('aluno').value,
                    professor_id: profSelect.value,
                    professor_nome: profSelect.options[profSelect.selectedIndex].text,
                    tutor_nome: tutorAtual,
                    descricao: document.getElementById('descricao').value,
                    atendimento_professor: document.getElementById('atendimento_professor').value,
                    destino: document.querySelector('input[name="destino"]:checked').value
                };

                const response = await fetch('/api/registrar_ocorrencia', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();

                if (data.success) {
                    mostrarMensagem('Ocorrência registada com sucesso! A redirecionar...', 'success');
                    setTimeout(() => window.location.href = '/gestao_ocorrencia', 2000);
                } else {
                    throw new Error(data.error || 'Erro desconhecido no servidor');
                }
            } catch (err) {
                mostrarMensagem('Erro ao gravar: ' + err.message, 'error');
                btn.disabled = false;
                btn.textContent = 'REGISTAR OCORRÊNCIA';
            }
        }
    </script>
</body>
</html>
