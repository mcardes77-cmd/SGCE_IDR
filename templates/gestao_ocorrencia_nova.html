<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova Ocorrência - PEI Irene Dias Ribeiro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'dark-primary': '#0F172A',
                        'dark-secondary': '#1E293B',
                        'accent': '#10B981',
                        'text-light': '#F8FAFC',
                    },
                },
            },
        };
    </script>
    <style>
        .form-input, .form-select, .form-textarea {
            background-color: #374151;
            color: #F8FAFC;
            border: 1px solid #4B5563;
            padding: 0.75rem;
            border-radius: 0.375rem;
            width: 100%;
        }
        .form-input:focus, .form-select:focus, .form-textarea:focus {
            outline: none;
            border-color: #10B981;
            box-shadow: 0 0 0 2px rgba(16, 185, 129, 0.2);
        }
        select:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
    </style>
</head>
<body class="bg-dark-primary text-text-light min-h-screen p-4">
    <div class="max-w-4xl mx-auto">
        <header class="text-center mb-8">
            <h1 class="text-2xl font-bold text-accent tracking-tight">NOVA OCORRÊNCIA</h1>
            <p class="text-gray-400 text-sm mt-1">Registro de incidentes escolares</p>
            <button onclick="window.location.href='/gestao_ocorrencia'" class="mt-4 bg-gray-600 hover:bg-gray-700 px-4 py-2 rounded text-white transition duration-200 text-sm">
                ← Voltar para Painel
            </button>
        </header>

        <div class="bg-dark-secondary p-6 rounded-lg shadow-2xl border border-gray-800">
            <div id="mensagem-status" class="hidden mb-4 p-3 rounded text-sm font-medium animate-pulse"></div>
            
            <form id="form-ocorrencia">
                <div class="mb-6">
                    <label class="block text-sm font-medium text-gray-300 mb-2">Professor Responsável *</label>
                    <select id="professor" class="form-select" required onchange="carregarSalas()">
                        <option value="">Carregando professores...</option>
                    </select>
                </div>

                <div class="mb-6">
                    <label class="block text-sm font-medium text-gray-300 mb-2">Sala/Turma *</label>
                    <select id="sala" class="form-select" required onchange="carregarAlunos()" disabled>
                        <option value="">Selecione o professor primeiro</option>
                    </select>
                </div>

                <div class="mb-6">
                    <label class="block text-sm font-medium text-gray-300 mb-2">Aluno *</label>
                    <select id="aluno" class="form-select" required onchange="atualizarDadosTutor()" disabled>
                        <option value="">Selecione a sala primeiro</option>
                    </select>
                </div>

                <div class="mb-6">
                    <label class="block text-sm font-medium text-gray-300 mb-2">Tutor Vinculado</label>
                    <div id="tutor-info" class="p-3 bg-gray-800 rounded border border-gray-700 text-gray-400 italic">
                        O tutor será identificado automaticamente após selecionar o aluno.
                    </div>
                </div>

                <hr class="border-gray-700 my-8">

                <div class="mb-6">
                    <label class="block text-sm font-medium text-gray-300 mb-2">Descrição da Ocorrência *</label>
                    <textarea id="descricao" class="form-textarea" rows="4" placeholder="Relate o ocorrido com clareza..." required></textarea>
                </div>

                <div class="mb-6">
                    <label class="block text-sm font-medium text-gray-300 mb-2">Medidas Tomadas pelo Professor *</label>
                    <textarea id="atendimento_professor" class="form-textarea" rows="3" placeholder="Quais ações imediatas foram realizadas?" required></textarea>
                </div>

                <div class="mb-8">
                    <h3 class="text-lg font-semibold mb-4 text-accent border-b border-gray-700 pb-2">Encaminhar para:</h3>
                    <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                        <label class="flex items-center p-3 bg-gray-800 rounded cursor-pointer hover:bg-gray-700 transition">
                            <input type="radio" name="destino" value="tutor" class="mr-3 h-4 w-4 text-emerald-500" checked>
                            <span class="text-sm">Tutor</span>
                        </label>
                        <label class="flex items-center p-3 bg-gray-800 rounded cursor-pointer hover:bg-gray-700 transition">
                            <input type="radio" name="destino" value="coordenacao" class="mr-3 h-4 w-4 text-yellow-500">
                            <span class="text-sm">Coordenação</span>
                        </label>
                        <label class="flex items-center p-3 bg-gray-800 rounded cursor-pointer hover:bg-gray-700 transition">
                            <input type="radio" name="destino" value="gestao" class="mr-3 h-4 w-4 text-red-500">
                            <span class="text-sm">Gestão</span>
                        </label>
                        <label class="flex items-center p-3 bg-gray-800 rounded cursor-pointer hover:bg-gray-700 transition">
                            <input type="radio" name="destino" value="nenhum" class="mr-3 h-4 w-4 text-gray-400">
                            <span class="text-sm">Finalizar</span>
                        </label>
                    </div>
                </div>

                <button type="button" id="btn-registrar" onclick="registrarOcorrencia()" class="w-full bg-accent hover:bg-emerald-700 py-4 rounded-lg font-bold text-white shadow-lg transform active:scale-[0.98] transition duration-200">
                    CONFIRMAR E REGISTRAR
                </button>
            </form>
        </div>

        <footer class="w-full text-center mt-12 p-6 text-gray-500 text-xs border-t border-gray-800">
            <p class="mb-2 text-sm font-semibold text-gray-400">DESENVOLVEDOR: MARCELO ANDRÉ NOGUEIRA CARDES</p>
            <p class="tracking-widest uppercase">E.E. PEI PROFESSORA IRENE DIAS RIBEIRO</p>
        </footer>
    </div>

    <script>
        // Variáveis globais de controle
        let listaAlunosCache = [];
        let tutorNomeAtual = "";

        document.addEventListener('DOMContentLoaded', () => {
            carregarProfessores();
        });

        function msg(texto, tipo) {
            const el = document.getElementById('mensagem-status');
            el.textContent = texto;
            el.className = `mb-4 p-3 rounded text-sm font-bold text-center ${tipo === 'success' ? 'bg-emerald-600 text-white' : 'bg-red-600 text-white'}`;
            el.classList.remove('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        async function carregarProfessores() {
            try {
                const res = await fetch('/api/professores');
                const data = await res.json();
                const select = document.getElementById('professor');
                select.innerHTML = '<option value="">Selecione o professor responsável</option>';
                data.forEach(p => {
                    const opt = document.createElement('option');
                    opt.value = p.id;
                    opt.textContent = p.nome;
                    select.appendChild(opt);
                });
            } catch (e) {
                msg('Falha ao carregar professores.', 'error');
            }
        }

        async function carregarSalas() {
            const profId = document.getElementById('professor').value;
            const salaSelect = document.getElementById('sala');
            
            if (!profId) {
                salaSelect.disabled = true;
                return;
            }

            try {
                // Ajustado para sua rota do app.py
                const res = await fetch(`/api/salas_por_professor/${profId}`);
                const data = await res.json();
                salaSelect.innerHTML = '<option value="">Selecione a sala</option>';
                data.forEach(s => {
                    const opt = document.createElement('option');
                    opt.value = s.id;
                    opt.textContent = s.nome;
                    salaSelect.appendChild(opt);
                });
                salaSelect.disabled = false;
            } catch (e) {
                msg('Erro ao carregar salas.', 'error');
            }
        }

        async function carregarAlunos() {
            const salaId = document.getElementById('sala').value;
            const alunoSelect = document.getElementById('aluno');
            
            if (!salaId) {
                alunoSelect.disabled = true;
                return;
            }

            try {
                const res = await fetch(`/api/alunos_por_sala/${salaId}`);
                listaAlunosCache = await res.json();
                alunoSelect.innerHTML = '<option value="">Selecione o aluno</option>';
                listaAlunosCache.forEach(a => {
                    const opt = document.createElement('option');
                    opt.value = a.id;
                    opt.textContent = a.nome;
                    alunoSelect.appendChild(opt);
                });
                alunoSelect.disabled = false;
            } catch (e) {
                msg('Erro ao carregar alunos.', 'error');
            }
        }

        function atualizarDadosTutor() {
            const id = document.getElementById('aluno').value;
            const info = document.getElementById('tutor-info');
            
            const aluno = listaAlunosCache.find(a => String(a.id) === String(id));
            
            if (aluno && aluno.tutor_nome) {
                tutorNomeAtual = aluno.tutor_nome;
                info.textContent = `Tutor: ${aluno.tutor_nome}`;
                info.className = "p-3 bg-emerald-900/30 rounded border border-emerald-700 text-emerald-300 font-medium";
            } else {
                tutorNomeAtual = "";
                info.textContent = "Nenhum tutor vinculado a este aluno.";
                info.className = "p-3 bg-yellow-900/20 rounded border border-yellow-800 text-yellow-400";
            }
        }

        async function registrarOcorrencia() {
            const form = document.getElementById('form-ocorrencia');
            const btn = document.getElementById('btn-registrar');
            
            if (!form.checkValidity()) {
                msg('Preencha todos os campos obrigatórios (*)', 'error');
                return;
            }

            // Captura de nomes (Strings) para o Banco de Dados
            const profSel = document.getElementById('professor');
            const salaSel = document.getElementById('sala');
            const alunoSel = document.getElementById('aluno');
            const destino = document.querySelector('input[name="destino"]:checked').value;

            const payload = {
                aluno_id: alunoSel.value,
                professor_id: profSel.value,
                professor_nome: profSel.options[profSel.selectedIndex].text,
                tutor_nome: tutorNomeAtual,
                descricao: document.getElementById('descricao').value,
                atendimento_professor: document.getElementById('atendimento_professor').value,
                // Mapeamento para os booleanos solicitados no seu app.py
                solicitar_tutor: (destino === 'tutor'),
                solicitar_coordenacao: (destino === 'coordenacao'),
                solicitar_gestao: (destino === 'gestao')
            };

            btn.disabled = true;
            btn.textContent = 'PROCESSANDO...';

            try {
                const res = await fetch('/api/registrar_ocorrencia', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const result = await res.json();

                if (res.ok && result.success) {
                    msg(`Sucesso! Ocorrência #${result.numero} gravada.`, 'success');
                    setTimeout(() => window.location.href = '/gestao_ocorrencia', 1500);
                } else {
                    throw new Error(result.error || 'Erro interno');
                }
            } catch (e) {
                msg(`Erro: ${e.message}`, 'error');
                btn.disabled = false;
                btn.textContent = 'CONFIRMAR E REGISTRAR';
            }
        }
    </script>
</body>
</html>
