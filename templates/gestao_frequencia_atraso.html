<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Chegada Atrasada</title><script src="https://cdn.tailwindcss.com"></script></head><body class="bg-slate-900 text-slate-100 min-h-screen p-4"><div class="max-w-4xl mx-auto space-y-4"><header class="flex justify-between"><h1 class="text-2xl font-bold text-amber-400">Chegada Atrasada</h1><a href="/dashboard_frequencia" class="bg-slate-700 px-4 py-2 rounded">Voltar</a></header><div class="bg-slate-800 p-4 rounded-xl grid md:grid-cols-2 gap-3"><select id="sala_id" class="bg-slate-900 border border-slate-700 rounded px-3 py-2"><option value="">Selecione a sala</option></select><select id="aluno_id" class="bg-slate-900 border border-slate-700 rounded px-3 py-2"><option value="">Selecione o aluno</option></select><input id="data_ref" type="date" class="bg-slate-900 border border-slate-700 rounded px-3 py-2"><input id="hora_entrada" type="time" class="bg-slate-900 border border-slate-700 rounded px-3 py-2"><input id="motivo_atraso" type="text" class="md:col-span-2 bg-slate-900 border border-slate-700 rounded px-3 py-2" placeholder="Motivo do atraso"><button onclick="salvar()" class="md:col-span-2 bg-amber-600 px-4 py-2 rounded">Registrar atraso</button></div></div><script>
let salas=[], alunos=[]; function hojeISO(){return new Date().toISOString().slice(0,10)}; function horaAgora(){const d=new Date(); return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');}
async function init(){document.getElementById('data_ref').value=hojeISO(); document.getElementById('hora_entrada').value=horaAgora(); salas=await (await fetch('/api/salas')).json(); document.getElementById('sala_id').innerHTML='<option value="">Selecione a sala</option>'+salas.map(s=>`<option value="${s.id}">${s.nome||s.sala||''}</option>`).join('');}
document.addEventListener('change', async e=>{ if(e.target.id==='sala_id'){const sala=e.target.value; alunos=await (await fetch('/api/alunos_por_sala/'+sala)).json(); document.getElementById('aluno_id').innerHTML='<option value="">Selecione o aluno</option>'+alunos.map(a=>`<option value="${a.id}">${a.nome||a.aluno_nome||''}</option>`).join(''); }});
async function salvar(){const salaId=document.getElementById('sala_id').value, alunoId=document.getElementById('aluno_id').value; const aluno=alunos.find(a=>String(a.id)===String(alunoId))||{}; const sala=salas.find(s=>String(s.id)===String(salaId))||{}; const payload={aluno_id:alunoId,aluno_nome:aluno.nome||aluno.aluno_nome||'',sala_id:salaId,sala_nome:sala.nome||sala.sala||'',data:document.getElementById('data_ref').value,status:'PA',hora_entrada:document.getElementById('hora_entrada').value,motivo_atraso:document.getElementById('motivo_atraso').value}; const r=await fetch('/api/frequencia/salvar',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify([payload])}); const j=await r.json(); if(!r.ok||!j.success) return alert(j.error||'Erro'); alert('Atraso registrado');}
init();
</script>
<footer class="mt-8 border-t border-slate-700 pt-4 text-center text-sm text-slate-400">
  <p><strong>Desenvolvido e Registrado por Marcelo André Nogueira Cardes</strong></p>
  <p>Licença Cortesia E. E. Professora Irene Dias Ribeiro</p>
</footer>
</body></html>
