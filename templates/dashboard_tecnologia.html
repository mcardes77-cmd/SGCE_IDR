<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Tecnologia</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen">
  <header class="bg-slate-800 border-b border-slate-700 px-6 py-4">
    <h1 class="text-2xl font-bold text-emerald-400">SISTEMA DE GESTÃO DE CONVIVÊNCIA ESCOLAR</h1>
    <p class="text-slate-300 mt-1">Dashboard Tecnologia</p><div class="mt-3 flex gap-2 flex-wrap"><a href="/dashboard_geral" class="bg-slate-700 hover:bg-slate-600 px-4 py-2 rounded-lg text-sm">Dashboard Geral</a><a href="/logout" class="bg-slate-700 hover:bg-slate-600 px-4 py-2 rounded-lg text-sm">Sair</a></div>
  </header>

  <main class="max-w-5xl mx-auto px-6 py-8">
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
      <a href="/tecnologia/retirada" class="bg-slate-800 hover:bg-slate-700 border border-slate-700 rounded-2xl p-8 shadow-lg transition">
        <h2 class="text-2xl font-bold text-emerald-400">RETIRADA</h2>
        <p class="mt-3 text-slate-300">Registrar retirada de equipamentos pela turma.</p>
      </a>

      <a href="/tecnologia/devolucao" class="bg-slate-800 hover:bg-slate-700 border border-slate-700 rounded-2xl p-8 shadow-lg transition">
        <h2 class="text-2xl font-bold text-amber-400">DEVOLUÇÃO</h2>
        <p class="mt-3 text-slate-300">Registrar devolução dos equipamentos em posse da turma.</p>
      </a>
    </div>
  </main>
</body>
</html>
