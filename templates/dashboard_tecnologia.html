<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Tecnologia</title>
  <script src="https://cdn.tailwindcss.com"></script>

<style id="sgce-responsive-patch">
  html { font-size: clamp(13px, 0.80rem + 0.25vw, 16px); }
  body { overflow-x: hidden; }
  img, svg, canvas, video { max-width: 100%; height: auto; }
  input, select, textarea, button { max-width: 100%; }
  @media (max-width: 1280px) {
    .max-w-7xl, .max-w-6xl, .max-w-5xl, .max-w-4xl { max-width: 100% !important; }
  }
  @media (max-width: 1024px) {
    .text-3xl { font-size: 1.6rem !important; line-height: 2rem !important; }
    .text-2xl { font-size: 1.35rem !important; line-height: 1.8rem !important; }
    .text-xl { font-size: 1.15rem !important; line-height: 1.55rem !important; }
    .p-6, .p-5 { padding: 1rem !important; }
    .px-6 { padding-left: 1rem !important; padding-right: 1rem !important; }
    .py-8 { padding-top: 1rem !important; padding-bottom: 1rem !important; }
  }
  @media (max-width: 768px) {
    table { display: block; width: 100%; overflow-x: auto; white-space: nowrap; }
    [class*="grid-cols-2"], [class*="grid-cols-3"], [class*="grid-cols-4"], [class*="grid-cols-5"], [class*="grid-cols-6"] {
      grid-template-columns: minmax(0, 1fr) !important;
    }
    .min-w-72 { min-width: 100% !important; }
    .text-sm { font-size: 0.82rem !important; }
    .text-base { font-size: 0.92rem !important; }
    .text-lg { font-size: 1rem !important; }
    .rounded-2xl { border-radius: 1rem !important; }
    [class*="max-w-"] { max-width: 100% !important; }
  }
  @media (max-width: 640px) {
    body[class*="p-6"] { padding: 1rem !important; }
    .px-4 { padding-left: 0.75rem !important; padding-right: 0.75rem !important; }
    .py-3, .py-2 { padding-top: 0.65rem !important; padding-bottom: 0.65rem !important; }
    .gap-4 { gap: 0.75rem !important; }
    .gap-3 { gap: 0.65rem !important; }
  }


/* compact dashboards */
.dashboard-card { min-height: 92px; padding: 0.9rem !important; }
.dashboard-card .card-title { font-size: 0.75rem !important; line-height: 1rem !important; }
.dashboard-card .card-subtitle { font-size: 0.68rem !important; line-height: 0.95rem !important; }
.dashboard-card .card-value { font-size: 1.35rem !important; line-height: 1.6rem !important; margin-top: 0.4rem !important; }
.dashboard-nav-card { min-height: 88px; padding: 0.85rem !important; }
.dashboard-nav-card .nav-title { font-size: 0.95rem !important; line-height: 1.1rem !important; }
.dashboard-nav-card .nav-subtitle { font-size: 0.72rem !important; line-height: 0.95rem !important; margin-top: 0.35rem !important; }
@media (min-width: 1280px) {
  .dashboard-main-grid { grid-template-columns: repeat(8, minmax(0, 1fr)) !important; }
  .dashboard-shortcuts-grid { grid-template-columns: repeat(7, minmax(0, 1fr)) !important; }
}
@media (max-width: 1279px) {
  .dashboard-card { min-height: 84px; }
  .dashboard-nav-card { min-height: 82px; }
}

</style>

</head>
<body class="bg-slate-900 text-slate-100 min-h-screen">
  <header class="bg-slate-800 border-b border-slate-700 px-6 py-4">
    <h1 class="nav-title text-2xl font-bold text-emerald-400">SISTEMA DE GESTÃO DE CONVIVÊNCIA ESCOLAR</h1>
    <p class="text-slate-300 mt-1">Dashboard Tecnologia</p><div class="mt-3 flex gap-2 flex-wrap"><a href="/dashboard_geral" class="bg-slate-700 hover:bg-slate-600 px-4 py-2 rounded-lg text-sm">Dashboard Geral</a><a href="/logout" class="bg-slate-700 hover:bg-slate-600 px-4 py-2 rounded-lg text-sm">Sair</a></div>
  </header>

  <main class="max-w-4xl mx-auto px-4 md:px-6 py-6">
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <a href="/tecnologia/retirada" class="dashboard-nav-card bg-slate-800 hover:bg-slate-700 border border-slate-700 rounded-2xl p-6 shadow-lg transition">
        <h2 class="nav-title text-2xl font-bold text-emerald-400">RETIRADA</h2>
        <p class="nav-subtitle mt-3 text-slate-300">Registrar retirada de equipamentos pela turma.</p>
      </a>

      <a href="/tecnologia/devolucao" class="dashboard-nav-card bg-slate-800 hover:bg-slate-700 border border-slate-700 rounded-2xl p-6 shadow-lg transition">
        <h2 class="nav-title text-2xl font-bold text-amber-400">DEVOLUÇÃO</h2>
        <p class="nav-subtitle mt-3 text-slate-300">Registrar devolução dos equipamentos em posse da turma.</p>
      </a>
    </div>
  </main>
</body>
</html>
