<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Relatório de Frequência</title><script src="https://cdn.tailwindcss.com"></script></head>
<body class="bg-slate-900 text-white p-6"><div class="max-w-7xl mx-auto"><header class="mb-8 flex justify-between items-center"><h1 class="text-3xl font-bold text-emerald-400">Relatório de Frequência</h1><button onclick="window.location.href='/gestao_frequencia_avancada'" class="bg-slate-700 hover:bg-slate-600 px-4 py-2 rounded-lg">Voltar</button></header><section class="bg-slate-800 rounded-2xl shadow p-6 mb-6"><div class="grid grid-cols-1 md:grid-cols-3 gap-4"><div><label class="block text-sm text-slate-300 mb-1">Sala</label><select id="sala" class="w-full rounded-lg bg-slate-700 border border-slate-600 p-3"></select></div><div><label class="block text-sm text-slate-300 mb-1">Mês</label><input id="mes" type="month" class="w-full rounded-lg bg-slate-700 border border-slate-600 p-3"></div><div class="flex items-end"><button onclick="carregar()" class="w-full bg-blue-600 hover:bg-blue-700 px-4 py-3 rounded-lg font-semibold">Carregar relatório</button></div></div></section><section class="bg-slate-800 rounded-2xl shadow p-6"><div id="resultado" class="space-y-4 text-slate-300">Selecione sala e mês para visualizar.</div></section></div><script>
document.addEventListener('DOMContentLoaded', async ()=>{const r=await fetch('/api/salas');const salas=await r.json();document.getElementById('sala').innerHTML='<option value="">Selecione a sala</option>'+(salas||[]).map(s=>`<option value="${s.id}">${s.nome||''}</option>`).join('');document.getElementById('mes').value=new Date().toISOString().slice(0,7);});
async function carregar(){const sala=document.getElementById('sala').value;const r=await fetch(`/api/frequencia/relatorio?sala_id=${sala}`);const data=await r.json();const mes=document.getElementById('mes').value;const fil=(data||[]).filter(x=>(x.data||'').startsWith(mes));const total=fil.length;const p=fil.filter(x=>x.status==='P').length;const f=fil.filter(x=>x.status==='F').length;const pa=fil.filter(x=>x.status==='PA').length;const ps=fil.filter(x=>x.status==='PS').length;const psa=fil.filter(x=>x.status==='PSA').length;document.getElementById('resultado').innerHTML=`<div class="grid grid-cols-1 md:grid-cols-5 gap-4"><div class="bg-slate-900 rounded-xl p-4">P: <b>${p}</b></div><div class="bg-slate-900 rounded-xl p-4">F: <b>${f}</b></div><div class="bg-slate-900 rounded-xl p-4">PA: <b>${pa}</b></div><div class="bg-slate-900 rounded-xl p-4">PS: <b>${ps}</b></div><div class="bg-slate-900 rounded-xl p-4">PSA: <b>${psa}</b></div></div><div>Total de registros no mês: <b>${total}</b></div>`;}
</script></body></html>
