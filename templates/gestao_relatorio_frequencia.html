<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Relatório de Frequência</title>
  <script src="https://cdn.tailwindcss.com"></script>

<style id="sgce-responsive-patch">
  html { font-size: clamp(13px, 0.80rem + 0.25vw, 16px); }
  body { overflow-x: hidden; }
  img, svg, canvas, video { max-width: 100%; height: auto; }
  input, select, textarea, button { max-width: 100%; }
  @media (max-width: 1280px) {
    .max-w-7xl, .max-w-6xl, .max-w-5xl, .max-w-4xl { max-width: 100% !important; }
  }
  @media (max-width: 1024px) {
    .text-3xl { font-size: 1.6rem !important; line-height: 2rem !important; }
    .text-2xl { font-size: 1.35rem !important; line-height: 1.8rem !important; }
    .text-xl { font-size: 1.15rem !important; line-height: 1.55rem !important; }
    .p-6, .p-5 { padding: 1rem !important; }
    .px-6 { padding-left: 1rem !important; padding-right: 1rem !important; }
    .py-8 { padding-top: 1rem !important; padding-bottom: 1rem !important; }
  }
  @media (max-width: 768px) {
    table { display: block; width: 100%; overflow-x: auto; white-space: nowrap; }
    [class*="grid-cols-2"], [class*="grid-cols-3"], [class*="grid-cols-4"], [class*="grid-cols-5"], [class*="grid-cols-6"] {
      grid-template-columns: minmax(0, 1fr) !important;
    }
    .min-w-72 { min-width: 100% !important; }
    .text-sm { font-size: 0.82rem !important; }
    .text-base { font-size: 0.92rem !important; }
    .text-lg { font-size: 1rem !important; }
    .rounded-2xl { border-radius: 1rem !important; }
    [class*="max-w-"] { max-width: 100% !important; }
  }
  @media (max-width: 640px) {
    body[class*="p-6"] { padding: 1rem !important; }
    .px-4 { padding-left: 0.75rem !important; padding-right: 0.75rem !important; }
    .py-3, .py-2 { padding-top: 0.65rem !important; padding-bottom: 0.65rem !important; }
    .gap-4 { gap: 0.75rem !important; }
    .gap-3 { gap: 0.65rem !important; }
  }
</style>

</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-4 md:p-6">
<div class="max-w-7xl mx-auto space-y-5">
  <header class="flex justify-between items-end">
    <div>
      <h1 class="text-3xl font-bold text-emerald-400">RELATÓRIO DE FREQUÊNCIA</h1>
      <p class="text-slate-400">Selecione a sala e o mês para gerar a tabela e o PDF</p>
    </div>
    <a href="/dashboard_frequencia" class="bg-slate-700 hover:bg-slate-600 px-4 py-2 rounded-lg font-semibold">Dashboard Frequência</a>
  </header>

  <section class="bg-slate-800 rounded-2xl p-4 border border-slate-700 grid md:grid-cols-4 gap-3">
    <select id="sala_id" class="bg-slate-900 border border-slate-700 rounded px-3 py-2">
      <option value="">Selecione a sala</option>
    </select>
    <input id="mesRef" type="month" class="bg-slate-900 border border-slate-700 rounded px-3 py-2">
    <button onclick="carregarRelatorio()" class="bg-emerald-600 hover:bg-emerald-500 px-4 py-2 rounded">Gerar tabela</button>
    <button onclick="gerarPdf()" class="bg-violet-700 hover:bg-violet-600 px-4 py-2 rounded">Gerar PDF</button>
  </section>

  <section class="bg-slate-800 rounded-2xl p-4 border border-slate-700">
    <div class="overflow-auto">
      <table class="w-full text-sm whitespace-nowrap">
        <thead id="theadRelatorio"></thead>
        <tbody id="tbodyRelatorio"></tbody>
      </table>
    </div>
  </section>
</div>

<script>
let relatorioAtual = null;

function mesAtual(){
  const d = new Date();
  const m = String(d.getMonth()+1).padStart(2,'0');
  return `${d.getFullYear()}-${m}`;
}

async function carregarSalas(){
  const salas = await (await fetch('/api/salas')).json();
  document.getElementById('sala_id').innerHTML =
    '<option value="">Selecione a sala</option>' +
    (Array.isArray(salas) ? salas.map(s => `<option value="${s.id}">${s.nome || s.sala || ''}</option>`).join('') : '');
}

async function carregarRelatorio(){
  const salaId = document.getElementById('sala_id').value;
  const mes = document.getElementById('mesRef').value || mesAtual();
  if(!salaId) return alert('Selecione a sala');

  const r = await fetch(`/api/relatorio_frequencia?sala_id=${salaId}&mes=${mes}`);
  const j = await r.json();
  if(!r.ok || !j.success) return alert(j.error || 'Erro ao gerar relatório');

  relatorioAtual = j.data;

  const dias = j.data.dias || [];
  document.getElementById('theadRelatorio').innerHTML = `
    <tr class="border-b border-slate-700">
      <th class="text-left py-2 pr-4">Aluno</th>
      ${dias.map(d => `<th class="text-left py-2 px-2">${d}</th>`).join('')}
    </tr>
  `;

  document.getElementById('tbodyRelatorio').innerHTML = (j.data.alunos || []).map(al => `
    <tr class="border-b border-slate-800">
      <td class="py-2 pr-4 font-medium">${al.nome}</td>
      ${(al.registros || []).map(v => `<td class="py-2 px-2">${v || ''}</td>`).join('')}
    </tr>
  `).join('');
}

async function gerarPdf(){
  const salaId = document.getElementById('sala_id').value;
  const mes = document.getElementById('mesRef').value || mesAtual();
  if(!salaId) return alert('Selecione a sala');

  const r = await fetch('/api/relatorio_frequencia_pdf', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({sala_id: salaId, mes})
  });
  const j = await r.json();
  if(!r.ok || !j.success) return alert(j.error || 'Erro ao gerar PDF');
  window.open(j.pdf_url, '_blank');
}

document.getElementById('mesRef').value = mesAtual();
carregarSalas();
</script>

<footer class="mt-8 border-t border-slate-700 pt-4 text-center text-sm text-slate-400">
  <p><strong>Desenvolvido e Registrado por Marcelo André Nogueira Cardes</strong></p>
  <p>Licença Cortesia E. E. Professora Irene Dias Ribeiro</p>
</footer>
</body>
</html>
