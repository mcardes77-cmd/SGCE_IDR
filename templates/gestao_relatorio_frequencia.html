<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gestão de Frequência - Relatório Mensal</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/dayjs@1/dayjs.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'dark-primary': '#0F172A',
            'dark-secondary': '#1E293B',
            'accent': '#10B981',
            'text-light': '#F8FAFC',
            'danger': '#DC2626',
            'warning': '#FACC15'
          },
          fontFamily: { sans: ['Inter', 'sans-serif'] },
        },
      },
    };

    // Variável global para armazenar os dados carregados
    let dadosFrequenciaGlobal = [];

    document.addEventListener("DOMContentLoaded", () => {
      carregarSalas();
      carregarMeses();
      document.getElementById("btnVisualizar").addEventListener("click", visualizar);
      document.getElementById("btnGerarPDF").addEventListener("click", gerarPDF);
    });

    async function carregarSalas() {
      try {
        const resp = await fetch("/api/d_salas");
        const data = await resp.json();
        const salas = data.data || data;
        const select = document.getElementById("salaSelect");
        select.innerHTML = '<option value="" class="text-black">Selecione a Sala</option>';
        salas.forEach(s => {
          select.innerHTML += `<option value="${s.id}" class="text-black">${s.nome}</option>`;
        });
      } catch (err) {
        console.error("Erro ao carregar salas:", err);
      }
    }

    function carregarMeses() {
      const meses = ["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];
      const sel = document.getElementById("mesSelect");
      sel.innerHTML = '<option value="" class="text-black">Selecione o Mês</option>';
      meses.forEach((m,i) => {
        sel.innerHTML += `<option value="${i+1}" class="text-black">${m}</option>`;
      });
    }

    async function visualizar() {
      const sala = document.getElementById("salaSelect").value;
      const mes = document.getElementById("mesSelect").value;
      const container = document.getElementById("tabelaContainer");

      if (!sala || !mes) {
        alert("Selecione a sala e o mês.");
        return;
      }

      container.innerHTML = '<p class="text-accent animate-pulse">A carregar dados...</p>';

      try {
        const resp = await fetch(`/api/frequencia?sala=${sala}&mes=${mes}`);
        const data = await resp.json();
        dadosFrequenciaGlobal = data.data || data;

        if (!dadosFrequenciaGlobal || dadosFrequenciaGlobal.length === 0) {
          container.innerHTML = '<p class="text-gray-400 py-8">Nenhum registo encontrado para este período.</p>';
          return;
        }

        montarTabela(dadosFrequenciaGlobal, parseInt(mes));
      } catch (e) {
        container.innerHTML = '<p class="text-danger">Erro ao carregar relatório.</p>';
      }
    }

    function montarTabela(dados, mes) {
      const container = document.getElementById("tabelaContainer");
      const ano = dayjs().year();
      const dias = [];
      const totalDias = new Date(ano, mes, 0).getDate();

      for (let d = 1; d <= totalDias; d++) {
        const data = dayjs(`${ano}-${String(mes).padStart(2,'0')}-${String(d).padStart(2,'0')}`);
        if (data.day() !== 0 && data.day() !== 6) dias.push(data);
      }

      let html = `<div class="overflow-x-auto"><table class="min-w-full border border-gray-700 text-sm text-center">
            <thead class="bg-dark-primary text-gray-300"><tr>
            <th class="px-2 py-2 border border-gray-700 text-left bg-dark-secondary sticky left-0 z-10">Aluno</th>`;
      dias.forEach(d => { html += `<th class="px-2 py-2 border border-gray-700">${d.format("DD")}</th>`; });
      html += `</tr></thead><tbody class="divide-y divide-gray-700">`;

      dados.forEach(aluno => {
        html += `<tr><td class="border border-gray-700 text-left px-2 py-2 bg-gray-800 text-white sticky left-0 z-10">${aluno.nome}</td>`;
        dias.forEach(d => {
          const dataKey = d.format("YYYY-MM-DD");
          const freq = aluno.frequencia?.[dataKey] || {};
          const status = freq.status || "-";
          let cor = "text-gray-500";
          let clickHandler = "";
          
          if (status === "P") cor = "text-green-500 font-bold";
          else if (status === "F") cor = "text-red-500 font-bold";
          else if (["PA", "PS", "PSA"].includes(status)) {
            cor = "text-yellow-400 font-bold cursor-pointer bg-yellow-900/30";
            clickHandler = `onclick="mostrarDetalhesFrequencia(${aluno.id}, '${dataKey}')"`;
          }
          html += `<td class="border border-gray-700 ${cor}" ${clickHandler}>${status}</td>`;
        });
        html += `</tr>`;
      });
      html += `</tbody></table></div>`;
      container.innerHTML = html;
    }

    async function mostrarDetalhesFrequencia(alunoId, data) {
      try {
        const resp = await fetch(`/api/frequencia_detalhes/${alunoId}/${data}`);
        const detalhes = await resp.json();
        const aluno = dadosFrequenciaGlobal.find(a => a.id == alunoId);
        
        const modal = document.createElement('div');
        modal.className = 'fixed inset-0 bg-black/80 flex items-center justify-center z-50 p-4';
        modal.innerHTML = `
          <div class="bg-dark-secondary p-6 rounded-xl border border-gray-700 max-w-sm w-full shadow-2xl">
            <h3 class="text-lg font-bold text-accent mb-2">${aluno ? aluno.nome : 'Detalhes'}</h3>
            <p class="text-sm text-gray-400 mb-4 border-b border-gray-700 pb-2">${dayjs(data).format('DD/MM/YYYY')}</p>
            <div class="space-y-2 text-sm">
              ${detalhes.hora_entrada ? `<p class="text-yellow-400"><strong>Entrada:</strong> ${detalhes.hora_entrada} <span class="text-gray-300">(${detalhes.motivo_atraso || ''})</span></p>` : ''}
              ${detalhes.hora_saida ? `<p class="text-orange-400"><strong>Saída:</strong> ${detalhes.hora_saida} <span class="text-gray-300">(${detalhes.motivo_saida || ''})</span></p>` : ''}
              ${detalhes.responsavel_nome ? `<div class="mt-4 pt-2 border-t border-gray-700"><p><strong>Resp:</strong> ${detalhes.responsavel_nome}</p><p><strong>Tel:</strong> ${detalhes.responsavel_telefone || 'N/A'}</p></div>` : ''}
            </div>
            <button onclick="this.closest('.fixed').remove()" class="w-full mt-6 bg-accent text-dark-primary font-bold py-2 rounded-lg">FECHAR</button>
          </div>`;
        document.body.appendChild(modal);
      } catch (e) { console.error(e); }
    }

    async function gerarPDF() {
      const btn = document.getElementById("btnGerarPDF");
      const container = document.getElementById("tabelaContainer");
      
      if (!container.querySelector('table')) {
        alert("Gere a visualização da tabela primeiro!");
        return;
      }

      btn.disabled = true;
      btn.innerHTML = "A Processar...";

      try {
        const { jsPDF } = window.jspdf;
        const canvas = await html2canvas(container, {
          scale: 2,
          useCORS: true,
          backgroundColor: "#1E293B"
        });

        const imgData = canvas.toDataURL('image/png');
        const pdf = new jsPDF('l', 'mm', 'a4');
        const pdfWidth = pdf.internal.pageSize.getWidth() - 20;
        const pdfHeight = (canvas.height * pdfWidth) / canvas.width;

        pdf.setFontSize(14);
        pdf.setTextColor(16, 185, 129);
        pdf.text("RELATÓRIO DE FREQUÊNCIA - SGCE", 10, 15);
        pdf.addImage(imgData, 'PNG', 10, 25, pdfWidth, pdfHeight);
        pdf.save(`frequencia_${dayjs().format('MM_YYYY')}.pdf`);
      } catch (err) {
        alert("Erro ao gerar PDF.");
      } finally {
        btn.disabled = false;
        btn.innerHTML = "Gerar PDF";
      }
    }
  </script>

  <style>
    /* Correção global para campos de texto e selects */
    select, option {
      color: white !important;
      background-color: #1F2937 !important;
    }
    /* Estilo para navegadores que não respeitam o CSS padrão em selects */
    #salaSelect option, #mesSelect option {
      color: #000; /* Garante que as opções sejam legíveis no dropdown */
    }
    @media print {
        .no-print { display: none; }
    }
  </style>
</head>

<body class="bg-dark-primary min-h-screen text-text-light p-4 md:p-8">
  <div class="max-w-7xl mx-auto">
    <header class="text-center mb-8 no-print">
      <h1 class="text-2xl font-bold text-accent tracking-tighter">SISTEMA SGCE</h1>
      <p class="text-gray-400 text-sm">GESTÃO DE FREQUÊNCIA - RELATÓRIO MENSAL</p>
      
      <button onclick="window.location.href='/gestao_frequencia'" 
              class="mt-4 px-4 py-2 text-xs rounded border border-gray-700 hover:bg-gray-800 transition">
        VOLTAR AO MENU
      </button>
    </header>

    <main class="bg-dark-secondary rounded-xl p-6 shadow-2xl border border-gray-800">
      <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-8 no-print">
        <div>
          <label class="block text-xs font-bold text-gray-500 mb-1 uppercase">Sala</label>
          <select id="salaSelect" class="w-full p-3 bg-gray-800 rounded-lg border border-gray-700 outline-none focus:border-accent text-white"></select>
        </div>
        <div>
          <label class="block text-xs font-bold text-gray-500 mb-1 uppercase">Mês</label>
          <select id="mesSelect" class="w-full p-3 bg-gray-800 rounded-lg border border-gray-700 outline-none focus:border-accent text-white"></select>
        </div>
        <div class="flex items-end">
          <button id="btnVisualizar" class="w-full bg-accent hover:bg-emerald-600 text-dark-primary font-bold py-3 rounded-lg transition-all">
            VISUALIZAR FREQUÊNCIA
          </button>
        </div>
      </div>

      <div class="flex justify-between items-center mb-4 no-print">
          <h3 class="text-xs font-bold text-gray-500 uppercase">Mapa de Presenças</h3>
          <button id="btnGerarPDF" class="flex items-center gap-2 bg-gray-700 hover:bg-gray-600 px-4 py-2 rounded-lg text-xs font-bold">
            GERAR PDF
          </button>
      </div>

      <div id="tabelaContainer" class="bg-dark-primary/30 rounded-lg border border-gray-800 p-4 min-h-[300px] flex items-center justify-center">
        <span class="text-gray-600 italic">Selecione os filtros acima para gerar o mapa.</span>
      </div>
    </main>

    <footer class="mt-8 text-center text-gray-600 text-[10px] uppercase tracking-widest no-print">
      <p>Desenvolvedor: Marcelo André Nogueira Cardes</p>
      <p>Escola: E.E. PEI Professora Irene Dias Ribeiro</p>
    </footer>
  </div>
</body>
</html>
