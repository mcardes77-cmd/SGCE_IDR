<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SGCE - Relatório de Frequência</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/dayjs@1/dayjs.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'dark-primary': '#0F172A',
            'dark-secondary': '#1E293B',
            'accent': '#10B981',
            'text-light': '#F8FAFC'
          }
        }
      }
    };

    let dadosGlobal = [];

    async function carregarFiltrosIniciais() {
      try {
        const resp = await fetch("/api/d_salas");
        const salas = await resp.json();
        const select = document.getElementById("salaSelect");
        select.innerHTML = '<option value="" class="text-black">Selecione a Sala</option>';
        (salas.data || salas).forEach(s => {
          select.innerHTML += `<option value="${s.id}" class="text-black">${s.nome}</option>`;
        });

        const mesSelect = document.getElementById("mesSelect");
        const meses = ["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];
        mesSelect.innerHTML = '<option value="" class="text-black">Selecione o Mês</option>';
        meses.forEach((m, i) => {
          mesSelect.innerHTML += `<option value="${i+1}" class="text-black">${m}</option>`;
        });
      } catch (e) { console.error("Erro ao carregar salas:", e); }
    }

    async function visualizarFrequencia() {
      const sala = document.getElementById("salaSelect").value;
      const mes = document.getElementById("mesSelect").value;
      const container = document.getElementById("tabelaContainer");
      const btnPDF = document.getElementById("btnGerarPDF");

      if (!sala || !mes) return alert("Selecione Sala e Mês");

      container.innerHTML = "<p class='text-accent'>A carregar dados...</p>";
      btnPDF.classList.add("hidden"); // Esconde o PDF enquanto carrega

      try {
        const resp = await fetch(`/api/frequencia?sala=${sala}&mes=${mes}`);
        const data = await resp.json();
        dadosGlobal = data.data || data;

        if (!dadosGlobal || dadosGlobal.length === 0) {
          container.innerHTML = "Nenhum dado encontrado para esta seleção.";
          return;
        }

        renderizarTabela(dadosGlobal, mes);
        btnPDF.classList.remove("hidden"); // Só mostra o botão de PDF se houver dados
      } catch (e) {
        container.innerHTML = "Erro ao conectar com o servidor.";
      }
    }

    function renderizarTabela(dados, mes) {
      const container = document.getElementById("tabelaContainer");
      const ano = dayjs().year();
      const diasUteis = [];
      const ultimoDia = new Date(ano, mes, 0).getDate();

      for (let d = 1; d <= ultimoDia; d++) {
        const data = dayjs(`${ano}-${String(mes).padStart(2,'0')}-${String(d).padStart(2,'0')}`);
        if (data.day() !== 0 && data.day() !== 6) diasUteis.push(data);
      }

      let html = `<div class='overflow-x-auto'><table id='tabelaDados' class='min-w-full border border-gray-700 text-xs text-center'>
        <thead class='bg-gray-800 text-accent'><tr>
        <th class='p-2 border border-gray-700 text-left bg-dark-secondary sticky left-0'>Aluno</th>`;
      diasUteis.forEach(d => { html += `<th class='p-1 border border-gray-700'>${d.format("DD")}</th>`; });
      html += `</tr></thead><tbody class='bg-dark-primary'>`;

      dados.forEach(aluno => {
        html += `<tr><td class='p-2 border border-gray-700 text-left bg-gray-900 text-white sticky left-0'>${aluno.nome}</td>`;
        diasUteis.forEach(d => {
          const status = aluno.frequencia?.[d.format("YYYY-MM-DD")]?.status || "-";
          const cor = status === "P" ? "text-green-400" : status === "F" ? "text-red-400" : "text-yellow-400";
          html += `<td class='border border-gray-700 ${cor} font-bold'>${status}</td>`;
        });
        html += `</tr>`;
      });
      html += `</tbody></table></div>`;
      container.innerHTML = html;
    }

    async function gerarPDF() {
      const btn = document.getElementById("btnGerarPDF");
      const container = document.getElementById("tabelaContainer");
      
      btn.innerHTML = "A PROCESSAR...";
      btn.disabled = true;

      // Espera 500ms para garantir que o DOM está estável
      await new Promise(r => setTimeout(r, 500));

      try {
        const canvas = await html2canvas(container, {
          scale: 2,
          useCORS: true,
          backgroundColor: "#1E293B"
        });

        const imgData = canvas.toDataURL('image/png');
        const pdf = new jspdf.jsPDF('l', 'mm', 'a4');
        
        pdf.setFontSize(14);
        pdf.setTextColor(16, 185, 129);
        pdf.text("SGCE - RELATÓRIO DE FREQUÊNCIA MENSAL", 10, 15);
        
        const imgWidth = 277; 
        const imgHeight = (canvas.height * imgWidth) / canvas.width;
        
        pdf.addImage(imgData, 'PNG', 10, 25, imgWidth, imgHeight);
        pdf.save(`relatorio_frequencia_${dayjs().format('MM_YYYY')}.pdf`);
      } catch (e) {
        alert("Erro ao criar PDF visual.");
      } finally {
        btn.innerHTML = "GERAR PDF";
        btn.disabled = false;
      }
    }

    window.onload = carregarFiltrosIniciais;
  </script>

  <style>
    /* Resolve o problema do texto invisível nos selects */
    select { color: white !important; background-color: #1F2937 !important; }
    option { color: black !important; background-color: white !important; }
  </style>
</head>

<body class="bg-dark-primary text-text-light min-h-screen p-6">
  <div class="max-w-7xl mx-auto">
    <header class="mb-10 text-center">
      <h1 class="text-3xl font-bold text-accent">SISTEMA SGCE</h1>
      <p class="text-gray-400">Gestão de Convivência Escolar - Frequência</p>
      <button onclick="window.location.href='/gestao_frequencia'" class="mt-4 text-xs border border-gray-600 px-4 py-2 rounded hover:bg-gray-800">VOLTAR</button>
    </header>

    <div class="bg-dark-secondary p-6 rounded-xl shadow-lg border border-gray-800">
      <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
        <div>
          <label class="text-xs font-bold text-gray-500 uppercase">Sala</label>
          <select id="salaSelect" class="w-full p-3 rounded-lg border border-gray-700 outline-none focus:border-accent"></select>
        </div>
        <div>
          <label class="text-xs font-bold text-gray-500 uppercase">Mês</label>
          <select id="mesSelect" class="w-full p-3 rounded-lg border border-gray-700 outline-none focus:border-accent"></select>
        </div>
        <div class="flex items-end">
          <button onclick="visualizarFrequencia()" class="w-full bg-accent hover:bg-emerald-600 text-dark-primary font-bold py-3 rounded-lg transition-all">VISUALIZAR</button>
        </div>
      </div>

      <div class="flex justify-between items-center mb-4">
        <h2 class="text-sm font-bold text-gray-400 uppercase tracking-widest">Mapa de Frequência</h2>
        <button id="btnGerarPDF" class="hidden bg-gray-700 hover:bg-gray-600 px-6 py-2 rounded-lg text-xs font-bold transition-all">GERAR PDF</button>
      </div>

      <div id="tabelaContainer" class="bg-dark-primary/50 rounded-lg p-6 border border-gray-800 min-h-[200px] flex items-center justify-center text-gray-500 italic">
        Selecione os filtros e clique em visualizar para carregar os dados.
      </div>
    </div>
  </div>
</body>
</html>
