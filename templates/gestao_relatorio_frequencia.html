<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gestão de Frequência - Relatório Mensal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/dayjs@1/dayjs.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'dark-primary': '#0F172A',
            'dark-secondary': '#1E293B',
            'accent': '#10B981',
            'text-light': '#F8FAFC',
            'danger': '#DC2626',
            'warning': '#FACC15'
          },
          fontFamily: { sans: ['Inter', 'sans-serif'] },
        },
      },
    };

    // VARIÁVEL GLOBAL PARA OS DETALHES FUNCIONAREM
    let dadosFrequenciaGlobal = [];

    document.addEventListener("DOMContentLoaded", () => {
      carregarSalas();
      carregarMeses();
      document.getElementById("btnVisualizar").addEventListener("click", visualizar);
      document.getElementById("btnGerarPDF").addEventListener("click", gerarPDF);
    });

    async function carregarSalas() {
      try {
        const resp = await fetch("/api/d_salas");
        if (!resp.ok) throw new Error("Erro ao carregar salas");
        const data = await resp.json();
        const salas = data.data || data;
        const select = document.getElementById("salaSelect");
        select.innerHTML = '<option value="" class="text-black">Selecione a Sala</option>';
        salas.forEach(s => {
          select.innerHTML += `<option value="${s.id}" class="text-black">${s.nome}</option>`;
        });
      } catch (err) {
        console.error(err);
      }
    }

    function carregarMeses() {
      const meses = ["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];
      const sel = document.getElementById("mesSelect");
      sel.innerHTML = '<option value="" class="text-black">Selecione o Mês</option>';
      meses.forEach((m,i) => {
        sel.innerHTML += `<option value="${i+1}" class="text-black">${m}</option>`;
      });
    }

    async function visualizar() {
      const sala = document.getElementById("salaSelect").value;
      const mes = document.getElementById("mesSelect").value;
      if (!sala || !mes) {
        alert("Selecione a sala e o mês.");
        return;
      }
      try {
        const resp = await fetch(`/api/frequencia?sala=${sala}&mes=${mes}`);
        const data = await resp.json();
        
        // Atualiza a variável global
        dadosFrequenciaGlobal = data.data || data;

        if (!dadosFrequenciaGlobal || dadosFrequenciaGlobal.length === 0) {
          document.getElementById("tabelaContainer").innerHTML = '<p class="text-gray-400 text-center py-8">Nenhum registro encontrado.</p>';
          return;
        }

        montarTabela(dadosFrequenciaGlobal, parseInt(mes));
      } catch (e) {
        console.error(e);
        alert("Erro ao carregar relatório.");
      }
    }

    function montarTabela(dados, mes) {
      const container = document.getElementById("tabelaContainer");
      container.innerHTML = "";
      const ano = dayjs().year();
      const dias = [];
      const totalDias = new Date(ano, mes, 0).getDate();

      for (let d = 1; d <= totalDias; d++) {
        const data = dayjs(`${ano}-${String(mes).padStart(2,'0')}-${String(d).padStart(2,'0')}`);
        if (data.day() !== 0 && data.day() !== 6) dias.push(data);
      }

      let html = `<div class="overflow-x-auto"><table class="min-w-full border border-gray-700 text-sm text-center">
            <thead class="bg-dark-primary"><tr><th class="px-2 py-2 border border-gray-700 text-gray-300">Aluno</th>`;
      dias.forEach(d => { html += `<th class="px-2 py-2 border border-gray-700 text-gray-400">${d.format("DD")}</th>`; });
      html += `</tr></thead><tbody>`;

      dados.forEach(aluno => {
        html += `<tr><td class="border border-gray-700 text-left px-2 text-white bg-gray-800">${aluno.nome}</td>`;
        dias.forEach(d => {
          const dataKey = d.format("YYYY-MM-DD");
          const freq = aluno.frequencia?.[dataKey] || {};
          const status = freq.status || "-";
          
          let cor = "text-gray-500";
          let clickHandler = "";
          
          if (status === "P") cor = "text-green-500 font-bold";
          else if (status === "F") cor = "text-red-500 font-bold";
          else if (["PA", "PS", "PSA"].includes(status)) {
            cor = "text-yellow-400 font-bold cursor-pointer bg-yellow-900/20";
            clickHandler = `onclick="mostrarDetalhesFrequencia(${aluno.id}, '${dataKey}')"`;
          }
          
          html += `<td class="border border-gray-700 ${cor}" ${clickHandler}>${status}</td>`;
        });
        html += `</tr>`;
      });
      html += `</tbody></table></div>`;
      container.innerHTML = html;
    }

    async function mostrarDetalhesFrequencia(alunoId, data) {
      try {
        const resp = await fetch(`/api/frequencia_detalhes/${alunoId}/${data}`);
        const detalhes = await resp.json();
        const aluno = dadosFrequenciaGlobal.find(a => a.id == alunoId);
        
        let modalContent = `<div class="text-left"><h3 class="text-lg font-bold text-accent mb-2">Detalhes: ${aluno ? aluno.nome : 'Aluno'}</h3>
                            <p class="text-sm text-gray-400 mb-4">${dayjs(data).format('DD/MM/YYYY')}</p>`;
        
        if (detalhes.hora_entrada) modalContent += `<p class="text-yellow-400"><strong>Entrada:</strong> ${detalhes.hora_entrada} - ${detalhes.motivo_atraso || ''}</p>`;
        if (detalhes.hora_saida) modalContent += `<p class="text-orange-400"><strong>Saída:</strong> ${detalhes.hora_saida} - ${detalhes.motivo_saida || ''}</p>`;
        if (detalhes.responsavel_nome) modalContent += `<p class="mt-2 text-xs border-t border-gray-700 pt-2"><strong>Resp:</strong> ${detalhes.responsavel_nome} (${detalhes.responsavel_telefone || ''})</p>`;
        
        modalContent += `</div>`;

        const modal = document.createElement('div');
        modal.className = 'fixed inset-0 bg-black/80 flex items-center justify-center z-50 p-4';
        modal.innerHTML = `<div class="bg-dark-secondary p-6 rounded-xl border border-gray-700 max-w-sm w-full">
            ${modalContent}
            <button onclick="this.closest('.fixed').remove()" class="w-full mt-6 bg-accent py-2 rounded-lg font-bold">FECHAR</button>
        </div>`;
        document.body.appendChild(modal);
      } catch (e) { alert("Erro ao carregar detalhes."); }
    }

    // Função de PDF simplificada e robusta
    async function gerarPDF() {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF('l', 'mm', 'a4');
        const element = document.getElementById("tabelaContainer");
        
        await html2canvas(element, { backgroundColor: "#0F172A", scale: 2 }).then(canvas => {
            const imgData = canvas.toDataURL('image/png');
            doc.text(`Relatório de Frequência - ${document.getElementById("salaSelect").selectedOptions[0].text}`, 10, 10);
            doc.addImage(imgData, 'PNG', 10, 20, 277, 0);
            doc.save("frequencia.pdf");
        });
    }
  </script>
</head>
<body class="bg-dark-primary min-h-screen text-text-light p-4 md:p-8">
  <div class="max-w-7xl mx-auto">
    <header class="text-center mb-8">
      <h1 class="text-xl font-bold text-accent tracking-widest uppercase">Sistema SGCE</h1>
      <h2 class="text-gray-400">Relatório de Frequência Mensal</h2>
    </header>

    <main class="bg-dark-secondary rounded-xl p-6 shadow-2xl border border-gray-800">
      <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-8">
        <div>
          <label class="text-xs text-gray-500 uppercase font-bold px-1">Sala</label>
          <select id="salaSelect" class="w-full p-3 bg-gray-800 rounded-lg border border-gray-700 text-white focus:border-accent outline-none"></select>
        </div>
        <div>
          <label class="text-xs text-gray-500 uppercase font-bold px-1">Mês</label>
          <select id="mesSelect" class="w-full p-3 bg-gray-800 rounded-lg border border-gray-700 text-white focus:border-accent outline-none"></select>
        </div>
        <div class="flex items-end">
          <button id="btnVisualizar" class="w-full bg-accent hover:bg-emerald-600 text-dark-primary font-black py-3 rounded-lg transition-all">VISUALIZAR</button>
        </div>
      </div>

      <div class="flex justify-between items-center mb-4">
          <h3 class="text-sm font-bold text-gray-500 uppercase">Registros</h3>
          <button id="btnGerarPDF" class="flex items-center gap-2 bg-gray-700 hover:bg-gray-600 px-4 py-2 rounded-lg text-xs font-bold transition-all">
            <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20"><path d="M6 2a2 2 0 00-2 2v12a2 2 0 002 2h8a2 2 0 002-2V7.414A2 2 0 0015.414 6L12 2.586A2 2 0 0010.586 2H6zm5 2l4 4H11V4z"/></svg>
            GERAR PDF
          </button>
      </div>

      <div id="tabelaContainer" class="rounded-lg border border-gray-800 p-4 bg-dark-primary/50 min-h-[300px] flex items-center justify-center">
        <span class="text-gray-600 italic">Aguardando seleção de filtros...</span>
      </div>
    </main>
  </div>
</body>
</html>
