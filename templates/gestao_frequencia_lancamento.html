<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Lançamento de Frequência</title><script src="https://cdn.tailwindcss.com"></script></head><body class="bg-slate-900 text-slate-100 min-h-screen p-4"><div class="max-w-6xl mx-auto space-y-4"><header class="flex justify-between"><h1 class="text-2xl font-bold text-emerald-400">Lançamento de Frequência</h1><a href="/dashboard_frequencia" class="bg-slate-700 px-4 py-2 rounded">Voltar</a></header><div class="bg-slate-800 p-4 rounded-xl grid md:grid-cols-3 gap-3"><select id="sala_id" class="bg-slate-900 border border-slate-700 rounded px-3 py-2"><option value="">Selecione a sala</option></select><input id="data_ref" type="date" class="bg-slate-900 border border-slate-700 rounded px-3 py-2"><div class="flex gap-2"><button onclick="carregarAlunos()" class="flex-1 bg-emerald-600 px-4 py-2 rounded">Carregar</button><button onclick="salvar()" class="flex-1 bg-blue-700 px-4 py-2 rounded">Salvar</button></div></div><table class="w-full text-sm"><thead><tr><th class="text-left py-2">Aluno</th><th class="text-left py-2">Status</th></tr></thead><tbody id="tb"></tbody></table></div><script>
let salas=[], alunos=[], estado={};
function hojeISO(){return new Date().toISOString().slice(0,10);}
async function init(){document.getElementById('data_ref').value=hojeISO(); salas=await (await fetch('/api/salas')).json(); document.getElementById('sala_id').innerHTML='<option value="">Selecione a sala</option>'+salas.map(s=>`<option value="${s.id}">${s.nome||s.sala||''}</option>`).join('');}
async function carregarAlunos(){const sala=document.getElementById('sala_id').value, data=document.getElementById('data_ref').value; if(!sala) return alert('Selecione a sala'); alunos=await (await fetch('/api/alunos_por_sala/'+sala)).json(); const regs=await (await fetch(`/api/frequencia/listar?sala_id=${sala}&data=${data}`)).json(); estado={}; alunos.forEach(a=>{const ex=regs.find(x=>String(x.aluno_id)===String(a.id)); estado[a.id]={aluno_id:a.id,aluno_nome:a.nome||a.aluno_nome||'',sala_id:sala,sala_nome:a.sala_nome||'',data,status:(ex?.status||'P').toUpperCase()==='F'?'F':'P'};}); render();}
function alt(id){estado[id].status=estado[id].status==='P'?'F':'P'; render();}
function render(){document.getElementById('tb').innerHTML=alunos.map(a=>`<tr class="border-b border-slate-800"><td class="py-2">${estado[a.id].aluno_nome}</td><td class="py-2"><button onclick="alt(${a.id})" class="${estado[a.id].status==='P'?'bg-emerald-600':'bg-red-600'} px-3 py-1 rounded">${estado[a.id].status}</button></td></tr>`).join('');}
async function salvar(){const r=await fetch('/api/frequencia/salvar',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.values(estado))}); const j=await r.json(); if(!r.ok||!j.success) return alert(j.error||'Erro'); alert('Salvo com sucesso');}
init();
</script>
<footer class="mt-8 border-t border-slate-700 pt-4 text-center text-sm text-slate-400">

</footer>
</body></html>
