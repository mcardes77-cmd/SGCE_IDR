<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestão de Ocorrências</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen p-4 md:p-6 text-sm">
<div class="max-w-7xl mx-auto">
    <header class="mb-6">
        <div class="flex flex-col gap-3 md:flex-row md:items-end md:justify-between">
            <div>
                <h1 class="text-2xl font-bold text-emerald-400">Gestão de Ocorrências</h1>
                <p class="text-slate-400 text-xs md:text-sm">Filtros enxutos com dados apenas de quem realmente tem ocorrência.</p>
            </div>
            <div class="flex flex-wrap gap-2">
                <a href="/dashboard_ocorrencias" class="bg-blue-700 hover:bg-blue-600 px-3 py-2 rounded-lg font-semibold text-xs">Voltar ao Dashboard</a>
                <a href="/gestao_ocorrencia_nova" class="bg-emerald-600 hover:bg-emerald-500 px-3 py-2 rounded-lg font-semibold text-xs">Nova Ocorrência</a>
                <a href="/gestao_relatorio_impressao" class="bg-slate-700 hover:bg-slate-600 px-3 py-2 rounded-lg font-semibold text-xs">Relatório / Impressão</a>
            </div>
        </div>
    </header>

    <div id="msg" class="hidden fixed top-4 right-4 z-50 px-4 py-3 rounded-lg shadow-lg"></div>

    <section class="bg-slate-800 rounded-2xl p-4 md:p-5 shadow border border-slate-700 mb-4">
        <div class="grid grid-cols-1 md:grid-cols-4 gap-3">
            <div>
                <label class="block text-xs text-slate-300 mb-1">Tutor</label>
                <select id="filtro-tutor" class="w-full rounded-lg bg-slate-900 border border-slate-700 p-2 text-xs"></select>
            </div>
            <div>
                <label class="block text-xs text-slate-300 mb-1">Status</label>
                <select id="filtro-status" class="w-full rounded-lg bg-slate-900 border border-slate-700 p-2 text-xs">
                    <option value="all">Todos os status</option>
                    <option value="ATENDIMENTO">ATENDIMENTO</option>
                    <option value="FINALIZADA">FINALIZADA</option>
                    <option value="ASSINADA">ASSINADA</option>
                </select>
            </div>
            <div>
                <label class="block text-xs text-slate-300 mb-1">Sala</label>
                <select id="filtro-sala" class="w-full rounded-lg bg-slate-900 border border-slate-700 p-2 text-xs"></select>
            </div>
            <div>
                <label class="block text-xs text-slate-300 mb-1">Aluno</label>
                <select id="filtro-aluno" class="w-full rounded-lg bg-slate-900 border border-slate-700 p-2 text-xs"></select>
            </div>
        </div>
    </section>

    <section class="bg-slate-800 rounded-2xl p-4 md:p-5 shadow border border-slate-700">
        <div class="flex flex-col gap-3 md:flex-row md:items-center md:justify-between mb-3">
            <div id="contador-selecao" class="text-xs text-slate-300">0/0 selecionadas</div>
            <button onclick="gerarPDFSelecionadas()" class="bg-emerald-600 hover:bg-emerald-500 px-3 py-2 rounded-lg font-semibold text-xs w-full md:w-auto">Gerar PDF das selecionadas</button>
        </div>

        <div class="overflow-x-auto">
            <table class="w-full text-xs md:text-sm">
                <thead>
                    <tr class="border-b border-slate-700 text-slate-300">
                        <th class="p-2 text-left">Sel.</th>
                        <th class="p-2 text-left">Nº</th>
                        <th class="p-2 text-left">Data</th>
                        <th class="p-2 text-left">Aluno</th>
                        <th class="p-2 text-left">Sala</th>
                        <th class="p-2 text-left">Professor</th>
                        <th class="p-2 text-left">Tutor</th>
                        <th class="p-2 text-left">Pend.</th>
                        <th class="p-2 text-left">Status</th>
                    </tr>
                </thead>
                <tbody id="ocorrencias-body"></tbody>
            </table>
        </div>
    </section>
</div>

<script>
let todasOcorrencias = [];
let ocorrencias = [];

function getParametro(nome) {
    return new URLSearchParams(window.location.search).get(nome);
}

function mostrarMsg(msg, tipo='info') {
    const el = document.getElementById('msg');
    el.textContent = msg;
    el.className = 'fixed top-4 right-4 z-50 px-4 py-3 rounded-lg shadow-lg text-white';
    if (tipo === 'error') el.classList.add('bg-red-600');
    else if (tipo === 'success') el.classList.add('bg-green-600');
    else el.classList.add('bg-blue-600');
    el.classList.remove('hidden');
    setTimeout(() => el.classList.add('hidden'), 3500);
}

function formatarData(v) {
    if (!v) return '';
    try { return new Date(v).toLocaleDateString('pt-BR'); }
    catch { return v; }
}

function calcularStatus(oc) {
    return (oc.status || '').toUpperCase() || 'ATENDIMENTO';
}

function siglaPendencia(oc) {
    const pend = String(oc.pendencia || '').toUpperCase();
    if (pend === 'TUTOR') return 'T';
    if (pend === 'COORDENACAO') return 'C';
    if (pend === 'GESTAO') return 'G';
    if (pend === 'RESPONSAVEL') return 'R';
    return '👁️';
}

function classePendencia(sigla) {
    if (sigla === 'T') return 'bg-blue-600 text-white';
    if (sigla === 'C') return 'bg-yellow-500 text-black';
    if (sigla === 'G') return 'bg-red-600 text-white';
    if (sigla === 'R') return 'bg-purple-600 text-white';
    return 'text-blue-400';
}

function extrairUnicos(lista, campo) {
    return [...new Set(lista.map(i => (i[campo] || '').trim()).filter(Boolean))].sort((a, b) => a.localeCompare(b));
}

function preencherSelect(id, valores, textoTodos) {
    const select = document.getElementById(id);
    const atual = select.value || 'all';
    select.innerHTML = `<option value="all">${textoTodos}</option>` + valores.map(v => `<option value="${v}">${v}</option>`).join('');
    select.value = valores.includes(atual) ? atual : 'all';
}

async function carregarOcorrencias() {
    const r = await fetch('/api/ocorrencias_todas');
    const data = await r.json();
    todasOcorrencias = (data || []).map(oc => ({ ...oc, status: calcularStatus(oc) }));
}

function preencherFiltrosBase() {
    preencherSelect('filtro-tutor', extrairUnicos(todasOcorrencias, 'tutor_nome'), 'Todos os tutores');
    preencherSelect('filtro-sala', extrairUnicos(todasOcorrencias, 'sala_nome'), 'Todas as salas');
    preencherSelect('filtro-aluno', extrairUnicos(todasOcorrencias, 'aluno_nome'), 'Todos os alunos');
}

function atualizarFiltrosDinamicos() {
    const tutor = document.getElementById('filtro-tutor').value;
    const status = document.getElementById('filtro-status').value;
    const sala = document.getElementById('filtro-sala').value;
    const aluno = document.getElementById('filtro-aluno').value;

    const tutores = extrairUnicos(todasOcorrencias.filter(oc => {
        if (status !== 'all' && calcularStatus(oc) !== status) return false;
        if (sala !== 'all' && (oc.sala_nome || '') !== sala) return false;
        if (aluno !== 'all' && (oc.aluno_nome || '') !== aluno) return false;
        return true;
    }), 'tutor_nome');

    const salas = extrairUnicos(todasOcorrencias.filter(oc => {
        if (tutor !== 'all' && (oc.tutor_nome || '') !== tutor) return false;
        if (status !== 'all' && calcularStatus(oc) !== status) return false;
        if (aluno !== 'all' && (oc.aluno_nome || '') !== aluno) return false;
        return true;
    }), 'sala_nome');

    const alunos = extrairUnicos(todasOcorrencias.filter(oc => {
        if (tutor !== 'all' && (oc.tutor_nome || '') !== tutor) return false;
        if (status !== 'all' && calcularStatus(oc) !== status) return false;
        if (sala !== 'all' && (oc.sala_nome || '') !== sala) return false;
        return true;
    }), 'aluno_nome');

    preencherSelect('filtro-tutor', tutores, 'Todos os tutores');
    preencherSelect('filtro-sala', salas, 'Todas as salas');
    preencherSelect('filtro-aluno', alunos, 'Todos os alunos');
}

function aplicarFiltroPendencia(tipo) {
    tipo = (tipo || '').toUpperCase();
    ocorrencias = todasOcorrencias.filter(o => (o.pendencia || '').toUpperCase() === tipo)
        .sort((a, b) => (b.numero || 0) - (a.numero || 0));
    renderizarOcorrencias();
}

function aplicarFiltros() {
    const tutor = document.getElementById('filtro-tutor').value;
    const status = document.getElementById('filtro-status').value;
    const sala = document.getElementById('filtro-sala').value;
    const aluno = document.getElementById('filtro-aluno').value;

    ocorrencias = todasOcorrencias.filter(oc => {
        if (tutor !== 'all' && (oc.tutor_nome || '') !== tutor) return false;
        if (status !== 'all' && calcularStatus(oc) !== status) return false;
        if (sala !== 'all' && (oc.sala_nome || '') !== sala) return false;
        if (aluno !== 'all' && (oc.aluno_nome || '') !== aluno) return false;
        return true;
    }).sort((a, b) => (b.numero || 0) - (a.numero || 0));

    renderizarOcorrencias();
}

function renderizarOcorrencias() {
    const tbody = document.getElementById('ocorrencias-body');
    if (!ocorrencias.length) {
        tbody.innerHTML = '<tr><td colspan="9" class="p-5 text-center text-slate-400">Nenhuma ocorrência encontrada.</td></tr>';
        atualizarSelecao();
        return;
    }

    tbody.innerHTML = ocorrencias.map(oc => {
        const sigla = siglaPendencia(oc);
        const jaImpresso = !!oc.impressao_pdf;
        const vis = `<a href="/gestao_ocorrencia_editar?numero=${oc.numero}" class="inline-flex items-center justify-center w-7 h-7 rounded-full font-bold ${classePendencia(sigla)}">${sigla}</a>`;
        return `
            <tr class="border-b border-slate-800 hover:bg-slate-800/60">
                <td class="p-2"><input type="checkbox" value="${oc.numero}" class="h-4 w-4 accent-emerald-500" ${jaImpresso ? 'checked disabled' : ''} onchange="atualizarSelecao()"></td>
                <td class="p-2">${oc.numero || ''}</td>
                <td class="p-2">${formatarData(oc.data_hora || oc.data)}</td>
                <td class="p-2">${oc.aluno_nome || ''}</td>
                <td class="p-2">${oc.sala_nome || ''}</td>
                <td class="p-2">${oc.professor_nome || ''}</td>
                <td class="p-2">${oc.tutor_nome || ''}</td>
                <td class="p-2">${vis}</td>
                <td class="p-2">${oc.status || ''}</td>
            </tr>`;
    }).join('');
    atualizarSelecao();
}

function atualizarSelecao() {
    const total = ocorrencias.length;
    const marcadas = document.querySelectorAll('#ocorrencias-body input:checked').length;
    document.getElementById('contador-selecao').textContent = `${marcadas}/${total} selecionadas`;
}

async function gerarPDFSelecionadas() {
    const numeros = [...document.querySelectorAll('#ocorrencias-body input:checked:not(:disabled)')].map(i => parseInt(i.value)).filter(v => !isNaN(v));
    if (!numeros.length) {
        mostrarMsg('Selecione pelo menos uma ocorrência.', 'error');
        return;
    }
    const r = await fetch('/api/gerar_pdf_ocorrencias', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ numeros })
    });
    const data = await r.json().catch(() => ({}));
    if (!r.ok || !data.success) {
        mostrarMsg(data.error || 'Erro ao preparar impressão.', 'error');
        return;
    }
    mostrarMsg('Relatório preparado com sucesso.', 'success');
    if (data.print_url) window.open(data.print_url, '_blank');
    setTimeout(async () => {
        await carregarOcorrencias();
        atualizarFiltrosDinamicos();
        aplicarFiltros();
    }, 800);
}

window.addEventListener('DOMContentLoaded', async () => {
    await carregarOcorrencias();
    preencherFiltrosBase();
    atualizarFiltrosDinamicos();
    aplicarFiltros();

    ['filtro-tutor', 'filtro-status', 'filtro-sala', 'filtro-aluno'].forEach(id => {
        document.getElementById(id).addEventListener('change', () => {
            atualizarFiltrosDinamicos();
            aplicarFiltros();
        });
    });

    const pendenciaURL = getParametro('pendencia');
    if (pendenciaURL) {
        document.getElementById('filtro-status').value = 'ATENDIMENTO';
        aplicarFiltroPendencia(pendenciaURL);
    }
});
</script>
</body>
</html>
