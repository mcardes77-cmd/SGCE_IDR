<!DOCTYPE html> 
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SGCE - Gestão de Ocorrências</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'dark-primary': '#0F172A',
                        'dark-secondary': '#1E293B',
                        'accent': '#10B981',
                        'text-light': '#F8FAFC'
                    },
                },
            },
        };

        // Função para carregar o resumo das ocorrências no dashboard
        async function carregarDashboard() {
            try {
                const res = await fetch('/api/ocorrencias/stats');
                const stats = await res.json();
                document.getElementById('total-abertas').textContent = stats.abertas || 0;
                document.getElementById('total-hoje').textContent = stats.hoje || 0;
            } catch (e) { console.error("Erro ao carregar stats"); }
        }

        document.addEventListener('DOMContentLoaded', carregarDashboard);
    </script>
</head>
<body class="bg-dark-primary text-text-light p-6">
    <div class="max-w-7xl mx-auto">
        <header class="flex justify-between items-center mb-10">
            <div>
                <h1 class="text-3xl font-bold text-accent italic tracking-tighter">SGCE - OCORRÊNCIAS</h1>
                <p class="text-gray-400">Gerenciamento de convivência e registros escolares.</p>
            </div>
            <button onclick="window.location.href='/'" class="bg-gray-800 hover:bg-gray-700 px-4 py-2 rounded-lg transition">Menu Principal</button>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-10">
            <button onclick="window.location.href='/gestao_ocorrencia_nova'" class="p-6 bg-accent/10 border border-accent/20 rounded-2xl hover:bg-accent/20 transition group text-left">
                <span class="text-3xl mb-4 block">➕</span>
                <h3 class="font-bold text-accent uppercase">Nova Ocorrência</h3>
                <p class="text-xs text-gray-400">Registrar novo relato de professor.</p>
            </button>

            <button onclick="window.location.href='/gestao_ocorrencia_aberta'" class="p-6 bg-blue-500/10 border border-blue-500/20 rounded-2xl hover:bg-blue-500/20 transition text-left">
                <span id="total-abertas" class="text-3xl font-bold text-blue-400 block">0</span>
                <h3 class="font-bold text-blue-400 uppercase">Abertas / Atender</h3>
                <p class="text-xs text-gray-400">Aguardando parecer do tutor.</p>
            </button>

            <button onclick="window.location.href='/gestao_ocorrencia_finalizada'" class="p-6 bg-purple-500/10 border border-purple-500/20 rounded-2xl hover:bg-purple-500/20 transition text-left">
                <span class="text-3xl mb-4 block">✅</span>
                <h3 class="font-bold text-purple-400 uppercase">Finalizadas</h3>
                <p class="text-xs text-gray-400">Histórico de casos resolvidos.</p>
            </button>

            <button onclick="window.location.href='/gestao_relatorio_impressao'" class="p-6 bg-red-500/10 border border-red-500/20 rounded-2xl hover:bg-red-500/20 transition text-left">
                <span class="text-3xl mb-4 block">🖨️</span>
                <h3 class="font-bold text-red-400 uppercase">Impressão / PDF</h3>
                <p class="text-xs text-gray-400">Gerar relatórios para os pais.</p>
            </button>
        </div>
    </div>
</body>
</html>
