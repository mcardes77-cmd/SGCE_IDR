<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Evolução do Aluno</title><script src="https://cdn.tailwindcss.com"></script></head>
<body class="bg-slate-900 text-white min-h-screen p-6"><div class="max-w-6xl mx-auto"><header class="mb-8 flex justify-between items-center"><h1 class="text-3xl font-bold text-emerald-400">Relatório de Evolução do Aluno</h1><button onclick="window.location.href='/gestao_tutoria'" class="bg-slate-700 hover:bg-slate-600 px-4 py-2 rounded-lg">Voltar</button></header><section class="bg-slate-800 rounded-2xl shadow p-6 mb-6"><div class="grid grid-cols-1 md:grid-cols-3 gap-4"><div><label class="block text-sm text-slate-300 mb-1">Tutor</label><select id="tutor" class="w-full rounded-lg bg-slate-700 border border-slate-600 p-3" onchange="carregarAlunos()"></select></div><div><label class="block text-sm text-slate-300 mb-1">Aluno</label><select id="aluno" class="w-full rounded-lg bg-slate-700 border border-slate-600 p-3"></select></div><div class="flex items-end"><button onclick="buscar()" class="w-full bg-emerald-600 hover:bg-emerald-700 px-4 py-3 rounded-lg font-bold">Gerar evolução</button></div></div></section><section id="resultado" class="hidden space-y-6"><div class="grid grid-cols-1 md:grid-cols-5 gap-4"><div class="bg-slate-800 rounded-2xl p-5"><div class="text-slate-400 text-sm">Presenças</div><div id="kpi-pres" class="text-3xl font-bold mt-2">0</div></div><div class="bg-slate-800 rounded-2xl p-5"><div class="text-slate-400 text-sm">Faltas</div><div id="kpi-falt" class="text-3xl font-bold mt-2">0</div></div><div class="bg-slate-800 rounded-2xl p-5"><div class="text-slate-400 text-sm">Atrasos</div><div id="kpi-atr" class="text-3xl font-bold mt-2">0</div></div><div class="bg-slate-800 rounded-2xl p-5"><div class="text-slate-400 text-sm">Saídas</div><div id="kpi-sai" class="text-3xl font-bold mt-2">0</div></div><div class="bg-slate-800 rounded-2xl p-5"><div class="text-slate-400 text-sm">Ocorrências</div><div id="kpi-oco" class="text-3xl font-bold mt-2">0</div></div></div><div class="grid grid-cols-1 md:grid-cols-2 gap-6"><div class="bg-slate-800 rounded-2xl shadow overflow-hidden"><div class="px-5 py-4 border-b border-slate-700 font-semibold text-emerald-400">Linha do tempo da frequência</div><div id="lista-freq" class="p-5 space-y-4"></div></div><div class="bg-slate-800 rounded-2xl shadow overflow-hidden"><div class="px-5 py-4 border-b border-slate-700 font-semibold text-emerald-400">Linha do tempo das ocorrências</div><div id="lista-ocorr" class="p-5 space-y-4"></div></div></div></section></div><script>
let tutores=[];let alunos=[];document.addEventListener('DOMContentLoaded', async ()=>{const r=await fetch('/api/tutores');tutores=await r.json();document.getElementById('tutor').innerHTML='<option value="">Selecione o tutor</option>'+tutores.map(t=>`<option value="${t.id}">${t.nome||''}</option>`).join('');});
async function carregarAlunos(){const tutorId=document.getElementById('tutor').value;const r=await fetch(`/api/alunos_tutoria?tutor_id=${tutorId}`);alunos=await r.json();document.getElementById('aluno').innerHTML='<option value="">Selecione o aluno</option>'+alunos.map(a=>`<option value="${a.id}">${a.nome||''}</option>`).join('');}
function card(title,subtitle,body){return `<div class="rounded-xl border border-slate-700 bg-slate-900 p-4"><div class="font-semibold">${title}</div><div class="text-sm text-slate-400">${subtitle||''}</div><div class="mt-2 text-sm whitespace-pre-wrap">${body||''}</div></div>`;}
async function buscar(){const alunoId=document.getElementById('aluno').value;if(!alunoId)return;const r=await fetch(`/api/evolucao_aluno/${alunoId}`);const data=await r.json();document.getElementById('resultado').classList.remove('hidden');document.getElementById('kpi-pres').textContent=data.resumo?.presencas||0;document.getElementById('kpi-falt').textContent=data.resumo?.faltas||0;document.getElementById('kpi-atr').textContent=data.resumo?.atrasos||0;document.getElementById('kpi-sai').textContent=data.resumo?.saidas||0;document.getElementById('kpi-oco').textContent=data.resumo?.ocorrencias||0;document.getElementById('lista-freq').innerHTML=(data.frequencia||[]).length?(data.frequencia||[]).map(f=>card(`Status ${f.status||''}`,`${f.data||''}`,`Entrada: ${f.hora_entrada||''}\nSaída: ${f.hora_saida||''}`)).join(''):'<div class="text-slate-400">Sem dados.</div>';document.getElementById('lista-ocorr').innerHTML=(data.ocorrencias||[]).length?(data.ocorrencias||[]).map(o=>card(`Ocorrência #${o.numero}`,`${(o.data_hora||'').substring(0,10)} - ${o.status||''}`,o.descricao||'')).join(''):'<div class="text-slate-400">Sem dados.</div>';}
</script></body></html>
