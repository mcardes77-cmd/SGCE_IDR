
<!DOCTYPE html>
<html>
<head>
<title>SGCE APP</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white">

<div id="loadingSalvar" class="hidden fixed inset-0 bg-black/60 flex items-center justify-center">
  <div class="bg-slate-800 p-6 rounded-xl">⏳ Salvando...</div>
</div>

<div class="p-4 bg-slate-800 flex gap-4">
  <a href="/" class="hover:underline">Dashboard Geral</a>
  <a href="/dashboard_frequencia" class="hover:underline">Frequência</a>
  <a href="/gestao_tutoria" class="hover:underline">Tutoria</a>
</div>

{% block content %}{% endblock %}

<script>
function iniciarSalvar(btn){
  if(btn){ btn.disabled=true; btn.innerText="Salvando..." }
  document.getElementById("loadingSalvar").classList.remove("hidden")
}
function finalizarSalvar(url=null){
  document.getElementById("loadingSalvar").classList.add("hidden")
  if(url){ window.location.href=url } else { window.history.back() }
}
</script>

</body>
</html>
