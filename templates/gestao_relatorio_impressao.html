<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Impressão de Ocorrências</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
let ocorrencias = [];

document.addEventListener('DOMContentLoaded', async () => {
  await carregarSalas();
  document.getElementById('filter-sala').addEventListener('change', carregarAlunos);
});

function msg(texto) {
  const el = document.getElementById('msg');
  el.textContent = texto;
}

async function carregarSalas() {
  const sel = document.getElementById('filter-sala');
  sel.innerHTML = '<option>Carregando...</option>';
  const r = await fetch('/api/salas');
  const data = await r.json();
  sel.innerHTML = '<option value="">Selecione a sala</option>';
  (data || []).forEach(s => {
    sel.innerHTML += `<option value="${s.id}">${s.nome || ''}</option>`;
  });
}

async function carregarAlunos() {
  const sala = document.getElementById('filter-sala').value;
  const sel = document.getElementById('filter-aluno');
  if (!sala) {
    sel.innerHTML = '<option value="">Selecione uma sala primeiro</option>';
    return;
  }
  const r = await fetch(`/api/alunos_por_sala/${sala}`);
  const data = await r.json();
  sel.innerHTML = '<option value="">Selecione o aluno</option>';
  (data || []).forEach(a => {
    sel.innerHTML += `<option value="${a.id}">${a.nome || ''}</option>`;
  });
}

async function buscarOcorrencias() {
  const aluno = document.getElementById('filter-aluno').value;
  if (!aluno) {
    msg('Selecione um aluno.');
    return;
  }
  const r = await fetch(`/api/ocorrencias_por_aluno/${aluno}`);
  const data = await r.json();
  ocorrencias = data || [];
  const div = document.getElementById('lista');
  if (!ocorrencias.length) {
    div.innerHTML = '<p class="text-gray-400">Nenhuma ocorrência encontrada.</p>';
    return;
  }
  div.innerHTML = ocorrencias.map(o => `
    <label class="flex gap-3 items-start border-b border-gray-700 py-3 ${o.impressao_pdf ? 'opacity-60' : ''}">
      <input type="checkbox" value="${o.numero}" ${o.impressao_pdf ? 'checked disabled' : ''}>
      <div>
        <div class="font-bold">Nº ${o.numero} - ${o.status || ''}</div>
        <div class="text-sm text-gray-400">Pendência: ${o.pendencia || ''}</div>
        <div class="text-sm">${o.descricao || ''}</div>
      </div>
    </label>
  `).join('');
}

async function gerarPDF() {
  const selecionadas = [...document.querySelectorAll('#lista input:checked:not(:disabled)')].map(c => c.value);
  if (!selecionadas.length) {
    msg('Selecione ao menos uma ocorrência.');
    return;
  }

  const r = await fetch('/api/gerar_pdf_ocorrencias', {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ numeros: selecionadas })
  });
  const result = await r.json();
  if (!r.ok || !result.success) {
    msg(result.error || 'Erro ao gerar relatório.');
    return;
  }

  document.querySelectorAll('#lista input:checked').forEach(cb => cb.disabled = true);
  if (result.print_url) {
    window.open(result.print_url, '_blank');
  }
}
</script>
</head>
<body class="bg-slate-900 text-white min-h-screen p-6">
  <div class="max-w-4xl mx-auto">
    <h1 class="text-2xl font-bold mb-6">Relatório de Ocorrências</h1>
    <div class="bg-slate-800 p-6 rounded-lg space-y-4">
      <div id="msg" class="text-yellow-300"></div>
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label class="block mb-1">Sala</label>
          <select id="filter-sala" class="w-full p-2 rounded text-black"></select>
        </div>
        <div>
          <label class="block mb-1">Aluno</label>
          <select id="filter-aluno" class="w-full p-2 rounded text-black"></select>
        </div>
      </div>
      <div class="flex gap-3">
        <button onclick="buscarOcorrencias()" class="bg-blue-600 px-4 py-2 rounded">Buscar</button>
        <button onclick="gerarPDF()" class="bg-green-600 px-4 py-2 rounded">Gerar PDF</button>
      </div>
      <div id="lista" class="mt-4"></div>
    </div>
  </div>
</body>
</html>
