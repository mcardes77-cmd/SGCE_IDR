<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Impressão de Ocorrências</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen p-4 md:p-6 text-sm">
<div class="max-w-4xl mx-auto">
    <header class="text-center mb-6">
        <h1 class="text-2xl font-bold text-emerald-400">Relatório / Impressão</h1>
        <button onclick="window.location.href='/gestao_ocorrencia'" class="mt-3 bg-slate-700 hover:bg-slate-600 px-3 py-2 rounded-lg text-xs">← Voltar</button>
    </header>

    <div id="msg" class="hidden mb-4 px-4 py-3 rounded-lg"></div>

    <section class="bg-slate-800 rounded-2xl p-4 shadow border border-slate-700">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-3 mb-4">
            <div>
                <label class="block mb-1 text-xs text-slate-300">Sala</label>
                <select id="filter-sala" class="w-full rounded-lg bg-slate-700 border border-slate-600 p-2 text-xs"></select>
            </div>
            <div>
                <label class="block mb-1 text-xs text-slate-300">Aluno</label>
                <select id="filter-aluno" class="w-full rounded-lg bg-slate-700 border border-slate-600 p-2 text-xs"></select>
            </div>
        </div>
        <div class="flex gap-2 mb-4">
            <button onclick="buscarOcorrencias()" class="bg-blue-600 hover:bg-blue-700 px-3 py-2 rounded-lg font-semibold text-xs">Buscar</button>
            <button onclick="gerarPDF()" class="bg-emerald-600 hover:bg-emerald-700 px-3 py-2 rounded-lg font-semibold text-xs">Gerar PDF</button>
        </div>
        <div id="lista" class="space-y-3"></div>
    </section>
</div>
<script>
let ocorrenciasEncontradas = [];

document.addEventListener('DOMContentLoaded', async () => {
    await carregarSalasComOcorrencias();
    document.getElementById('filter-sala').addEventListener('change', carregarAlunosComOcorrencias);
});

function msg(t, tipo='info') {
    const el = document.getElementById('msg');
    el.textContent = t;
    el.className = 'mb-4 px-4 py-3 rounded-lg text-white';
    if (tipo === 'error') el.classList.add('bg-red-600');
    else if (tipo === 'success') el.classList.add('bg-green-600');
    else el.classList.add('bg-blue-600');
    el.classList.remove('hidden');
}

async function carregarSalasComOcorrencias() {
    const r = await fetch('/api/salas_com_ocorrencias');
    const data = await r.json();
    document.getElementById('filter-sala').innerHTML = '<option value="">Selecione a sala</option>' + (data || []).map(s => `<option value="${s}">${s}</option>`).join('');
    document.getElementById('filter-aluno').innerHTML = '<option value="">Selecione a sala primeiro</option>';
}

async function carregarAlunosComOcorrencias() {
    const sala = document.getElementById('filter-sala').value;
    if (!sala) {
        document.getElementById('filter-aluno').innerHTML = '<option value="">Selecione a sala primeiro</option>';
        return;
    }
    const r = await fetch(`/api/alunos_com_ocorrencias?sala_nome=${encodeURIComponent(sala)}`);
    const data = await r.json();
    document.getElementById('filter-aluno').innerHTML = '<option value="">Selecione o aluno</option>' + (data || []).map(a => `<option value="${a}">${a}</option>`).join('');
}

async function buscarOcorrencias() {
    const sala = document.getElementById('filter-sala').value;
    const aluno = document.getElementById('filter-aluno').value;
    if (!sala) return msg('Selecione uma sala.', 'error');
    if (!aluno) return msg('Selecione um aluno.', 'error');

    const r = await fetch('/api/ocorrencias_todas');
    const data = await r.json();
    ocorrenciasEncontradas = (data || []).filter(o => (o.sala_nome || '') === sala && (o.aluno_nome || '') === aluno);

    const lista = document.getElementById('lista');
    if (!ocorrenciasEncontradas.length) {
        lista.innerHTML = '<div class="text-slate-400">Nenhuma ocorrência encontrada.</div>';
        return;
    }

    lista.innerHTML = ocorrenciasEncontradas.map(o => `
        <label class="flex items-start gap-3 rounded-lg border border-slate-700 bg-slate-900 p-4 ${o.impressao_pdf ? 'opacity-60' : ''}">
            <input type="checkbox" value="${o.numero}" ${o.impressao_pdf ? 'checked disabled' : ''}>
            <div>
                <div class="font-bold text-sm">Nº ${o.numero} - ${o.status || ''}</div>
                <div class="text-xs text-slate-400">Pendência: ${o.pendencia || ''}</div>
                <div class="text-xs">${o.descricao || ''}</div>
            </div>
        </label>
    `).join('');
}

async function gerarPDF() {
    const numeros = [...document.querySelectorAll('#lista input:checked:not(:disabled)')].map(i => i.value);
    if (!numeros.length) return msg('Selecione pelo menos uma ocorrência.', 'error');
    const r = await fetch('/api/gerar_pdf_ocorrencias', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ numeros })
    });
    const data = await r.json();
    if (!r.ok || !data.success) return msg(data.error || 'Erro ao preparar impressão.', 'error');
    document.querySelectorAll('#lista input:checked').forEach(cb => cb.disabled = true);
    if (data.print_url) window.open(data.print_url, '_blank');
    msg('Relatório preparado com sucesso.', 'success');
}
</script>
</body>
</html>
