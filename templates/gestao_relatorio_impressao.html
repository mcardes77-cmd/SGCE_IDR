<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Relatório de Impressão</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-4 md:p-6">
  <div class="max-w-7xl mx-auto space-y-5">
    <header class="flex flex-col md:flex-row md:items-end md:justify-between gap-4">
      <div>
        <h1 class="text-2xl font-bold text-emerald-400">RELATÓRIO DE IMPRESSÃO</h1>
        <p class="text-slate-400">Filtre por sala e aluno para gerar o relatório de ocorrências.</p>
      </div>
      <div class="flex flex-wrap gap-2"><a href="/gestao_ocorrencia" class="bg-slate-700 hover:bg-slate-600 px-3 py-2 rounded-lg font-semibold">Voltar</a></div>
    </header>

    <section class="bg-slate-800 rounded-xl p-4 border border-slate-700">
      <div class="grid grid-cols-1 md:grid-cols-4 gap-3">
        <div><label class="block text-xs text-slate-400 mb-1">Sala</label><select id="filtroSala" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2"><option value="">Todas as salas</option></select></div>
        <div><label class="block text-xs text-slate-400 mb-1">Aluno</label><select id="filtroAluno" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2"><option value="">Todos os alunos</option></select></div>
        <div><label class="block text-xs text-slate-400 mb-1">Status</label><select id="filtroStatus" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2"><option value="">Todos</option><option value="ATENDIMENTO">ATENDIMENTO</option><option value="FINALIZADA">FINALIZADA</option><option value="ASSINADA">ASSINADA</option></select></div>
        <div class="flex items-end"><button onclick="limparFiltros()" class="w-full bg-slate-700 hover:bg-slate-600 px-4 py-2 rounded-lg font-semibold">Limpar filtros</button></div>
      </div>
    </section>

    <section class="bg-slate-800 rounded-xl p-4 border border-slate-700">
      <div class="mb-4 text-sm text-slate-400">Selecione as ocorrências para gerar o PDF.</div>
      <div class="overflow-x-auto">
        <table class="w-full text-sm">
          <thead><tr class="border-b border-slate-700 text-slate-300"><th class="py-2 px-2"></th><th class="text-left py-2 px-2">Nº</th><th class="text-left py-2 px-2">Data</th><th class="text-left py-2 px-2">Aluno</th><th class="text-left py-2 px-2">Sala</th><th class="text-left py-2 px-2">Status</th></tr></thead>
          <tbody id="body"></tbody>
        </table>
      </div>
      <div class="mt-4 flex flex-wrap gap-2">
        <button onclick="selecionarVisiveis()" class="bg-blue-700 hover:bg-blue-600 px-4 py-2 rounded-lg font-semibold">Selecionar visíveis</button>
        <button onclick="desmarcarTodos()" class="bg-slate-700 hover:bg-slate-600 px-4 py-2 rounded-lg font-semibold">Desmarcar todos</button>
        <button onclick="gerar()" class="bg-emerald-600 hover:bg-emerald-500 px-4 py-2 rounded-lg font-semibold">Gerar PDF</button>
      </div>
    </section>
  </div>
<script>
let ocorrencias=[], filtradas=[];
function unicoOrdenado(valores){return [...new Set(valores.filter(v=>(v||'').toString().trim()!==''))].sort((a,b)=>a.localeCompare(b,'pt-BR'));}
function preencherSelect(selectId,valores,placeholder){const select=document.getElementById(selectId);select.innerHTML=`<option value="">${placeholder}</option>`;unicoOrdenado(valores).forEach(v=>{const option=document.createElement('option');option.value=v;option.textContent=v;select.appendChild(option);});}
function montarFiltroSalas(){preencherSelect('filtroSala', ocorrencias.map(o=>o.sala_nome||''), 'Todas as salas');}
function montarFiltroAlunosPorSala(){const sala=document.getElementById('filtroSala').value;const base=sala?ocorrencias.filter(o=>(o.sala_nome||'')===sala):ocorrencias;preencherSelect('filtroAluno', base.map(o=>o.aluno_nome||''), 'Todos os alunos');}
function aplicarFiltros(){const sala=document.getElementById('filtroSala').value;const aluno=document.getElementById('filtroAluno').value;const status=document.getElementById('filtroStatus').value;filtradas=ocorrencias.filter(o=>(!sala||(o.sala_nome||'')===sala)&&(!aluno||(o.aluno_nome||'')===aluno)&&(!status||((o.status||'').toUpperCase()===status)));renderTabela();}
function renderTabela(){const body=document.getElementById('body');if(!filtradas.length){body.innerHTML='<tr><td colspan="6" class="py-4 px-2 text-slate-400">Nenhuma ocorrência encontrada.</td></tr>';return;}body.innerHTML=filtradas.map(o=>`<tr class="border-b border-slate-800"><td class="py-2 px-2"><input type="checkbox" class="ck-ocorrencia" value="${o.numero}" ${o.impressao_pdf?'disabled':''}></td><td class="py-2 px-2">${o.numero||''}</td><td class="py-2 px-2">${String(o.data_hora||'').replace('T',' ').slice(0,16)}</td><td class="py-2 px-2">${o.aluno_nome||''}</td><td class="py-2 px-2">${o.sala_nome||''}</td><td class="py-2 px-2">${o.status||''}</td></tr>`).join('');}
function limparFiltros(){document.getElementById('filtroSala').value='';montarFiltroAlunosPorSala();document.getElementById('filtroAluno').value='';document.getElementById('filtroStatus').value='';aplicarFiltros();}
function selecionarVisiveis(){document.querySelectorAll('.ck-ocorrencia:not(:disabled)').forEach(ck=>ck.checked=true);}
function desmarcarTodos(){document.querySelectorAll('.ck-ocorrencia').forEach(ck=>ck.checked=false);}
async function gerar(){const numeros=[...document.querySelectorAll('.ck-ocorrencia:checked')].map(x=>Number(x.value));if(!numeros.length){alert('Selecione ao menos uma ocorrência.');return;}const r=await fetch('/api/gerar_pdf_ocorrencias',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({numeros})});const j=await r.json();if(!r.ok||!j.success){alert(j.error||'Erro ao gerar PDF.');return;}window.open(j.print_url,'_blank');}
async function carregar(){const r=await fetch('/api/ocorrencias_todas');ocorrencias=await r.json();montarFiltroSalas();montarFiltroAlunosPorSala();filtradas=[...ocorrencias];renderTabela();document.getElementById('filtroSala').addEventListener('change',()=>{montarFiltroAlunosPorSala();document.getElementById('filtroAluno').value='';aplicarFiltros();});document.getElementById('filtroAluno').addEventListener('change',aplicarFiltros);document.getElementById('filtroStatus').addEventListener('change',aplicarFiltros);}
carregar();
</script>
</body>
</html>
