<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Dashboard Geral</title><script src="https://cdn.tailwindcss.com"></script></head><body class="bg-slate-900 text-white min-h-screen p-6"><div class="max-w-7xl mx-auto"><header class="mb-8"><h1 class="text-3xl font-bold text-emerald-400">Dashboard Geral SGCE</h1><p class="text-slate-400">Tela inicial com visão geral do sistema.</p></header><section class="grid grid-cols-1 md:grid-cols-4 xl:grid-cols-8 gap-4 mb-8"><div class="bg-slate-800 rounded-2xl p-5"><div class="text-slate-400 text-sm">Ocorrências</div><div id="kpi-ocorr" class="text-3xl font-bold mt-2">0</div></div><div class="bg-slate-800 rounded-2xl p-5"><div class="text-slate-400 text-sm">Frequências</div><div id="kpi-freq" class="text-3xl font-bold mt-2">0</div></div><div class="bg-slate-800 rounded-2xl p-5"><div class="text-slate-400 text-sm">Presenças</div><div id="kpi-pres" class="text-3xl font-bold mt-2">0</div></div><div class="bg-slate-800 rounded-2xl p-5"><div class="text-slate-400 text-sm">Faltas</div><div id="kpi-falt" class="text-3xl font-bold mt-2">0</div></div><div class="bg-slate-800 rounded-2xl p-5"><div class="text-slate-400 text-sm">Tutoria</div><div id="kpi-tut" class="text-3xl font-bold mt-2">0</div></div><div class="bg-slate-800 rounded-2xl p-5"><div class="text-slate-400 text-sm">Alunos</div><div id="kpi-alu" class="text-3xl font-bold mt-2">0</div></div><div class="bg-slate-800 rounded-2xl p-5"><div class="text-slate-400 text-sm">Salas</div><div id="kpi-sal" class="text-3xl font-bold mt-2">0</div></div><div class="bg-slate-800 rounded-2xl p-5"><div class="text-slate-400 text-sm">Funcionários</div><div id="kpi-fun" class="text-3xl font-bold mt-2">0</div></div></section><section class="grid grid-cols-1 md:grid-cols-4 gap-4"><a href="/gestao_ocorrencia" class="rounded-2xl p-6 shadow bg-red-600 hover:bg-red-700 transition">📘 Ocorrências</a><a href="/gestao_frequencia_avancada" class="rounded-2xl p-6 shadow bg-blue-600 hover:bg-blue-700 transition">📊 Frequência</a><a href="/gestao_tutoria" class="rounded-2xl p-6 shadow bg-emerald-600 hover:bg-emerald-700 transition">🧠 Tutoria</a><a href="/gestao_cadastro" class="rounded-2xl p-6 shadow bg-amber-500 hover:bg-amber-600 transition text-black">🗂️ Cadastro</a></section></div><script>document.addEventListener('DOMContentLoaded', async ()=>{const r=await fetch('/api/dashboard_geral');const d=await r.json();document.getElementById('kpi-ocorr').textContent=d.ocorrencias||0;document.getElementById('kpi-freq').textContent=d.frequencias||0;document.getElementById('kpi-pres').textContent=d.presencas||0;document.getElementById('kpi-falt').textContent=d.faltas||0;document.getElementById('kpi-tut').textContent=d.atendimentos_tutoria||0;document.getElementById('kpi-alu').textContent=d.alunos||0;document.getElementById('kpi-sal').textContent=d.salas||0;document.getElementById('kpi-fun').textContent=d.funcionarios||0;});</script></body></html>
