<!DOCTYPE html>
<html lang="pt-BR">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Dashboard Geral</title><script src="https://cdn.tailwindcss.com"></script></head>
<body class="bg-slate-900 text-white min-h-screen p-6">
<div class="max-w-7xl mx-auto">
<header class="mb-8"><h1 class="text-3xl font-bold text-emerald-400">Dashboard Geral SGCE</h1><p class="text-slate-400">Visão geral do sistema sem alterar o módulo atual de ocorrências.</p></header>
<section class="grid grid-cols-1 md:grid-cols-3 xl:grid-cols-6 gap-4 mb-8">
  <div class="bg-slate-800 rounded-2xl p-5"><div class="text-slate-400 text-sm">Ocorrências</div><div id="kpi-ocorr" class="text-3xl font-bold mt-2">0</div></div>
  <div class="bg-slate-800 rounded-2xl p-5"><div class="text-slate-400 text-sm">Frequências</div><div id="kpi-freq" class="text-3xl font-bold mt-2">0</div></div>
  <div class="bg-slate-800 rounded-2xl p-5"><div class="text-slate-400 text-sm">Presenças</div><div id="kpi-pres" class="text-3xl font-bold mt-2">0</div></div>
  <div class="bg-slate-800 rounded-2xl p-5"><div class="text-slate-400 text-sm">Faltas</div><div id="kpi-falt" class="text-3xl font-bold mt-2">0</div></div>
  <div class="bg-slate-800 rounded-2xl p-5"><div class="text-slate-400 text-sm">Tutoria</div><div id="kpi-tut" class="text-3xl font-bold mt-2">0</div></div>
  <div class="bg-slate-800 rounded-2xl p-5"><div class="text-slate-400 text-sm">Informativos</div><div id="kpi-info" class="text-3xl font-bold mt-2">0</div></div>
</section>
<section class="grid grid-cols-1 md:grid-cols-4 gap-4">
  <a href="/gestao_ocorrencia" class="bg-slate-800 hover:bg-slate-700 rounded-2xl p-5">Ocorrências</a>
  <a href="/gestao_frequencia_avancada" class="bg-slate-800 hover:bg-slate-700 rounded-2xl p-5">Frequência</a>
  <a href="/gestao_tutoria" class="bg-slate-800 hover:bg-slate-700 rounded-2xl p-5">Tutoria</a>
  <a href="/informativos" class="bg-slate-800 hover:bg-slate-700 rounded-2xl p-5">Informativos</a>
</section>
</div>
<script>
document.addEventListener('DOMContentLoaded', async ()=>{
 const r = await fetch('/api/dashboard_geral');
 const d = await r.json();
 document.getElementById('kpi-ocorr').textContent = d.ocorrencias || 0;
 document.getElementById('kpi-freq').textContent = d.frequencias || 0;
 document.getElementById('kpi-pres').textContent = d.presencas || 0;
 document.getElementById('kpi-falt').textContent = d.faltas || 0;
 document.getElementById('kpi-tut').textContent = d.atendimentos_tutoria || 0;
 document.getElementById('kpi-info').textContent = d.informativos || 0;
});
</script>
</body></html>
