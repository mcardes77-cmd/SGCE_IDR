<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Ocorrência - Fluxo de Atendimento</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'dark-primary': '#0F172A',
                        'dark-secondary': '#1E293B',
                        'accent': '#10B981',
                        'text-light': '#F8FAFC',
                        'tutor-color': '#007ACC',
                        'coord-color': '#F59E0B',
                        'gestao-color': '#EF4444',
                        'responsavel-color': '#8B5CF6'
                    },
                },
            },
        };
    </script>
    <style>
        .form-input, .form-textarea {
            background-color: #374151;
            color: #F8FAFC;
            border: 1px solid #4B5563;
            padding: 0.5rem;
            border-radius: 0.375rem;
            width: 100%;
            transition: all 0.3s ease;
        }
        .readonly {
            background-color: #1F2937;
            cursor: not-allowed;
            opacity: 0.7;
        }
        .editable {
            background-color: #374151;
            border-color: #10B981;
            box-shadow: 0 0 0 2px rgba(16, 185, 129, 0.2);
        }
        .badge-nivel {
            display: inline-block;
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: bold;
            margin-left: 0.5rem;
        }
        .acao-btn {
            transition: all 0.2s;
            font-weight: 600;
            padding: 0.6rem 1.2rem;
            border-radius: 0.375rem;
            font-size: 0.85rem;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .btn-finalizar { background-color: #10B981; color: white; }
        .btn-encaminhar { background-color: #4B5563; color: white; }
        .btn-responsavel { background-color: #8B5CF6; color: white; }
        
        .acao-btn:hover { transform: translateY(-1px); filter: brightness(1.1); }
    </style>
</head>
<body class="bg-dark-primary text-text-light min-h-screen p-4">
    <div class="max-w-4xl mx-auto">
        <header class="text-center mb-8">
            <h1 class="text-2xl font-bold text-accent">ATENDIMENTO DA OCORRÊNCIA <span id="badge-nivel" class="badge-nivel hidden"></span></h1>
            <button onclick="window.location.href='/gestao_ocorrencia'" class="mt-4 bg-gray-600 hover:bg-gray-700 px-4 py-2 rounded text-sm text-white transition">
                ← Voltar para Gestão
            </button>
        </header>

        <div class="bg-dark-secondary p-6 rounded-lg shadow-xl">
            <div id="mensagem-status" class="hidden mb-4 p-3 rounded text-sm font-bold text-center"></div>
            
            <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6 border-b border-gray-700 pb-4">
                <div>
                    <p class="text-xs text-gray-500 uppercase font-bold">Número</p>
                    <p id="numero" class="text-accent font-mono">---</p>
                </div>
                <div>
                    <p class="text-xs text-gray-500 uppercase font-bold">Aluno</p>
                    <p id="aluno" class="text-sm">---</p>
                </div>
                <div>
                    <p class="text-xs text-gray-500 uppercase font-bold">Sala</p>
                    <p id="sala" class="text-sm">---</p>
                </div>
                <div>
                    <p class="text-xs text-gray-500 uppercase font-bold">Status Atual</p>
                    <p id="status" class="text-sm font-bold">---</p>
                </div>
            </div>

            <div class="mb-6">
                <label class="block text-sm text-gray-400 mb-1">Relato Original (Professor)</label>
                <div id="descricao-relato" class="p-3 bg-gray-900/50 rounded text-sm text-gray-300 italic border-l-4 border-accent">
                    Carregando relato...
                </div>
            </div>

            <form id="form-fluxo">
                <div class="space-y-4">
                    <div>
                        <label class="block text-xs font-bold text-gray-500 mb-1 uppercase">Ações Iniciais do Professor</label>
                        <textarea id="atendimento_professor" class="form-textarea readonly text-sm" rows="2" readonly></textarea>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div class="p-3 rounded bg-gray-800/40">
                            <label class="block text-xs font-bold text-tutor-color mb-1 uppercase">Atendimento Tutor</label>
                            <textarea id="atendimento_tutor" class="form-textarea readonly text-sm" rows="4" placeholder="Aguardando setor..."></textarea>
                        </div>
                        <div class="p-3 rounded bg-gray-800/40">
                            <label class="block text-xs font-bold text-coord-color mb-1 uppercase">Atendimento Coordenação</label>
                            <textarea id="atendimento_coordenacao" class="form-textarea readonly text-sm" rows="4" placeholder="Aguardando setor..."></textarea>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div class="p-3 rounded bg-gray-800/40">
                            <label class="block text-xs font-bold text-gestao-color mb-1 uppercase">Atendimento Gestão</label>
                            <textarea id="atendimento_gestao" class="form-textarea readonly text-sm" rows="4" placeholder="Aguardando setor..."></textarea>
                        </div>
                        <div class="p-3 rounded bg-gray-800/40">
                            <label class="block text-xs font-bold text-responsavel-color mb-1 uppercase">Ciência do Responsável</label>
                            <textarea id="atendimento_responsavel" class="form-textarea readonly text-sm" rows="4" placeholder="Aguardando convocação..."></textarea>
                        </div>
                    </div>
                </div>

                <div class="mt-8 pt-6 border-t border-gray-700">
                    <p class="text-sm text-gray-400 mb-4 font-medium" id="label-acoes">Ações disponíveis para o seu nível:</p>
                    <div id="acoes-container" class="flex flex-wrap gap-3">
                        </div>
                </div>
            </form>
        </div>
    </div>

    <script>
        let ocorrenciaId = null;
        let nivelAtual = null;

        const configSetores = {
            'T': { campo: 'atendimento_tutor', nome: 'TUTOR', cor: 'bg-tutor-color', tipo: 'tutor' },
            'C': { campo: 'atendimento_coordenacao', nome: 'COORDENAÇÃO', cor: 'bg-coord-color', tipo: 'coordenacao' },
            'G': { campo: 'atendimento_gestao', nome: 'GESTÃO', cor: 'bg-gestao-color', tipo: 'gestao' },
            'R': { campo: 'atendimento_responsavel', nome: 'RESPONSÁVEL', cor: 'bg-responsavel-color', tipo: 'responsavel' }
        };

        async function init() {
            const params = new URLSearchParams(window.location.search);
            const numero = params.get('id');
            nivelAtual = params.get('nivel');

            if (!numero || !nivelAtual) {
                renderMsg('Dados insuficientes na URL.', 'error');
                return;
            }

            try {
                const res = await fetch(`/api/ocorrencia_detalhes?numero=${numero}`);
                const data = await res.json();
                
                if (data.error) throw new Error(data.error);
                
                ocorrenciaId = data.id;
                preencherCampos(data);
                configurarInterface(nivelAtual);
            } catch (e) {
                renderMsg(e.message, 'error');
            }
        }

        function preencherCampos(d) {
            document.getElementById('numero').textContent = `#${d.numero}`;
            document.getElementById('aluno').textContent = d.aluno_nome;
            document.getElementById('sala').textContent = d.sala_nome;
            document.getElementById('status').textContent = d.status;
            document.getElementById('descricao-relato').textContent = d.descricao;
            
            document.getElementById('atendimento_professor').value = d.atendimento_professor || '';
            document.getElementById('atendimento_tutor').value = d.atendimento_tutor || '';
            document.getElementById('atendimento_coordenacao').value = d.atendimento_coordenacao || '';
            document.getElementById('atendimento_gestao').value = d.atendimento_gestao || '';
            document.getElementById('atendimento_responsavel').value = d.atendimento_responsavel || '';
        }

        function configurarInterface(nivel) {
            const config = configSetores[nivel];
            if (!config) return;

            // Habilitar campo do nível
            const txt = document.getElementById(config.campo);
            txt.readOnly = false;
            txt.classList.remove('readonly');
            txt.classList.add('editable');
            txt.placeholder = "Escreva o atendimento aqui...";

            // Badge
            const badge = document.getElementById('badge-nivel');
            badge.textContent = config.nome;
            badge.classList.add(config.cor);
            badge.classList.remove('hidden');

            gerarBotoes(nivel);
        }

        function gerarBotoes(nivel) {
            const container = document.getElementById('acoes-container');
            container.innerHTML = '';

            const botoes = [
                { label: 'Finalizar Ocorrência', acao: 'finalizar', classe: 'btn-finalizar' }
            ];

            // Adiciona encaminhamentos conforme sua regra
            if (nivel === 'T') {
                botoes.push({ label: 'Enviar p/ Coordenação', acao: 'encaminhar_coordenacao', classe: 'btn-encaminhar' });
                botoes.push({ label: 'Enviar p/ Gestão', acao: 'encaminhar_gestao', classe: 'btn-encaminhar' });
            } 
            else if (nivel === 'C') {
                botoes.push({ label: 'Enviar p/ Tutor', acao: 'encaminhar_tutor', classe: 'btn-encaminhar' });
                botoes.push({ label: 'Enviar p/ Gestão', acao: 'encaminhar_gestao', classe: 'btn-encaminhar' });
            }
            else if (nivel === 'G') {
                botoes.push({ label: 'Enviar p/ Tutor', acao: 'encaminhar_tutor', classe: 'btn-encaminhar' });
                botoes.push({ label: 'Enviar p/ Coordenação', acao: 'encaminhar_coordenacao', classe: 'btn-encaminhar' });
                botoes.push({ label: 'Convocar Responsável', acao: 'convocar_responsavel', classe: 'btn-responsavel' });
            }

            botoes.forEach(b => {
                const btn = document.createElement('button');
                btn.className = `acao-btn ${b.classe}`;
                btn.textContent = b.label;
                btn.onclick = () => processarAcao(b.acao);
                container.appendChild(btn);
            });
        }

        async function processarAcao(acao) {
            const config = configSetores[nivelAtual];
            const texto = document.getElementById(config.campo).value;

            if (!texto.trim()) {
                renderMsg('O campo de atendimento não pode estar vazio.', 'error');
                return;
            }

            if (!confirm(`Deseja confirmar a ação: ${acao.replace('_', ' ').toUpperCase()}?`)) return;

            try {
                const res = await fetch(`/api/ocorrencias/${ocorrenciaId}/atendimento`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        tipo: config.tipo,
                        texto: texto.trim(),
                        acao: acao
                    })
                });

                const data = await res.json();
                if (data.ok) {
                    renderMsg('Atendimento registrado com sucesso!', 'success');
                    setTimeout(() => window.location.href = '/gestao_ocorrencia', 1500);
                } else {
                    throw new Error(data.error);
                }
            } catch (e) {
                renderMsg(e.message, 'error');
            }
        }

        function renderMsg(t, tipo) {
            const el = document.getElementById('mensagem-status');
            el.textContent = t;
            el.className = `mb-4 p-3 rounded text-sm font-bold text-center ${tipo === 'success' ? 'bg-emerald-600 text-white' : 'bg-red-600 text-white'}`;
            el.classList.remove('hidden');
        }

        window.onload = init;
    </script>
</body>
</html>
