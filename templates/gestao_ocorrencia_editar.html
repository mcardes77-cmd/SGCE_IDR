<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Ocorrência</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen p-4 md:p-6 text-sm">
<div class="max-w-5xl mx-auto">
    <header class="text-center mb-6">
        <h1 class="text-2xl font-bold text-emerald-400">Atendimento da Ocorrência</h1>
        <div class="mt-3 flex flex-wrap justify-center gap-2">
            <button onclick="window.location.href='/gestao_ocorrencia'" class="bg-slate-700 hover:bg-slate-600 px-3 py-2 rounded-lg text-xs">← Voltar para Gestão</button>
            <button onclick="window.location.href='/dashboard'" class="bg-blue-700 hover:bg-blue-600 px-3 py-2 rounded-lg text-xs">Dashboard</button>
        </div>
    </header>

    <div class="bg-slate-800 rounded-2xl shadow p-4 md:p-5 border border-slate-700">
        <div id="msg" class="hidden mb-4 px-4 py-3 rounded-lg"></div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-3 mb-4">
            <div><label class="block text-xs text-slate-300 mb-1">Número</label><input id="numero" class="w-full rounded-lg bg-slate-900 border border-slate-700 p-2 text-xs" readonly></div>
            <div><label class="block text-xs text-slate-300 mb-1">Status</label><input id="status" class="w-full rounded-lg bg-slate-900 border border-slate-700 p-2 text-xs" readonly></div>
        </div>

        <div class="mb-4"><label class="block text-xs text-slate-300 mb-1">Aluno</label><input id="aluno_nome" class="w-full rounded-lg bg-slate-900 border border-slate-700 p-2 text-xs" readonly></div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-3 mb-4">
            <div><label class="block text-xs text-slate-300 mb-1">Sala</label><input id="sala_nome" class="w-full rounded-lg bg-slate-900 border border-slate-700 p-2 text-xs" readonly></div>
            <div><label class="block text-xs text-slate-300 mb-1">Tutor</label><input id="tutor_nome" class="w-full rounded-lg bg-slate-900 border border-slate-700 p-2 text-xs" readonly></div>
        </div>

        <div class="mb-4"><label class="block text-xs text-slate-300 mb-1">Descrição</label><textarea id="descricao" rows="4" class="w-full rounded-lg bg-slate-900 border border-slate-700 p-2 text-xs" readonly></textarea></div>
        <div class="mb-4"><label class="block text-xs text-slate-300 mb-1">Atendimento Professor</label><textarea id="atendimento_professor" rows="3" class="w-full rounded-lg bg-slate-900 border border-slate-700 p-2 text-xs" readonly></textarea></div>

        <div class="grid grid-cols-1 md:grid-cols-4 gap-3 mb-4">
            <div><label class="block text-xs text-blue-300 mb-1">Tutor</label><textarea id="atendimento_tutor" rows="4" class="w-full rounded-lg bg-slate-900 border border-slate-700 p-2 text-xs" readonly></textarea></div>
            <div><label class="block text-xs text-yellow-300 mb-1">Coordenação</label><textarea id="atendimento_coordenacao" rows="4" class="w-full rounded-lg bg-slate-900 border border-slate-700 p-2 text-xs" readonly></textarea></div>
            <div><label class="block text-xs text-red-300 mb-1">Gestão</label><textarea id="atendimento_gestao" rows="4" class="w-full rounded-lg bg-slate-900 border border-slate-700 p-2 text-xs" readonly></textarea></div>
            <div><label class="block text-xs text-purple-300 mb-1">Responsável</label><textarea id="atendimento_responsavel" rows="4" class="w-full rounded-lg bg-slate-900 border border-slate-700 p-2 text-xs" readonly></textarea></div>
        </div>

        <div class="mb-4"><label class="block text-xs text-slate-300 mb-1">Atendimento Atual *</label><textarea id="parecer_atual" rows="5" class="w-full rounded-lg bg-slate-700 border border-slate-600 p-2 text-xs"></textarea></div>
        <div class="mb-4"><div class="font-semibold text-emerald-400 mb-2 text-sm">Nível em atendimento</div><div id="nivel-atual-box" class="rounded-lg bg-slate-900 border border-slate-700 p-3 text-xs">Carregando...</div></div>
        <div class="mb-5"><div class="font-semibold text-emerald-400 mb-2 text-sm">Ações disponíveis</div><div id="acoes-disponiveis" class="grid grid-cols-1 md:grid-cols-2 gap-3"></div></div>

        <input type="hidden" id="acao_escolhida">
        <input type="hidden" id="nivel_atual">
        <button id="btnSalvar" onclick="salvarAtendimento()" class="w-full bg-emerald-600 hover:bg-emerald-700 px-4 py-3 rounded-lg font-bold text-sm">Salvar atendimento</button>
    </div>
</div>

<script>
let ocorrenciaNumero = null;

document.addEventListener('DOMContentLoaded', () => {
    const params = new URLSearchParams(window.location.search);
    ocorrenciaNumero = params.get('numero');
    if (!ocorrenciaNumero) {
        show('Ocorrência não informada.', 'error');
        return;
    }
    carregarDados();
});

function show(msg, tipo='info') {
    const el = document.getElementById('msg');
    el.textContent = msg;
    el.className = 'mb-4 px-4 py-3 rounded-lg text-white';
    if (tipo === 'error') el.classList.add('bg-red-600');
    else if (tipo === 'success') el.classList.add('bg-green-600');
    else el.classList.add('bg-blue-600');
    el.classList.remove('hidden');
}

function obterNivelPendente(data) {
    const pend = String(data.pendencia || '').toUpperCase();
    if (pend === 'TUTOR') return 'tutor';
    if (pend === 'COORDENACAO') return 'coordenacao';
    if (pend === 'GESTAO') return 'gestao';
    if (pend === 'RESPONSAVEL') return 'responsavel';
    return 'finalizada';
}

function definirAcao(acao, el) {
    document.getElementById('acao_escolhida').value = acao;
    document.querySelectorAll('.acao-card').forEach(c => c.classList.remove('ring-2', 'ring-emerald-400'));
    el.classList.add('ring-2', 'ring-emerald-400');
}

function montarAcoes(nivel) {
    const mapa = {
        tutor: [
            { acao:'finalizar', titulo:'Finalizar Ocorrência', desc:'Concluir a ocorrência com parecer do tutor.', cor:'border-blue-500' },
            { acao:'encaminhar_coordenacao', titulo:'Gerar Pendência Coordenação', desc:'Encaminhar para análise da coordenação.', cor:'border-yellow-500' },
            { acao:'encaminhar_gestao', titulo:'Gerar Pendência Gestão', desc:'Escalar para a gestão escolar.', cor:'border-red-500' }
        ],
        coordenacao: [
            { acao:'finalizar', titulo:'Finalizar Ocorrência', desc:'Concluir a ocorrência com parecer da coordenação.', cor:'border-yellow-500' },
            { acao:'encaminhar_tutor', titulo:'Gerar Pendência Tutor', desc:'Retornar para o tutor complementar o atendimento.', cor:'border-blue-500' },
            { acao:'encaminhar_gestao', titulo:'Gerar Pendência Gestão', desc:'Encaminhar a ocorrência para a gestão.', cor:'border-red-500' }
        ],
        gestao: [
            { acao:'finalizar', titulo:'Finalizar Ocorrência', desc:'Encerrar a ocorrência com parecer da gestão.', cor:'border-red-500' },
            { acao:'encaminhar_tutor', titulo:'Gerar Pendência Tutor', desc:'Retornar para acompanhamento do tutor.', cor:'border-blue-500' },
            { acao:'encaminhar_coordenacao', titulo:'Gerar Pendência Coordenação', desc:'Encaminhar para a coordenação.', cor:'border-yellow-500' },
            { acao:'convocar_responsavel', titulo:'Gerar Pendência Responsável', desc:'Solicitar ciência e comparecimento do responsável.', cor:'border-purple-500' }
        ],
        responsavel: [
            { acao:'finalizar', titulo:'Finalizar Ocorrência', desc:'Encerrar após ciência do responsável.', cor:'border-purple-500' }
        ],
        finalizada: []
    };

    const box = document.getElementById('acoes-disponiveis');
    const btn = document.getElementById('btnSalvar');
    box.innerHTML = '';
    const opcoes = mapa[nivel] || [];

    if (!opcoes.length) {
        box.innerHTML = '<div class="rounded-lg bg-slate-900 border border-slate-700 p-4 text-slate-300 text-xs">Esta ocorrência já está finalizada.</div>';
        btn.disabled = true;
        btn.classList.add('opacity-60', 'cursor-not-allowed');
        return;
    }

    btn.disabled = false;
    btn.classList.remove('opacity-60', 'cursor-not-allowed');

    opcoes.forEach((item, i) => {
        const card = document.createElement('button');
        card.type = 'button';
        card.className = `acao-card text-left rounded-xl border ${item.cor} bg-slate-900 p-3 hover:bg-slate-800 text-xs`;
        card.innerHTML = `<div class="font-bold text-sm">${item.titulo}</div><div class="text-slate-300 mt-1">${item.desc}</div>`;
        card.onclick = () => definirAcao(item.acao, card);
        box.appendChild(card);
        if (i === 0) definirAcao(item.acao, card);
    });
}

async function carregarDados() {
    try {
        const r = await fetch(`/api/ocorrencia_detalhes?numero=${encodeURIComponent(ocorrenciaNumero)}`);
        const data = await r.json();
        if (!r.ok) throw new Error(data.error || 'Erro ao carregar ocorrência');

        document.getElementById('numero').value = data.numero || '';
        document.getElementById('status').value = data.status || '';
        document.getElementById('aluno_nome').value = data.aluno_nome || '';
        document.getElementById('sala_nome').value = data.sala_nome || '';
        document.getElementById('tutor_nome').value = data.tutor_nome || '';
        document.getElementById('descricao').value = data.descricao || '';
        document.getElementById('atendimento_professor').value = data.atendimento_professor || '';
        document.getElementById('atendimento_tutor').value = data.atendimento_tutor || '';
        document.getElementById('atendimento_coordenacao').value = data.atendimento_coordenacao || '';
        document.getElementById('atendimento_gestao').value = data.atendimento_gestao || '';
        document.getElementById('atendimento_responsavel').value = data.atendimento_responsavel || '';

        const nivel = obterNivelPendente(data);
        document.getElementById('nivel_atual').value = nivel;

        const labels = {
            tutor:'Pendência atual: TUTOR',
            coordenacao:'Pendência atual: COORDENAÇÃO',
            gestao:'Pendência atual: GESTÃO',
            responsavel:'Pendência atual: CONVOCAÇÃO DO RESPONSÁVEL',
            finalizada:'Ocorrência finalizada'
        };
        document.getElementById('nivel-atual-box').textContent = labels[nivel] || 'Pendência atual não identificada';
        montarAcoes(nivel);
    } catch (e) {
        console.error(e);
        show(e.message || 'Erro ao carregar dados da ocorrência', 'error');
    }
}

async function salvarAtendimento() {
    const texto = document.getElementById('parecer_atual').value.trim();
    const acao = document.getElementById('acao_escolhida').value;
    const tipo = document.getElementById('nivel_atual').value;

    if (!texto) {
        show('Preencha o campo de atendimento atual.', 'error');
        return;
    }

    const btn = document.getElementById('btnSalvar');
    btn.disabled = true;
    btn.textContent = 'Salvando...';

    try {
        const r = await fetch(`/api/ocorrencias/${encodeURIComponent(ocorrenciaNumero)}/atendimento`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ tipo, texto, acao })
        });
        const data = await r.json();
        if (!r.ok || !data.success) throw new Error(data.error || 'Erro ao salvar atendimento');
        show('Atendimento salvo com sucesso!', 'success');
        setTimeout(() => window.location.href = '/gestao_ocorrencia', 900);
    } catch (e) {
        console.error(e);
        show(e.message || 'Erro ao salvar atendimento', 'error');
        btn.disabled = false;
        btn.textContent = 'Salvar atendimento';
    }
}
</script>
</body>
</html>
