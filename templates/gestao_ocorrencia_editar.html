<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Ocorrência</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'dark-primary': '#0F172A',
                        'dark-secondary': '#1E293B',
                        'accent': '#10B981',
                        'text-light': '#F8FAFC',
                        'tutor-color': '#3B82F6',
                        'coord-color': '#F59E0B',
                        'gestao-color': '#EF4444',
                        'resp-color': '#8B5CF6'
                    },
                },
            },
        };
    </script>
    <style>
        .form-input, .form-select, .form-textarea {
            background-color: #374151;
            color: #F8FAFC;
            border: 1px solid #4B5563;
            padding: 0.75rem;
            border-radius: 0.375rem;
            width: 100%;
        }
        .form-input:focus, .form-select:focus, .form-textarea:focus {
            outline: none;
            border-color: #10B981;
            box-shadow: 0 0 0 2px rgba(16, 185, 129, 0.2);
        }
        .readonly-box {
            background-color: #111827;
            color: #D1D5DB;
            border: 1px solid #374151;
        }
        .action-card {
            border: 1px solid #4B5563;
            border-radius: 0.75rem;
            padding: 0.9rem;
            transition: all 0.2s ease;
        }
        .action-card:hover {
            transform: translateY(-1px);
            filter: brightness(1.06);
        }
    </style>
</head>
<body class="bg-dark-primary text-text-light min-h-screen p-4">
    <div class="max-w-4xl mx-auto">
        <header class="text-center mb-8">
            <h1 class="text-2xl font-bold text-accent">ATENDIMENTO DA OCORRÊNCIA</h1>
            <button onclick="window.location.href='/gestao_ocorrencia'" class="mt-4 bg-gray-600 hover:bg-gray-700 px-4 py-2 rounded text-white transition duration-200">
                ← Voltar para Ocorrências
            </button>
        </header>

        <div class="bg-dark-secondary p-6 rounded-lg shadow-lg">
            <div id="mensagem-status" class="hidden mb-4 p-3 rounded text-sm"></div>

            <form id="form-ocorrencia-edicao">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
                    <div>
                        <label class="block text-sm text-gray-300 mb-2">Número da Ocorrência</label>
                        <input id="numero" class="form-input readonly-box" readonly>
                    </div>
                    <div>
                        <label class="block text-sm text-gray-300 mb-2">Status Atual</label>
                        <input id="status" class="form-input readonly-box" readonly>
                    </div>
                </div>

                <div class="mb-6">
                    <label class="block text-sm text-gray-300 mb-2">Aluno</label>
                    <input id="aluno_nome" class="form-input readonly-box" readonly>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
                    <div>
                        <label class="block text-sm text-gray-300 mb-2">Sala</label>
                        <input id="sala_nome" class="form-input readonly-box" readonly>
                    </div>
                    <div>
                        <label class="block text-sm text-gray-300 mb-2">Tutor</label>
                        <input id="tutor_nome" class="form-input readonly-box" readonly>
                    </div>
                </div>

                <div class="mb-6">
                    <label class="block text-sm text-gray-300 mb-2">Descrição da Ocorrência</label>
                    <textarea id="descricao" class="form-textarea readonly-box" rows="4" readonly></textarea>
                </div>

                <div class="mb-6">
                    <label class="block text-sm text-gray-300 mb-2">Atendimento Professor</label>
                    <textarea id="atendimento_professor" class="form-textarea readonly-box" rows="3" readonly></textarea>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-6">
                    <div>
                        <label class="block text-sm text-blue-300 mb-2">Atendimento Tutor</label>
                        <textarea id="atendimento_tutor" class="form-textarea readonly-box" rows="4" readonly></textarea>
                    </div>
                    <div>
                        <label class="block text-sm text-yellow-300 mb-2">Atendimento Coordenação</label>
                        <textarea id="atendimento_coordenacao" class="form-textarea readonly-box" rows="4" readonly></textarea>
                    </div>
                    <div>
                        <label class="block text-sm text-red-300 mb-2">Atendimento Gestão</label>
                        <textarea id="atendimento_gestao" class="form-textarea readonly-box" rows="4" readonly></textarea>
                    </div>
                    <div>
                        <label class="block text-sm text-purple-300 mb-2">Atendimento Responsável</label>
                        <textarea id="atendimento_responsavel" class="form-textarea readonly-box" rows="4" readonly></textarea>
                    </div>
                </div>

                <div class="mb-6">
                    <label class="block text-sm text-gray-300 mb-2">Atendimento Atual *</label>
                    <textarea id="parecer_atual" class="form-textarea" rows="5" placeholder="Descreva as medidas tomadas, encaminhamentos e conclusão..." required></textarea>
                </div>

                <div class="mb-6">
                    <h3 class="text-lg font-semibold mb-3 text-accent">Nível em atendimento</h3>
                    <div id="nivel-atual-box" class="p-3 rounded bg-gray-800 border border-gray-700 text-gray-200 font-medium">
                        Carregando...
                    </div>
                </div>

                <div class="mb-6">
                    <h3 class="text-lg font-semibold mb-3 text-accent">Ações disponíveis</h3>
                    <div id="acoes-disponiveis" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
                </div>

                <input type="hidden" id="acao_escolhida">
                <input type="hidden" id="nivel_atual">

                <button type="button" id="btnSalvar" onclick="salvarAtendimento()" class="w-full bg-accent hover:bg-emerald-700 py-3 rounded font-bold text-white transition duration-200">
                    SALVAR ATENDIMENTO
                </button>
            </form>
        </div>

        <footer class="w-full text-center mt-10 p-4 text-gray-400 text-sm border-t border-gray-800">
            <p class="mb-1 text-base font-medium">DESENVOLVEDOR: MARCELO ANDRÉ NOGUEIRA CARDES</p>
            <p class="text-xs font-light tracking-wide">LICENCIADO: E.E. PEI PROFESSORA IRENE DIAS RIBEIRO</p>
        </footer>
    </div>

    <script>
        let ocorrenciaId = null;
        let dadosOcorrencia = null;

        document.addEventListener('DOMContentLoaded', function() {
            const params = new URLSearchParams(window.location.search);
            ocorrenciaId = params.get('id') || params.get('numero') || window.location.pathname.split('/').pop();
            carregarDados();
        });

        function mostrarMensagem(mensagem, tipo) {
            const elemento = document.getElementById('mensagem-status');
            elemento.textContent = mensagem;
            elemento.className = 'mb-4 p-3 rounded text-sm ';
            if (tipo === 'success') elemento.classList.add('bg-green-600', 'text-white');
            else if (tipo === 'error') elemento.classList.add('bg-red-600', 'text-white');
            else elemento.classList.add('bg-blue-600', 'text-white');
            elemento.classList.remove('hidden');
            setTimeout(() => elemento.classList.add('hidden'), 5000);
        }

        function definirAcao(acao, el) {
            document.getElementById('acao_escolhida').value = acao;
            document.querySelectorAll('.action-card').forEach(card => {
                card.classList.remove('ring-2', 'ring-accent', 'bg-emerald-900/30');
            });
            el.classList.add('ring-2', 'ring-accent', 'bg-emerald-900/30');
        }

        function obterNivelPendente(data) {
            if (data.pendencia) {
                const pend = String(data.pendencia).toUpperCase();
                if (pend === 'TUTOR') return 'tutor';
                if (pend === 'COORDENACAO') return 'coordenacao';
                if (pend === 'GESTAO') return 'gestao';
                if (pend === 'RESPONSAVEL') return 'responsavel';
                if (pend === 'FINALIZADA') return 'finalizada';
            }

            if (data.solicitado_tutor && !(data.atendimento_tutor || '').trim()) return 'tutor';
            if (data.solicitado_coordenacao && !(data.atendimento_coordenacao || '').trim()) return 'coordenacao';
            if (data.solicitado_gestao && !(data.atendimento_gestao || '').trim()) return 'gestao';
            if (data.solicitado_responsavel && !(data.atendimento_responsavel || '').trim()) return 'responsavel';
            return 'finalizada';
        }

        function montarAcoes(nivel) {
            const container = document.getElementById('acoes-disponiveis');
            container.innerHTML = '';

            const mapa = {
                tutor: [
                    { acao: 'finalizar', titulo: 'Finalizar Ocorrência', descricao: 'Concluir a ocorrência com parecer do tutor.', cor: 'border-blue-500 text-blue-300' },
                    { acao: 'encaminhar_coordenacao', titulo: 'Gerar Pendência Coordenação', descricao: 'Encaminhar para análise da coordenação.', cor: 'border-yellow-500 text-yellow-300' },
                    { acao: 'encaminhar_gestao', titulo: 'Gerar Pendência Gestão', descricao: 'Escalar para a gestão escolar.', cor: 'border-red-500 text-red-300' }
                ],
                coordenacao: [
                    { acao: 'finalizar', titulo: 'Finalizar Ocorrência', descricao: 'Concluir a ocorrência com parecer da coordenação.', cor: 'border-yellow-500 text-yellow-300' },
                    { acao: 'encaminhar_tutor', titulo: 'Gerar Pendência Tutor', descricao: 'Retornar para o tutor complementar o atendimento.', cor: 'border-blue-500 text-blue-300' },
                    { acao: 'encaminhar_gestao', titulo: 'Gerar Pendência Gestão', descricao: 'Encaminhar a ocorrência para a gestão.', cor: 'border-red-500 text-red-300' }
                ],
                gestao: [
                    { acao: 'finalizar', titulo: 'Finalizar Ocorrência', descricao: 'Encerrar a ocorrência com parecer da gestão.', cor: 'border-red-500 text-red-300' },
                    { acao: 'encaminhar_tutor', titulo: 'Gerar Pendência Tutor', descricao: 'Retornar para acompanhamento do tutor.', cor: 'border-blue-500 text-blue-300' },
                    { acao: 'encaminhar_coordenacao', titulo: 'Gerar Pendência Coordenação', descricao: 'Encaminhar para a coordenação.', cor: 'border-yellow-500 text-yellow-300' },
                    { acao: 'convocar_responsavel', titulo: 'Gerar Pendência Convocação Responsável', descricao: 'Solicitar ciência e comparecimento do responsável.', cor: 'border-purple-500 text-purple-300' }
                ],
                responsavel: [
                    { acao: 'finalizar', titulo: 'Finalizar Ocorrência', descricao: 'Encerrar após ciência do responsável.', cor: 'border-purple-500 text-purple-300' }
                ],
                finalizada: []
            };

            const opcoes = mapa[nivel] || [];
            if (!opcoes.length) {
                container.innerHTML = '<div class="p-4 rounded bg-gray-800 border border-gray-700 text-gray-300">Esta ocorrência já está finalizada.</div>';
                document.getElementById('btnSalvar').disabled = true;
                document.getElementById('btnSalvar').classList.add('opacity-60', 'cursor-not-allowed');
                return;
            }

            document.getElementById('btnSalvar').disabled = false;
            document.getElementById('btnSalvar').classList.remove('opacity-60', 'cursor-not-allowed');

            opcoes.forEach((item, index) => {
                const card = document.createElement('button');
                card.type = 'button';
                card.className = `action-card text-left bg-gray-800 ${item.cor}`;
                card.innerHTML = `<div class="font-bold">${item.titulo}</div><div class="text-sm opacity-90 mt-1">${item.descricao}</div>`;
                card.onclick = () => definirAcao(item.acao, card);
                container.appendChild(card);

                if (index === 0) definirAcao(item.acao, card);
            });
        }

        async function carregarDados() {
            try {
                const response = await fetch(`/api/ocorrencia_detalhes?numero=${ocorrenciaId}`);
                if (!response.ok) throw new Error('Erro ao carregar ocorrência');
                const data = await response.json();
                dadosOcorrencia = data;

                document.getElementById('numero').value = data.numero || '';
                document.getElementById('status').value = data.status || '';
                document.getElementById('aluno_nome').value = data.aluno_nome || '';
                document.getElementById('sala_nome').value = data.sala_nome || '';
                document.getElementById('tutor_nome').value = data.tutor_nome || '';
                document.getElementById('descricao').value = data.descricao || '';
                document.getElementById('atendimento_professor').value = data.atendimento_professor || '';
                document.getElementById('atendimento_tutor').value = data.atendimento_tutor || '';
                document.getElementById('atendimento_coordenacao').value = data.atendimento_coordenacao || '';
                document.getElementById('atendimento_gestao').value = data.atendimento_gestao || '';
                const campoResponsavel = document.getElementById('atendimento_responsavel');
                if (campoResponsavel) campoResponsavel.value = data.atendimento_responsavel || '';

                const nivel = obterNivelPendente(data);
                document.getElementById('nivel_atual').value = nivel;

                const box = document.getElementById('nivel-atual-box');
                const labels = {
                    tutor: 'Pendência atual: TUTOR',
                    coordenacao: 'Pendência atual: COORDENAÇÃO',
                    gestao: 'Pendência atual: GESTÃO',
                    responsavel: 'Pendência atual: CONVOCAÇÃO DO RESPONSÁVEL',
                    finalizada: 'Ocorrência finalizada'
                };
                box.textContent = labels[nivel] || 'Pendência atual não identificada';

                montarAcoes(nivel);
            } catch (error) {
                console.error(error);
                mostrarMensagem('Erro ao carregar dados da ocorrência', 'error');
            }
        }

        async function salvarAtendimento() {
            const parecer = document.getElementById('parecer_atual').value.trim();
            const acao = document.getElementById('acao_escolhida').value;
            const nivel = document.getElementById('nivel_atual').value;
            const botao = document.getElementById('btnSalvar');

            if (!parecer) {
                mostrarMensagem('Preencha o campo de atendimento atual.', 'error');
                return;
            }

            if (!acao) {
                mostrarMensagem('Selecione uma ação.', 'error');
                return;
            }

            botao.disabled = true;
            botao.textContent = 'SALVANDO...';
            botao.classList.add('opacity-70', 'cursor-not-allowed');

            try {
                const response = await fetch(`/api/ocorrencias/${ocorrenciaId}/atendimento`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        tipo: nivel,
                        texto: parecer,
                        acao: acao
                    })
                });

                const result = await response.json().catch(() => ({}));

                if (response.ok) {
                    mostrarMensagem('Atendimento salvo com sucesso! Redirecionando...', 'success');
                    setTimeout(() => {
                        window.location.href = '/gestao_ocorrencia';
                    }, 1500);
                } else {
                    throw new Error(result.error || 'Erro ao salvar atendimento');
                }
            } catch (error) {
                console.error(error);
                mostrarMensagem(error.message || 'Erro de conexão ao salvar atendimento', 'error');
                botao.disabled = false;
                botao.textContent = 'SALVAR ATENDIMENTO';
                botao.classList.remove('opacity-70', 'cursor-not-allowed');
            }
        }
    </script>
</body>
</html>
